<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VetFinder — Tu veterinario, siempre cerca</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--pri:#0A7558;--priD:#065C45;--priL:#E8F5EF;--priG:rgba(10,117,88,.07);--bg:#FAFAF7;--card:#FFF;--txt:#1B1F2A;--sub:#4A5066;--dim:#8B91A8;--xdim:#B8BDD0;--brd:#EAEDF2;--brdL:#F2F3F5;--gold:#E5A100;--goldL:#FFF8E6;--red:#D63B4B;--redL:#FEF0F1;--orange:#E67E22;--sh:0 1px 4px rgba(27,31,42,.06);--shM:0 4px 20px rgba(27,31,42,.08);--shL:0 12px 40px rgba(27,31,42,.12);--r:14px;--rS:10px;--f:'DM Sans',system-ui,sans-serif;--fH:'Outfit',system-ui,sans-serif;--ease:cubic-bezier(.4,0,.2,1)}
html,body{height:100%;overflow:hidden}body{font-family:var(--f);background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
.hdr{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--brd);z-index:1000;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}.brand-icon{width:36px;height:36px;background:linear-gradient(145deg,var(--pri),#12A17A);border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(10,117,88,.25)}.brand-icon svg{fill:#fff;width:18px;height:18px}.brand-txt{font:800 19px/1 var(--fH);letter-spacing:-.5px}.brand-txt em{font-style:normal;color:var(--pri)}
.srch{flex:1;max-width:420px;position:relative}.srch input{width:100%;padding:10px 16px 10px 40px;border:1.5px solid var(--brd);border-radius:var(--rS);background:var(--bg);font:500 13px/1 var(--f);color:var(--txt);outline:none;transition:all .2s}.srch input:focus{border-color:var(--pri);background:var(--card);box-shadow:0 0 0 3px var(--priG)}.srch input::placeholder{color:var(--xdim)}.srch-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--xdim)}
.hdr-r{display:flex;gap:6px;margin-left:auto;align-items:center}.hdr-stat{text-align:center;padding:0 10px}.hdr-stat b{display:block;font:800 17px/1 var(--fH);color:var(--pri)}.hdr-stat small{font:500 9px/1 var(--f);color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.main{display:flex;flex:1;overflow:hidden}
.side{width:450px;min-width:450px;display:flex;flex-direction:column;border-right:1px solid var(--brd);background:var(--card);z-index:500}
.fbar{padding:10px 16px;border-bottom:1px solid var(--brd);display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 14px;border-radius:20px;font:600 11px/1 var(--f);cursor:pointer;border:1.5px solid var(--brd);background:var(--card);color:var(--dim);transition:all .15s;white-space:nowrap}.chip:hover{border-color:var(--pri);color:var(--pri)}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.clist{flex:1;overflow-y:auto;padding:4px 0}.sec{padding:14px 16px 6px;font:700 10px/1 var(--fH);letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}.sec::after{content:'';flex:1;height:1px;background:var(--brd)}.sec .cnt{background:var(--priL);color:var(--pri);font:700 10px/1 var(--f);padding:2px 8px;border-radius:10px;letter-spacing:0}
.cc{margin:5px 12px;padding:14px 16px;background:var(--card);border:1.5px solid var(--brd);border-radius:var(--r);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}.cc:hover{border-color:var(--pri);box-shadow:var(--shM);transform:translateY(-1px)}.cc.feat{background:linear-gradient(135deg,#FAFFF9,#F0FBF5);border-color:rgba(10,117,88,.2)}.cc.feat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),#1ED4A0)}.cc.active{border-color:var(--pri);box-shadow:0 0 0 3px var(--priG),var(--shM)}
.cc-photo{width:100%;height:130px;border-radius:var(--rS);object-fit:cover;margin-bottom:10px;background:var(--brdL)}
.cc-name{font:700 14px/1.25 var(--fH);letter-spacing:-.2px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-addr{font:500 11px/1.2 var(--f);color:var(--dim);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-meta{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.cc-stars{color:var(--gold);font-size:12px;letter-spacing:-1px}.cc-r{font:700 13px/1 var(--fH)}.cc-rc{font:500 11px/1 var(--f);color:var(--dim)}
.badge{font:700 9px/1 var(--f);padding:3px 8px;border-radius:5px;display:inline-flex;align-items:center;gap:2px}.b-mv{background:linear-gradient(135deg,var(--pri),#0EAA7A);color:#fff}.b-24{background:var(--goldL);color:#8B6914}.b-open{background:#E8F5EF;color:var(--pri)}.b-closed{background:var(--redL);color:var(--red)}
.cc-btns{display:flex;gap:6px;margin-top:8px}.cc-bp{flex:1;padding:9px;border-radius:var(--rS);border:none;background:var(--pri);color:#fff;font:700 12px/1 var(--f);cursor:pointer;transition:all .15s}.cc-bp:hover{background:var(--priD)}.cc-bs{padding:9px 12px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);font:600 12px/1 var(--f);color:var(--sub);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:4px}
.map-area{flex:1;position:relative}#map{width:100%;height:100%}
.loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:600 14px/1 var(--f);color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:12px}.spinner{width:32px;height:32px;border:3px solid var(--brd);border-top-color:var(--pri);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.emg-fab{position:absolute;bottom:20px;right:20px;z-index:10;padding:12px 20px;border-radius:var(--r);background:linear-gradient(135deg,var(--red),#B52D3A);color:#fff;border:none;font:700 13px/1 var(--f);cursor:pointer;box-shadow:0 4px 20px rgba(214,59,75,.4);display:flex;align-items:center;gap:8px;transition:all .2s}.emg-fab:hover{transform:scale(1.03)}
.dpo{position:fixed;inset:0;background:rgba(27,31,42,.35);backdrop-filter:blur(2px);z-index:2000;display:none;justify-content:flex-end}.dpo.open{display:flex}
.dp{width:480px;background:var(--card);height:100%;overflow-y:auto;box-shadow:var(--shL);animation:slideIn .3s var(--ease)}@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.dp-hero{padding:20px;border-bottom:1px solid var(--brd);position:relative}.dp-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:var(--rS);background:var(--brdL);border:none;cursor:pointer;font-size:18px;color:var(--dim);display:flex;align-items:center;justify-content:center}.dp-close:hover{background:var(--brd)}
.dp-photos{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}.dp-photo{width:160px;height:110px;border-radius:var(--rS);object-fit:cover;flex-shrink:0;background:var(--brdL)}
.dp-name{font:800 19px/1.25 var(--fH);letter-spacing:-.4px;padding-right:40px;margin-bottom:4px}.dp-addr{font:500 12px/1.3 var(--f);color:var(--dim);margin-bottom:8px}
.dp-body{padding:18px 20px}.dp-sect{font:700 13px/1 var(--fH);margin:16px 0 8px}.dp-sect:first-child{margin-top:0}
.dp-hrs{background:var(--bg);border-radius:var(--rS);padding:12px 14px;font-size:12px}.dp-hr-row{display:flex;justify-content:space-between;margin-bottom:4px}.dp-hr-row:last-child{margin:0}
.dp-acts{display:flex;gap:8px;margin-top:16px}.dp-ap{flex:1;padding:13px;border-radius:var(--r);border:none;background:var(--pri);color:#fff;font:700 13px/1 var(--f);cursor:pointer;text-align:center;text-decoration:none;display:block}.dp-ap:hover{background:var(--priD)}.dp-as{flex:1;padding:13px;border-radius:var(--r);border:1.5px solid var(--brd);background:var(--card);font:600 13px/1 var(--f);color:var(--sub);text-align:center;text-decoration:none;display:block}
.dp-review{padding:12px;background:var(--bg);border-radius:var(--rS);margin-bottom:8px}.dp-rv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.dp-rv-name{font:700 12px/1 var(--f)}.dp-rv-txt{font:400 12px/1.5 var(--f);color:var(--sub)}
@media(max-width:960px){.main{flex-direction:column}.side{width:100%;min-width:100%;height:50vh;border-right:none;border-top:1px solid var(--brd);order:2}.map-area{height:50vh;order:1}.hdr-r{display:none}.srch{max-width:none}.dp{width:100%}}
</style>
</head>
<body>
<div class="hdr">
  <div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 3.87 7 13 7 13s7-9.13 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg></div><div class="brand-txt">Vet<em>Finder</em></div></div>
  <div class="srch"><svg class="srch-ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="sI" placeholder="Buscar clínica, zona o servicio..." oninput="renderList()"></div>
  <div class="hdr-r"><div class="hdr-stat"><b id="stT">0</b><small>Clínicas</small></div><div class="hdr-stat"><b id="st24">0</b><small>24h</small></div></div>
</div>
<div class="main">
  <div class="side"><div class="fbar" id="fbar"></div><div class="clist" id="clist"><div class="loading"><div class="spinner"></div>Buscando clínicas cercanas...</div></div></div>
  <div class="map-area"><div id="map"></div><button class="emg-fab" onclick="showEmg()">🚨 Urgencias 24h</button></div>
</div>
<div class="dpo" id="dpo" onclick="closeDP()"><div class="dp" id="dpc" onclick="event.stopPropagation()"></div></div>

<script>
const MV=[
  {pid:"ChIJb8mnOJCFQQ0RsSs1rwnvFck",name:"Hospital Veterinario MadVet",addr:"C. Fresa 2, CC Equinoccio, Majadahonda",lat:40.4545,lng:-3.8758,rating:4.9,rc:261,ph:"+34 682 62 82 38",web:"https://madvet.es",offer:"1ª consulta -50%",mv:1},
  {pid:"ChIJM7K4WZ_RQw0RIkJk6gnQ3Hg",name:"Centro Veterinario MadVet Las 4 Huellas",addr:"Trav. Cuatro Calles 15, San Agustín del Guadalix",lat:40.6796,lng:-3.6174,rating:4.8,rc:307,ph:"+34 911 13 41 49",web:"https://madvet.es",offer:"",mv:1},
  {pid:"ChIJJcHwJj6IQQ0Rm11Up0mqAHM",name:"Centro Veterinario Parque Aluche",addr:"C. de Quero 57, Latina, Madrid",lat:40.3905,lng:-3.7605,rating:4.8,rc:259,ph:"+34 917 17 18 22",web:"https://madvet.es",offer:"Pack vacunación cachorro",mv:1}
];
let gMap,gSvc,all=[],markers=[],activeId=null,filt='all';
const starsH=r=>'★'.repeat(Math.round(r||0))+'☆'.repeat(5-Math.round(r||0));
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);}};

function initMap(){
  gMap=new google.maps.Map(document.getElementById('map'),{
    center:{lat:40.42,lng:-3.7},zoom:10,disableDefaultUI:true,zoomControl:true,
    styles:[{featureType:"poi",stylers:[{visibility:"off"}]},{featureType:"transit",stylers:[{visibility:"off"}]},{featureType:"water",stylers:[{color:"#d4e9f7"}]},{featureType:"landscape",stylers:[{color:"#f0f0ec"}]},{featureType:"road",elementType:"geometry",stylers:[{color:"#ffffff"}]},{featureType:"road",elementType:"labels.text.fill",stylers:[{color:"#9ca5b3"}]}]
  });
  gSvc=new google.maps.places.PlacesService(gMap);
  MV.forEach(mv=>{
    const m=new google.maps.Marker({position:{lat:mv.lat,lng:mv.lng},map:gMap,icon:{path:google.maps.SymbolPath.CIRCLE,scale:14,fillColor:'#0A7558',fillOpacity:1,strokeColor:'#fff',strokeWeight:3},zIndex:1000,title:mv.name});
    m.addListener('click',()=>loadDP(mv.pid));
    mv._m=m;all.push({...mv,_m:m});
  });
  searchArea();
  gMap.addListener('idle',debounce(searchArea,1500));
  renderFilters();
}

function searchArea(){
  const b=gMap.getBounds();if(!b)return;
  gSvc.nearbySearch({location:gMap.getCenter(),radius:getR(),type:'veterinary_care'},(res,st,pg)=>{
    if(st===google.maps.places.PlacesServiceStatus.OK){
      res.forEach(p=>{
        if(all.find(x=>x.pid===p.place_id))return;
        const o=p.opening_hours;
        const pl={pid:p.place_id,name:p.name,addr:p.vicinity||'',lat:p.geometry.location.lat(),lng:p.geometry.location.lng(),rating:p.rating||0,rc:p.user_ratings_total||0,is24:o&&o.periods&&o.periods.length===1&&!o.periods[0].close,isOpen:o?o.isOpen():null,photo:p.photos&&p.photos[0]?p.photos[0].getUrl({maxWidth:400,maxHeight:280}):null,mv:0};
        const m=new google.maps.Marker({position:{lat:pl.lat,lng:pl.lng},map:gMap,icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:pl.is24?'#E67E22':'#8B91A8',fillOpacity:1,strokeColor:'#fff',strokeWeight:2},zIndex:100,title:p.name});
        m.addListener('click',()=>loadDP(pl.pid));
        pl._m=m;all.push(pl);
      });
      if(pg&&pg.hasNextPage)setTimeout(()=>pg.nextPage(),400);
      renderList();
    }
  });
}
function getR(){const b=gMap.getBounds();if(!b)return 15000;return Math.abs((b.getNorthEast().lat()-b.getSouthWest().lat())*111000/2);}

function renderList(){
  const q=(document.getElementById('sI').value||'').toLowerCase();
  let list=all.filter(p=>{
    if(q&&!p.name.toLowerCase().includes(q)&&!(p.addr||'').toLowerCase().includes(q))return false;
    if(filt==='24h'&&!p.is24&&!p.mv)return false;
    if(filt==='open'&&p.isOpen===false)return false;
    if(filt==='top'&&(p.rating||0)<4.5)return false;
    return true;
  }).sort((a,b)=>(b.mv?10:0)-(a.mv?10:0)||((b.rating||0)*Math.log10((b.rc||1)+1))-((a.rating||0)*Math.log10((a.rc||1)+1)));

  document.getElementById('stT').textContent=list.length;
  document.getElementById('st24').textContent=list.filter(p=>p.is24).length;

  const mvL=list.filter(p=>p.mv),rest=list.filter(p=>!p.mv);
  let h='';
  if(mvL.length){h+=`<div class="sec">★ Recomendadas</div>`;mvL.forEach(p=>h+=cardH(p));}
  if(rest.length){h+=`<div class="sec">En tu zona <span class="cnt">${rest.length}</span></div>`;rest.forEach(p=>h+=cardH(p));}
  if(!list.length)h=`<div style="text-align:center;padding:60px;color:var(--dim)">Sin resultados</div>`;
  document.getElementById('clist').innerHTML=h;
  all.forEach(p=>{if(p._m)p._m.setVisible(list.includes(p));});
}

function cardH(p){
  return`<div class="cc ${p.mv?'feat':''} ${activeId===p.pid?'active':''}" onclick="loadDP('${p.pid}')">
${p.photo?`<img class="cc-photo" src="${p.photo}" alt="" loading="lazy">`:''}
<div class="cc-name">${p.name}</div><div class="cc-addr">📍 ${p.addr}</div>
<div class="cc-meta"><span class="cc-stars">${starsH(p.rating)}</span><span class="cc-r">${p.rating||'—'}</span><span class="cc-rc">(${(p.rc||0).toLocaleString()})</span>
${p.mv?'<span class="badge b-mv">★ MadVet</span>':''}${p.is24?'<span class="badge b-24">24h</span>':''}${p.isOpen===true?'<span class="badge b-open">Abierto</span>':''}${p.isOpen===false?'<span class="badge b-closed">Cerrado</span>':''}</div>
${p.offer?`<div style="padding:5px 10px;background:var(--goldL);border-radius:7px;margin-bottom:6px;font:600 11px/1 var(--f);color:#8B6914">🎁 ${p.offer}</div>`:''}
<div class="cc-btns"><button class="cc-bp" onclick="event.stopPropagation();loadDP('${p.pid}')">Ver clínica</button>${p.ph?`<a class="cc-bs" href="tel:${p.ph}" onclick="event.stopPropagation()">📞</a>`:''}</div></div>`;
}

function renderFilters(){
  document.getElementById('fbar').innerHTML=[['all','Todas'],['24h','🕐 24h'],['open','✅ Abiertas'],['top','⭐ Top']].map(([k,l])=>`<button class="chip ${filt===k?'on':''}" onclick="filt='${k}';renderList();renderFilters()">${l}</button>`).join('');
}

function loadDP(pid){
  activeId=pid;renderList();
  const p=all.find(x=>x.pid===pid);
  if(p){gMap.panTo({lat:p.lat,lng:p.lng});if(gMap.getZoom()<14)gMap.setZoom(14);}
  gSvc.getDetails({placeId:pid,fields:['name','formatted_address','formatted_phone_number','website','opening_hours','reviews','photos','rating','user_ratings_total','url']},(d,s)=>{
    if(s===google.maps.places.PlacesServiceStatus.OK)renderDP(d,p);
  });
}

function renderDP(d,p){
  document.getElementById('dpo').classList.add('open');
  const dp=document.getElementById('dpc');
  const nm=d.name||p?.name||'';const addr=d.formatted_address||p?.addr||'';
  const ph=d.formatted_phone_number||p?.ph||'';const web=d.website||p?.web||'';
  const rat=d.rating||p?.rating||0;const rc=d.user_ratings_total||p?.rc||0;
  const gUrl=d.url||'';const photos=d.photos||[];const reviews=d.reviews||[];const hrs=d.opening_hours;

  let h=`<div class="dp-hero"><button class="dp-close" onclick="closeDP()">✕</button>`;
  if(photos.length){h+=`<div class="dp-photos">`;photos.slice(0,5).forEach(ph=>{h+=`<img class="dp-photo" src="${ph.getUrl({maxWidth:400,maxHeight:280})}" loading="lazy">`;});h+=`</div>`;}
  h+=`<div class="dp-name">${nm}</div><div class="dp-addr">📍 ${addr}</div>`;
  h+=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="color:var(--gold)">${starsH(rat)}</span><b style="font:700 14px/1 var(--fH)">${rat}</b><span style="color:var(--dim);font-size:12px">${rc.toLocaleString()} reseñas</span>${p?.mv?'<span class="badge b-mv">★ MadVet</span>':''}</div></div>`;
  h+=`<div class="dp-body">`;
  if(hrs&&hrs.weekday_text){h+=`<div class="dp-sect">🕐 Horario</div><div class="dp-hrs">`;hrs.weekday_text.forEach(d=>{const pts=d.split(': ');h+=`<div class="dp-hr-row"><span>${pts[0]}</span><strong>${pts[1]||''}</strong></div>`;});h+=`</div>`;}
  if(ph)h+=`<div style="font:500 13px/1 var(--f);color:var(--sub);margin:10px 0">📞 ${ph}</div>`;
  if(web)h+=`<a href="${web}" target="_blank" style="font:600 12px/1 var(--f);color:var(--pri);text-decoration:none;display:block;margin-bottom:12px">🌐 ${web.replace(/https?:\/\/(www\.)?/,'').split('/')[0]} →</a>`;
  if(p?.offer)h+=`<div style="padding:8px 12px;background:var(--goldL);border-radius:var(--rS);margin-bottom:12px;font:600 12px/1 var(--f);color:#8B6914">🎁 ${p.offer}</div>`;
  h+=`<div class="dp-acts">${ph?`<a class="dp-ap" href="tel:${ph}">📞 Llamar</a>`:''}<a class="dp-as" href="${gUrl||`https://maps.google.com/?q=${p?.lat},${p?.lng}`}" target="_blank">🗺️ Cómo llegar</a></div>`;
  if(reviews.length){h+=`<div class="dp-sect">💬 Reseñas</div>`;reviews.slice(0,5).forEach(r=>{h+=`<div class="dp-review"><div class="dp-rv-head"><span class="dp-rv-name">${r.author_name}</span><span style="color:var(--gold);font-size:12px">${starsH(r.rating)}</span></div><div class="dp-rv-txt">${(r.text||'').substring(0,250)}${(r.text||'').length>250?'...':''}</div></div>`;});}
  h+=`</div>`;dp.innerHTML=h;
}

function closeDP(){document.getElementById('dpo').classList.remove('open');activeId=null;renderList();}

function showEmg(){
  const h24=all.filter(p=>p.is24||p.mv).sort((a,b)=>(b.mv?1:0)-(a.mv?1:0)||((b.rating||0)-(a.rating||0)));
  document.getElementById('dpo').classList.add('open');
  let h=`<div style="padding:20px"><div style="text-align:center;margin-bottom:20px"><div style="width:56px;height:56px;border-radius:50%;background:var(--redL);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:24px">🚨</div><div style="font:800 20px/1 var(--fH)">Urgencias 24h</div><div style="font:500 12px/1 var(--f);color:var(--dim);margin-top:4px">${h24.length} centros</div></div>`;
  h24.forEach(c=>{h+=`<div style="display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);margin-bottom:8px;border:1.5px solid ${c.mv?'rgba(10,117,88,.3)':'var(--brd)'};background:${c.mv?'var(--priL)':'var(--card)'}"><div style="flex:1;min-width:0"><div style="font:700 13px/1.2 var(--fH);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</div><div style="font:500 11px/1 var(--f);color:var(--dim);margin-top:2px">${c.addr}</div><div style="margin-top:4px;font:500 11px/1 var(--f)"><span style="color:var(--gold)">${starsH(c.rating)}</span> <b>${c.rating||'—'}</b></div></div><div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0">${c.ph?`<a href="tel:${c.ph}" style="padding:8px 14px;border-radius:8px;background:linear-gradient(135deg,var(--red),#B52D3A);color:#fff;font:700 12px/1 var(--f);text-decoration:none;text-align:center">📞</a>`:''}<a href="https://maps.google.com/?daddr=${c.lat},${c.lng}" target="_blank" style="padding:6px 14px;border-radius:8px;border:1px solid var(--brd);font:500 11px/1 var(--f);text-decoration:none;color:var(--sub);text-align:center">🗺️</a></div></div>`;});
  h+=`<button onclick="closeDP()" style="width:100%;padding:12px;border-radius:var(--r);border:1.5px solid var(--brd);background:var(--card);font:600 13px/1 var(--f);color:var(--sub);cursor:pointer;margin-top:8px">Cerrar</button></div>`;
  document.getElementById('dpc').innerHTML=h;
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBSRTPwJozA8jJKk3a09r3N82ftCFex8gM&libraries=places&callback=initMap" async defer></script>
</body>
</html>
