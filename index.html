<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B6B50">
<meta name="description" content="Encuentra clínicas veterinarias cerca de ti en Madrid. Urgencias 24h, valoraciones y más.">
<title>VetFinder — Tu veterinario, siempre cerca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;800;900&family=General+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#0B6B50;--priL:#0E8C68;--priD:#085640;--priGlow:rgba(11,107,80,.12);
  --accent:#E8A427;--accentBg:#FEF7E8;
  --bg:#F4F3EF;--bgW:#FAFAF8;--card:#FFFFFF;
  --txt:#1A1D2B;--sub:#4A4F65;--dim:#8B90A6;--lt:#B8BCD0;--xlt:#D5D8E3;
  --brd:#E6E8EE;--brdL:#F0F1F5;
  --red:#C93B4A;--redBg:#FEF0F1;
  --orange:#C96B1D;--orangeBg:#FEF3EA;
  --green:#0B6B50;--greenBg:#EEF8F4;
  --sh:0 1px 2px rgba(26,29,43,.04);
  --shM:0 4px 12px rgba(26,29,43,.06),0 1px 3px rgba(26,29,43,.04);
  --shL:0 8px 32px rgba(26,29,43,.08),0 2px 8px rgba(26,29,43,.04);
  --shXL:0 20px 60px rgba(26,29,43,.12),0 4px 16px rgba(26,29,43,.06);
  --r:14px;--rS:10px;--rXS:7px;
  --f:'General Sans','Satoshi',system-ui,-apple-system,sans-serif;
  --fH:'Satoshi','General Sans',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.56,.64,1)
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--txt);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--xlt);border-radius:2px}

/* ═══ HEADER ═══ */
header{display:flex;align-items:center;gap:16px;padding:0 20px;height:60px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(230,232,238,.6);z-index:1000;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.logo-i{width:36px;height:36px;background:var(--pri);border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden}
.logo-i::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 50%)}
.logo-i svg{width:18px;height:18px;fill:#fff;position:relative;z-index:1}
.logo-t{font:800 19px/1 var(--fH);letter-spacing:-.7px}.logo-t span{color:var(--pri)}
.srch{flex:1;max-width:400px;position:relative}
.srch input{width:100%;height:42px;padding:0 16px 0 40px;border:1.5px solid var(--brd);border-radius:var(--rS);background:var(--bgW);font:500 13.5px var(--f);color:var(--txt);outline:none;transition:all .2s var(--ease)}
.srch input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px var(--priGlow)}
.srch input::placeholder{color:var(--lt);font-weight:400}
.srch-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--lt);pointer-events:none;transition:color .2s}
.srch input:focus ~ .srch-ic{color:var(--pri)}
.hdr-stats{display:flex;gap:20px;margin-left:auto;align-items:center}
.hdr-stat b{display:block;font:800 19px/1 var(--fH);color:var(--pri);letter-spacing:-.5px}
.hdr-stat small{font:500 8px/1 var(--f);color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin-top:3px;display:block;text-align:center}

/* ═══ DESKTOP LAYOUT ═══ */
.wrap{display:flex;flex:1;overflow:hidden}
.side{width:440px;min-width:440px;display:flex;flex-direction:column;background:var(--card);z-index:500;border-right:1px solid var(--brd)}

.fbar{padding:10px 14px;border-bottom:1px solid var(--brd);display:flex;gap:6px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}.fbar::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 16px;border-radius:17px;font:600 12px/34px var(--f);cursor:pointer;border:1.5px solid var(--brd);background:var(--card);color:var(--dim);transition:all .2s var(--ease);white-space:nowrap;flex-shrink:0}
.chip:hover{border-color:var(--priL);color:var(--priL)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(11,107,80,.25)}

.sbar{padding:7px 14px;border-bottom:1px solid var(--brd);display:flex;gap:4px;align-items:center;background:var(--bgW)}
.sbar-label{margin-right:6px;font:600 10px/1 var(--f);color:var(--sub);text-transform:uppercase;letter-spacing:.8px}
.so{padding:5px 12px;border-radius:12px;font:600 11px/1 var(--f);cursor:pointer;border:none;background:none;color:var(--dim);transition:all .15s}
.so:hover{color:var(--pri)}.so.on{background:var(--card);color:var(--pri);box-shadow:var(--sh);border:1px solid var(--brd)}

.cl{flex:1;overflow-y:auto;padding:6px 0;scroll-behavior:smooth}

/* ═══ SECTION LABELS ═══ */
.sec-l{padding:16px 16px 8px;display:flex;align-items:center;gap:10px}
.sec-l-txt{font:700 10px/1 var(--fH);letter-spacing:1.8px;text-transform:uppercase;color:var(--dim)}
.sec-l::after{content:'';flex:1;height:1px;background:var(--brd)}
.sec-l .cnt{background:var(--greenBg);color:var(--pri);font:700 10px/1 var(--f);padding:3px 10px;border-radius:10px}

/* ═══ CARDS ═══ */
.c{margin:4px 10px;border:1.5px solid var(--brd);border-radius:var(--r);cursor:pointer;transition:all .25s var(--ease);position:relative;overflow:hidden;background:var(--card)}
.c:hover{border-color:rgba(11,107,80,.25);box-shadow:var(--shM);transform:translateY(-1px)}
.c.ft{border-color:rgba(11,107,80,.2);background:linear-gradient(175deg,#FDFFFE 0%,#F5FAF8 100%)}
.c.ft::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--priL));z-index:2}
.c.act{border-color:var(--pri);box-shadow:0 0 0 3px var(--priGlow),var(--shM)}

.c-img-w{width:100%;height:140px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brdL),var(--bg))}
.c-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
.c:hover .c-img{transform:scale(1.03)}

.c-body{padding:14px 16px 16px}
.c-name{font:700 14.5px/1.3 var(--fH);letter-spacing:-.3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-addr{font:400 11.5px/1.4 var(--f);color:var(--dim);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-meta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.c-stars{display:flex;gap:0}.c-stars svg{width:13px;height:13px}
.c-rat{font:700 13px/1 var(--fH)}.c-rc{font:400 11.5px/1 var(--f);color:var(--dim)}
.c-dist{font:500 11px/1 var(--f);color:var(--priL);background:var(--greenBg);padding:3px 8px;border-radius:6px}

.bg{font:700 9px/1 var(--f);padding:4px 9px;border-radius:5px;display:inline-flex;align-items:center;gap:3px;letter-spacing:.3px;text-transform:uppercase}
.bg-mv{background:var(--pri);color:#fff}.bg-24{background:var(--orangeBg);color:var(--orange)}.bg-op{background:var(--greenBg);color:var(--green)}.bg-cl{background:var(--redBg);color:var(--red)}

.c-offer{display:flex;align-items:center;gap:6px;padding:8px 11px;background:var(--accentBg);border-radius:var(--rXS);margin-bottom:10px;font:600 11px/1.3 var(--f);color:#9A7415;border:1px solid rgba(232,164,39,.12)}

.c-btns{display:flex;gap:6px}
.c-bp{flex:1;height:38px;border-radius:var(--rS);border:none;background:var(--pri);color:#fff;font:700 12.5px/38px var(--f);cursor:pointer;transition:all .15s;text-align:center}
.c-bp:hover{background:var(--priL)}
.c-bs{width:38px;height:38px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:all .15s;text-decoration:none;color:var(--sub)}
.c-bs:hover{border-color:var(--pri);color:var(--pri);background:var(--greenBg)}

/* ═══ MAP ═══ */
.map-w{flex:1;position:relative}
#map{width:100%;height:100%}
.map-ctrls{position:absolute;top:16px;right:16px;z-index:10;display:flex;flex-direction:column;gap:8px}
.map-btn{width:42px;height:42px;border-radius:var(--rS);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid rgba(230,232,238,.6);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shM);transition:all .2s;color:var(--sub)}
.map-btn:hover{background:#fff;box-shadow:var(--shL);color:var(--pri)}
.map-btn.locating{animation:pulse-loc 1.2s ease-in-out infinite}
.map-btn svg{width:18px;height:18px}
@keyframes pulse-loc{0%,100%{box-shadow:var(--shM)}50%{box-shadow:0 0 0 6px var(--priGlow),var(--shM)}}

/* ═══ EMERGENCY BTN ═══ */
.emg-btn{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;height:48px;padding:0 24px;border-radius:24px;background:var(--red);color:#fff;border:none;font:700 14px/48px var(--f);cursor:pointer;box-shadow:0 4px 20px rgba(201,59,74,.3);display:flex;align-items:center;gap:8px;transition:all .25s var(--ease);letter-spacing:-.2px}
.emg-btn:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 6px 28px rgba(201,59,74,.35)}
.emg-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* ═══ LOADING ═══ */
.spinner{width:28px;height:28px;border:3px solid var(--brd);border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{margin:4px 10px;border:1.5px solid var(--brd);border-radius:var(--r);overflow:hidden;background:var(--card)}
.skel-img{width:100%;height:130px;background:linear-gradient(90deg,var(--brdL) 25%,var(--bg) 50%,var(--brdL) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.skel-body{padding:14px 16px 16px}
.skel-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--brdL) 25%,var(--bg) 50%,var(--brdL) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:8px}
.skel-line.w70{width:70%}.skel-line.w50{width:50%}.skel-line.w90{width:90%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ═══ OVERLAY + DETAIL PANEL ═══ */
.ov{position:fixed;inset:0;background:rgba(26,29,43,.25);backdrop-filter:blur(4px);z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.dp{position:fixed;top:0;right:0;bottom:0;width:480px;background:var(--card);z-index:2001;transform:translateX(100%);transition:transform .4s var(--ease);overflow-y:auto;box-shadow:var(--shXL)}
.dp.on{transform:translateX(0)}
.dp-x{position:absolute;top:14px;right:14px;z-index:10;width:38px;height:38px;border-radius:var(--rXS);background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);cursor:pointer;display:grid;place-items:center;color:var(--sub);box-shadow:var(--shM);transition:all .15s}
.dp-x:hover{background:#fff;color:var(--txt)}
.dp-x svg{width:16px;height:16px}
.dp-gallery{display:flex;gap:3px;overflow-x:auto;scroll-snap-type:x mandatory;-ms-overflow-style:none;scrollbar-width:none}.dp-gallery::-webkit-scrollbar{display:none}
.dp-gallery img{height:200px;min-width:200px;object-fit:cover;flex-shrink:0;scroll-snap-align:start}.dp-gallery img:first-child{min-width:260px}
.dp-h{padding:20px 24px 16px}
.dp-name{font:800 22px/1.2 var(--fH);letter-spacing:-.6px;margin-bottom:5px}
.dp-addr{font:400 13px/1.4 var(--f);color:var(--dim);margin-bottom:12px}
.dp-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dp-sec{border-top:1px solid var(--brd);padding:20px 24px}
.dp-st{font:700 14px/1 var(--fH);margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.dp-hrs{background:var(--bgW);border-radius:var(--rS);padding:14px 16px;margin-bottom:16px}
.dp-hr{display:flex;justify-content:space-between;font:400 12.5px/1 var(--f);padding:5px 0;color:var(--sub)}
.dp-hr strong{font-weight:600;color:var(--txt)}
.dp-hr.today{color:var(--pri);font-weight:600}.dp-hr.today strong{color:var(--pri)}
.dp-btns{display:flex;gap:8px;margin-bottom:16px}
.dp-b1{flex:1;height:48px;border-radius:var(--r);border:none;background:var(--pri);color:#fff;font:700 14px/48px var(--f);cursor:pointer;text-align:center;text-decoration:none;display:block;transition:all .15s}
.dp-b1:hover{background:var(--priL)}
.dp-b2{flex:1;height:48px;border-radius:var(--r);border:1.5px solid var(--brd);background:var(--card);color:var(--sub);font:600 14px/46px var(--f);text-align:center;text-decoration:none;display:block;transition:all .15s}
.dp-b2:hover{border-color:var(--pri);color:var(--pri)}
.rv{padding:14px;background:var(--bgW);border-radius:var(--rS);margin-bottom:8px;border:1px solid var(--brdL)}
.rv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rv-n{font:600 12.5px/1 var(--f)}.rv-s{color:var(--accent);font-size:11px;letter-spacing:-1px}
.rv-t{font:400 12.5px/1.55 var(--f);color:var(--sub)}
.empty{text-align:center;padding:60px 20px;color:var(--dim);font:500 13.5px/1.4 var(--f)}

/* ═══ MOBILE — BOTTOM SHEET ═══ */
@media(max-width:960px){
  .hdr-stats{display:none}
  .srch{max-width:none}
  header{padding:0 14px;height:54px;gap:12px}
  .logo-t{font-size:17px}

  .wrap{flex-direction:column;position:relative}

  /* Map fills entire area behind sheet */
  .map-w{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1}

  .emg-btn{bottom:auto;top:16px;left:16px;transform:none;height:40px;padding:0 18px;border-radius:20px;font-size:12.5px}
  .emg-btn:hover{transform:none}

  /* Bottom Sheet */
  .side{
    position:absolute;left:0;right:0;bottom:0;z-index:500;
    width:100%;min-width:100%;
    border-right:none;
    border-radius:18px 18px 0 0;
    box-shadow:0 -4px 24px rgba(26,29,43,.1);
    transition:height .35s var(--ease);
    will-change:height;
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* Drag handle */
  .sheet-handle{
    display:flex;flex-direction:column;align-items:center;
    padding:10px 0 2px;flex-shrink:0;cursor:grab;touch-action:none;
  }
  .sheet-handle-bar{width:36px;height:4px;border-radius:2px;background:var(--xlt)}

  /* Summary strip */
  .sheet-summary{
    display:flex;align-items:center;gap:10px;padding:4px 16px 8px;flex-shrink:0;
  }
  .sheet-summary b{font:800 16px/1 var(--fH);color:var(--pri)}
  .sheet-summary small{font:500 11px/1 var(--f);color:var(--dim)}
  .sheet-hint{margin-left:auto;color:var(--priL);font:600 10px/1 var(--f);opacity:.7}

  .c-img-w{height:110px}
  .dp{width:100%;border-radius:0}
  .dp-gallery img{height:180px}
  .map-ctrls{top:auto;bottom:16px;right:12px}
}
@media(min-width:961px){
  .sheet-handle{display:none}
  .sheet-summary{display:none}
}
@media(max-width:480px){
  .c-img-w{height:100px}
  .c-body{padding:12px 14px 14px}
  .c{margin:3px 8px}
  .fbar{padding:8px 10px}
}

/* Card entrance */
.c{animation:cardIn .35s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-i"><svg viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg></div>
    <div class="logo-t">Vet<span>Finder</span></div>
  </a>
  <div class="srch">
    <input id="sI" placeholder="Buscar clínica, zona o servicio..." oninput="renderList()">
    <svg class="srch-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </div>
  <div class="hdr-stats">
    <div class="hdr-stat"><b id="stT">0</b><small>Clínicas</small></div>
    <div class="hdr-stat"><b id="st24">0</b><small>Urgencias</small></div>
  </div>
</header>

<div class="wrap">
  <div class="side" id="sheet">
    <div class="sheet-handle" id="sheetHandle">
      <div class="sheet-handle-bar"></div>
    </div>
    <div class="sheet-summary">
      <b id="stTm">0</b><small>clínicas encontradas</small>
      <span class="sheet-hint" id="sheetHint">Desliza ↑</span>
    </div>
    <div class="fbar" id="fbar"></div>
    <div class="sbar" id="sbar"></div>
    <div class="cl" id="cl">
      <div class="skel"><div class="skel-img"></div><div class="skel-body"><div class="skel-line w70"></div><div class="skel-line w90"></div><div class="skel-line w50"></div></div></div>
      <div class="skel"><div class="skel-img"></div><div class="skel-body"><div class="skel-line w70"></div><div class="skel-line w90"></div><div class="skel-line w50"></div></div></div>
    </div>
  </div>
  <div class="map-w">
    <div id="map"></div>
    <div class="map-ctrls">
      <button class="map-btn" id="locBtn" onclick="locateUser()" title="Mi ubicación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="8"/></svg>
      </button>
    </div>
    <button class="emg-btn" onclick="showEmg()"><span class="emg-dot"></span>Urgencias 24h</button>
  </div>
</div>

<div class="ov" id="ov" onclick="closeDP()"></div>
<div class="dp" id="dp"></div>

<script>
// ═══ DATA ═══
const MV=[
  {pid:"ChIJb8mnOJCFQQ0RsSs1rwnvFck",name:"Hospital Veterinario MadVet",addr:"C. Fresa 2, CC Equinoccio, Majadahonda",lat:40.4545,lng:-3.8758,rating:4.9,rc:261,ph:"+34 682 62 82 38",web:"https://madvet.es",offer:"1ª consulta -50%",mv:1,is24:false},
  {pid:"ChIJM7K4WZ_RQw0RIkJk6gnQ3Hg",name:"Centro Vet. MadVet Las 4 Huellas",addr:"Trav. Cuatro Calles 15, San Agustín del Guadalix",lat:40.6796,lng:-3.6174,rating:4.8,rc:307,ph:"+34 911 13 41 49",web:"https://madvet.es",offer:"",mv:1,is24:false},
  {pid:"ChIJJcHwJj6IQQ0Rm11Up0mqAHM",name:"Centro Vet. Parque Aluche",addr:"C. de Quero 57, Latina, Madrid",lat:40.3905,lng:-3.7605,rating:4.8,rc:259,ph:"+34 917 17 18 22",web:"https://madvet.es",offer:"Pack vacunación cachorro",mv:1,is24:false}
];

let gMap,gSvc,all=[],activeId=null,filt='all',sort='best',searched=new Set();
let uLat=null,uLng=null,uMarker=null;

// ═══ HELPERS ═══
const stH=r=>{let s='';for(let i=1;i<=5;i++){const f=i<=Math.round(r||0);s+=`<svg viewBox="0 0 24 24" fill="${f?'#E8A427':'none'}" stroke="${f?'#E8A427':'#D5D8E3'}" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`}return s};
const stT=r=>'★'.repeat(Math.round(r||0))+'☆'.repeat(5-Math.round(r||0));
function hav(lat1,lng1,lat2,lng2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function fmtD(km){return km<1?Math.round(km*1000)+' m':km<10?km.toFixed(1)+' km':Math.round(km)+' km'}
function detect24(place){
  const nm=(place.name||'').toLowerCase();
  if(['24h','24 h','24 hora','urgencia','emergency','emergencia'].some(k=>nm.includes(k)))return true;
  const oh=place.opening_hours;
  if(oh&&oh.periods&&oh.periods.length===1){const p=oh.periods[0];if(p.open&&p.open.day===0&&p.open.hours===0&&p.open.minutes===0&&!p.close)return true}
  if(nm.includes('hospital')&&(nm.includes('vet')||nm.includes('animal')))return true;
  return false;
}
function mkIcon(type){
  if(type==='mv')return{path:'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z',fillColor:'#0B6B50',fillOpacity:1,strokeColor:'#fff',strokeWeight:2.5,scale:1.8,anchor:new google.maps.Point(12,24),labelOrigin:new google.maps.Point(12,9)};
  if(type==='24h')return{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:'#C96B1D',fillOpacity:.9,strokeColor:'#fff',strokeWeight:2};
  return{path:google.maps.SymbolPath.CIRCLE,scale:6,fillColor:'#8B90A6',fillOpacity:.7,strokeColor:'#fff',strokeWeight:1.5};
}

    {lat:40.41,lng:-3.89,r:8000},{lat:40.50,lng:-3.90,r:8000},{lat:40.46,lng:-3.55,r:8000},
    {lat:40.48,lng:-3.37,r:8000},{lat:40.36,lng:-3.53,r:8000},{lat:40.33,lng:-3.86,r:8000},
    {lat:40.24,lng:-3.77,r:8000},{lat:40.40,lng:-3.60,r:8000},{lat:40.64,lng:-4.02,r:8000},
    {lat:40.66,lng:-3.77,r:8000}
  ];
  zones.forEach((z,i)=>setTimeout(()=>searchZone(z.lat,z.lng,z.r),i*400));

  gMap.addListener('idle',()=>{
    renderList();
    const c=gMap.getCenter(),key=Math.round(c.lat()*100)+','+Math.round(c.lng()*100);
    if(!searched.has(key)){searched.add(key);searchZone(c.lat(),c.lng(),getR())}

  renderFilters();

function searchZone(lat,lng,radius){
  const key=Math.round(lat*50)+','+Math.round(lng*50);
  if(searched.has(key))return;searched.add(key);
  gSvc.nearbySearch({location:{lat,lng},radius,type:'veterinary_care'},(res,st,pg)=>{
    if(st===google.maps.places.PlacesServiceStatus.OK){addResults(res);if(pg&&pg.hasNextPage)setTimeout(()=>pg.nextPage(),300)}
  });
}
function addResults(results){
  let n=0;
  results.forEach(p=>{
    if(all.find(x=>x.pid===p.place_id))return;
    const is24=detect24(p),oh=p.opening_hours;
    const cl={pid:p.place_id,name:p.name,addr:p.vicinity||'',lat:p.geometry.location.lat(),lng:p.geometry.location.lng(),rating:p.rating||0,rc:p.user_ratings_total||0,is24,isOpen:oh?oh.isOpen():null,photo:p.photos&&p.photos[0]?p.photos[0].getUrl({maxWidth:420,maxHeight:300}):null,mv:0};
    const m=new google.maps.Marker({position:{lat:cl.lat,lng:cl.lng},map:gMap,icon:mkIcon(is24?'24h':'def'),zIndex:is24?500:100,title:p.name});
    m.addListener('click',()=>loadDP(cl.pid));cl._m=m;all.push(cl);n++;
  });
  if(n>0)renderList();
}
function getR(){const b=gMap.getBounds();if(!b)return 12000;return Math.min(50000,Math.abs((b.getNorthEast().lat()-b.getSouthWest().lat())*111000/2))}

// ═══ GEOLOCATION ═══
function locateUser(silent){
  if(!navigator.geolocation)return;
  const btn=document.getElementById('locBtn');btn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(pos=>{
    uLat=pos.coords.latitude;uLng=pos.coords.longitude;
    btn.classList.remove('locating');btn.style.color='var(--pri)';
    if(uMarker)uMarker.setMap(null);
    uMarker=new google.maps.Marker({position:{lat:uLat,lng:uLng},map:gMap,icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:'#3B82F6',fillOpacity:1,strokeColor:'#fff',strokeWeight:3},zIndex:2000,title:'Tu ubicación'});
    if(!silent){gMap.panTo({lat:uLat,lng:uLng});gMap.setZoom(13)}
    renderList();renderFilters();
  },()=>{btn.classList.remove('locating')},{enableHighAccuracy:true,timeout:8000});
}

// ═══ BOTTOM SHEET (MOBILE) ═══
let sheetSnap='half'; // 'peek' | 'half' | 'full'
const SNAPS={peek:25,half:55,full:92};

function initSheet(){
  const isMobile=window.innerWidth<=960;
  if(!isMobile)return;

  const sheet=document.getElementById('sheet');
  const handle=document.getElementById('sheetHandle');
  let startY,startH,dragging=false;

  setSnap('half');

  function setSnap(s){
    sheetSnap=s;
    sheet.style.transition='height .35s '+getComputedStyle(document.documentElement).getPropertyValue('--ease');
    sheet.style.height=SNAPS[s]+'vh';
    const hint=document.getElementById('sheetHint');
    if(hint)hint.textContent=s==='peek'?'Desliza ↑':s==='half'?'Ver más ↑':'';
    setTimeout(()=>{if(gMap)google.maps.event.trigger(gMap,'resize')},380);
  }

  function onStart(e){
    dragging=true;
    startY=e.touches?e.touches[0].clientY:e.clientY;
    startH=sheet.offsetHeight;
    sheet.style.transition='none';
  }
  function onMove(e){
    if(!dragging)return;
    e.preventDefault();
    const y=e.touches?e.touches[0].clientY:e.clientY;
    const diff=startY-y;
    const newH=Math.max(60,Math.min(window.innerHeight*0.94,startH+diff));
    sheet.style.height=newH+'px';
  }
  function onEnd(){
    if(!dragging)return;
    dragging=false;
    const pct=(sheet.offsetHeight/window.innerHeight)*100;
    // Find closest snap
    let best='half',minD=999;
    for(const[k,v]of Object.entries(SNAPS)){const d=Math.abs(pct-v);if(d<minD){minD=d;best=k}}
    // Also handle velocity-like: if dragged far from start, snap to direction
    const startPct=(startH/window.innerHeight)*100;
    if(pct>startPct+12&&best!=='full')best=pct>70?'full':'half';
    if(pct<startPct-12&&best!=='peek')best=pct<35?'peek':'half';
    setSnap(best);
  }

  handle.addEventListener('touchstart',onStart,{passive:true});
  handle.addEventListener('touchmove',onMove,{passive:false});
  handle.addEventListener('touchend',onEnd);
  handle.addEventListener('mousedown',onStart);
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onEnd);

  // Tap map → minimize sheet to peek
  document.getElementById('map').addEventListener('click',()=>{
    if(sheetSnap!=='peek')setSnap('peek');
  });

  // Handle resize
  window.addEventListener('resize',()=>{
    if(window.innerWidth>960){sheet.style.height='';sheet.style.transition=''}
  });
}

// ═══ FILTERS ═══
function renderFilters(){
  document.getElementById('fbar').innerHTML=[
    ['all','Todas'],['24h','🕐 24h'],['open','✓ Abiertas ahora'],['top','★ Top rated']
  ].map(([k,l])=>`<button class="chip ${filt===k?'on':''}" onclick="filt='${k}';renderList();renderFilters()">${l}</button>`).join('');
  const sorts=[['best','Relevancia'],['rating','Rating'],['reviews','Reseñas']];
  if(uLat)sorts.push(['dist','Distancia']);
  document.getElementById('sbar').innerHTML=`<span class="sbar-label">Ordenar</span>`+sorts.map(([k,l])=>`<button class="so ${sort===k?'on':''}" onclick="sort='${k}';renderList();renderFilters()">${l}</button>`).join('');
}

// ═══ RENDER LIST ═══
function renderList(){
  const q=(document.getElementById('sI').value||'').toLowerCase();
  const bounds=gMap?gMap.getBounds():null;
  let list=all.filter(p=>{
    if(!p.mv&&bounds&&!bounds.contains({lat:p.lat,lng:p.lng}))return false;
    if(q&&!p.name.toLowerCase().includes(q)&&!(p.addr||'').toLowerCase().includes(q))return false;
    if(filt==='24h'&&!p.is24)return false;
    if(filt==='open'&&p.isOpen!==true)return false;
    if(filt==='top'&&(p.rating||0)<4.5)return false;
    return true;
  });
  if(uLat)list.forEach(p=>{p._d=hav(uLat,uLng,p.lat,p.lng)});
  list.sort((a,b)=>{
    if(a.mv&&!b.mv)return -1;if(!a.mv&&b.mv)return 1;
    if(sort==='dist'&&uLat)return(a._d||999)-(b._d||999);
    if(sort==='reviews')return(b.rc||0)-(a.rc||0);
    if(sort==='rating')return(b.rating||0)-(a.rating||0);
    return((b.rating||0)*Math.log10((b.rc||1)+1))-((a.rating||0)*Math.log10((a.rc||1)+1));
  });
  document.getElementById('stT').textContent=list.length;
  document.getElementById('st24').textContent=list.filter(p=>p.is24).length;
  const stm=document.getElementById('stTm');if(stm)stm.textContent=list.length;

  const mvL=list.filter(p=>p.mv),rest=list.filter(p=>!p.mv);
  let h='';
  if(mvL.length){h+=`<div class="sec-l"><span class="sec-l-txt">★ Recomendadas</span></div>`;mvL.forEach((p,i)=>h+=cH(p,i*40))}
  if(rest.length){h+=`<div class="sec-l"><span class="sec-l-txt">En tu zona</span><span class="cnt">${rest.length}</span></div>`;rest.forEach((p,i)=>h+=cH(p,(mvL.length+i)*25))}
  if(!list.length)h=`<div class="empty">No se encontraron clínicas<br>con estos filtros</div>`;
  document.getElementById('cl').innerHTML=h;
  all.forEach(p=>{if(p._m)p._m.setVisible(list.includes(p))});
}

function cH(p,delay){
  const dist=(uLat&&p._d)?`<span class="c-dist">${fmtD(p._d)}</span>`:'';
  const img=p.photo?`<div class="c-img-w"><img class="c-img" src="${p.photo}" alt="" loading="lazy"></div>`:'';
  return`<div class="c ${p.mv?'ft':''} ${activeId===p.pid?'act':''}" onclick="loadDP('${p.pid}')" style="animation-delay:${Math.min(delay,300)}ms">
${img}<div class="c-body"><div class="c-name">${p.name}</div><div class="c-addr">${p.addr}</div>
<div class="c-meta"><div class="c-stars">${stH(p.rating)}</div><span class="c-rat">${p.rating||'—'}</span><span class="c-rc">(${(p.rc||0).toLocaleString()})</span>
${p.mv?'<span class="bg bg-mv">★ MadVet</span>':''}${p.is24?'<span class="bg bg-24">24h</span>':''}${p.isOpen===true&&!p.is24?'<span class="bg bg-op">Abierto</span>':''}${p.isOpen===false?'<span class="bg bg-cl">Cerrado</span>':''}${dist}</div>
${p.offer?`<div class="c-offer">🎁 ${p.offer}</div>`:''}
<div class="c-btns"><button class="c-bp" onclick="event.stopPropagation();loadDP('${p.pid}')">Ver clínica</button>${p.ph?`<a class="c-bs" href="tel:${p.ph}" onclick="event.stopPropagation()">📞</a>`:''}<a class="c-bs" href="https://maps.google.com/?daddr=${p.lat},${p.lng}" target="_blank" onclick="event.stopPropagation()">🗺</a></div></div></div>`
}

// ═══ DETAIL PANEL ═══
function loadDP(pid){
  activeId=pid;renderList();
  const p=all.find(x=>x.pid===pid);
  if(p){gMap.panTo({lat:p.lat,lng:p.lng});if(gMap.getZoom()<14)gMap.setZoom(14)}
  document.getElementById('ov').classList.add('on');document.getElementById('dp').classList.add('on');
  document.getElementById('dp').innerHTML=`<div style="display:grid;place-items:center;height:220px"><div class="spinner"></div></div>`;
  gSvc.getDetails({placeId:pid,fields:['name','formatted_address','formatted_phone_number','website','opening_hours','reviews','photos','rating','user_ratings_total','url']},(d,s)=>{
    if(s===google.maps.places.PlacesServiceStatus.OK)renderDP(d,p);
  });
}
function renderDP(d,p){
  const nm=d.name||p?.name||'',addr=d.formatted_address||p?.addr||'',ph=d.formatted_phone_number||p?.ph||'',web=d.website||p?.web||'',rat=d.rating||p?.rating||0,rc=d.user_ratings_total||p?.rc||0,gUrl=d.url||'',photos=d.photos||[],reviews=d.reviews||[],hrs=d.opening_hours;
  let is24=p?.is24||false;
  if(hrs?.periods?.length===1&&!hrs.periods[0].close)is24=true;
  if(hrs?.weekday_text?.some(t=>t.toLowerCase().includes('24')))is24=true;
  const today=new Date().getDay(),dayMap=[6,0,1,2,3,4,5];

  let h=`<button class="dp-x" onclick="closeDP()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
  if(photos.length){h+=`<div class="dp-gallery">`;photos.slice(0,6).forEach(ph=>{h+=`<img src="${ph.getUrl({maxWidth:500,maxHeight:350})}" alt="" loading="lazy">`});h+=`</div>`}
  h+=`<div class="dp-h"><div class="dp-name">${nm}</div><div class="dp-addr">${addr}</div>
  <div class="dp-badges"><div class="c-stars">${stH(rat)}</div><span class="c-rat" style="font-size:15px">${rat}</span><span class="c-rc">${rc.toLocaleString()} reseñas</span>
  ${p?.mv?'<span class="bg bg-mv">★ MadVet</span>':''}${is24?'<span class="bg bg-24">24h</span>':''}${uLat&&p?._d?`<span class="c-dist">${fmtD(p._d)}</span>`:''}</div></div>
  <div class="dp-sec">`;
  if(hrs?.weekday_text){
    h+=`<div class="dp-st">🕐 Horario</div><div class="dp-hrs">`;
    hrs.weekday_text.forEach((row,i)=>{const[day,...rest]=row.split(': ');const isT=dayMap[today]===i;h+=`<div class="dp-hr ${isT?'today':''}"><span>${isT?'▸ '+day:day}</span><strong>${rest.join(': ')}</strong></div>`});
    h+=`</div>`;
  }
  if(ph)h+=`<div style="font:500 13.5px/1.5 var(--f);color:var(--sub);margin-bottom:6px">📞 <a href="tel:${ph}" style="color:var(--pri);text-decoration:none;font-weight:600">${ph}</a></div>`;
  if(web)h+=`<div style="margin-bottom:14px"><a href="${web}" target="_blank" style="font:600 12.5px/1 var(--f);color:var(--pri);text-decoration:none">🌐 ${web.replace(/https?:\/\/(www\.)?/,'').split('/')[0]} →</a></div>`;
  if(p?.offer)h+=`<div class="c-offer" style="margin-bottom:14px">🎁 ${p.offer}</div>`;
  h+=`<div class="dp-btns">${ph?`<a class="dp-b1" href="tel:${ph}">📞 Llamar</a>`:''}<a class="dp-b2" href="${gUrl||`https://maps.google.com/?q=${p?.lat},${p?.lng}`}" target="_blank">🗺️ Cómo llegar</a></div>`;
  if(reviews.length){h+=`<div class="dp-st">💬 Reseñas</div>`;reviews.slice(0,5).forEach(r=>{h+=`<div class="rv"><div class="rv-top"><span class="rv-n">${r.author_name}</span><span class="rv-s">${stT(r.rating)}</span></div><div class="rv-t">${(r.text||'').substring(0,250)}${(r.text||'').length>250?'…':''}</div></div>`})}
  h+=`</div>`;document.getElementById('dp').innerHTML=h;
  if(is24&&p&&!p.is24){p.is24=true;if(p._m)p._m.setIcon(mkIcon('24h'));renderList()}
}
function closeDP(){document.getElementById('ov').classList.remove('on');document.getElementById('dp').classList.remove('on');activeId=null;renderList()}

// ═══ EMERGENCY — ONLY REAL 24H (not MadVet) ═══
function showEmg(){
  let h24=all.filter(p=>p.is24); // ← FIXED: only truly 24h, NOT p.mv
  if(uLat)h24.sort((a,b)=>hav(uLat,uLng,a.lat,a.lng)-hav(uLat,uLng,b.lat,b.lng));

  h24.forEach(c=>{

    <div style="flex:1;min-width:0">
      <div style="font:700 14px/1.2 var(--fH);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</div>
      <div style="font:400 11.5px/1.3 var(--f);color:var(--dim);margin-top:3px">${c.addr}</div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
        <span style="color:var(--accent);font-size:12px">${stT(c.rating)}</span>
        <b style="font:700 12px/1 var(--fH)">${c.rating||'—'}</b>
        <span style="font:400 11px/1 var(--f);color:var(--dim)">(${(c.rc||0).toLocaleString()})</span>
        ${dist?`<span class="c-dist">${dist}</span>`:''}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
      ${c.ph?`<a href="tel:${c.ph}" style="padding:10px 20px;border-radius:var(--rS);background:var(--red);color:#fff;font:700 12px/1 var(--f);text-decoration:none;text-align:center">Llamar</a>`:`<a onclick="loadDP('${c.pid}');return false" href="#" style="padding:10px 20px;border-radius:var(--rS);background:var(--red);color:#fff;font:700 12px/1 var(--f);text-decoration:none;text-align:center;cursor:pointer">Ver</a>`}
      <a href="https://maps.google.com/?daddr=${c.lat},${c.lng}" target="_blank" style="padding:8px 20px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);font:600 11px/1 var(--f);text-decoration:none;color:var(--sub);text-align:center">Ruta</a>
    </div></div>`;
  });
  h+=`</div>`;document.getElementById('dp').innerHTML=h;
}
