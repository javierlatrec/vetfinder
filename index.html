<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0B6B50">
<meta name="description" content="Encuentra clínicas veterinarias cerca de ti en Madrid. Urgencias 24h, valoraciones y más.">
<title>VetFinder — Tu veterinario, siempre cerca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;800;900&family=General+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#0B6B50;--priL:#0E8C68;--priD:#085640;--priGlow:rgba(11,107,80,.12);
  --accent:#E8A427;--accentBg:#FEF7E8;
  --bg:#F4F3EF;--bgW:#FAFAF8;--card:#FFFFFF;
  --txt:#1A1D2B;--sub:#4A4F65;--dim:#8B90A6;--lt:#B8BCD0;--xlt:#D5D8E3;
  --brd:#E6E8EE;--brdL:#F0F1F5;
  --red:#C93B4A;--redBg:#FEF0F1;--redGlow:rgba(201,59,74,.15);
  --orange:#C96B1D;--orangeBg:#FEF3EA;
  --green:#0B6B50;--greenBg:#EEF8F4;
  --sh:0 1px 2px rgba(26,29,43,.04);
  --shM:0 4px 12px rgba(26,29,43,.06),0 1px 3px rgba(26,29,43,.04);
  --shL:0 8px 32px rgba(26,29,43,.08),0 2px 8px rgba(26,29,43,.04);
  --shXL:0 20px 60px rgba(26,29,43,.12),0 4px 16px rgba(26,29,43,.06);
  --r:14px;--rS:10px;--rXS:7px;
  --f:'General Sans','Satoshi',system-ui,-apple-system,sans-serif;
  --fH:'Satoshi','General Sans',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.56,.64,1)
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--txt);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--xlt);border-radius:2px}::-webkit-scrollbar-thumb:hover{background:var(--lt)}

/* HEADER */
header{display:flex;align-items:center;gap:16px;padding:0 20px;height:60px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(230,232,238,.6);z-index:1000;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.logo-i{width:36px;height:36px;background:var(--pri);border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden}
.logo-i::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 50%);border-radius:inherit}
.logo-i svg{width:18px;height:18px;fill:#fff;position:relative;z-index:1}
.logo-t{font:800 19px/1 var(--fH);letter-spacing:-.7px;color:var(--txt)}.logo-t span{color:var(--pri)}

.srch{flex:1;max-width:400px;position:relative}
.srch input{width:100%;height:42px;padding:0 16px 0 40px;border:1.5px solid var(--brd);border-radius:var(--rS);background:var(--bgW);font:500 13.5px var(--f);color:var(--txt);outline:none;transition:all .2s var(--ease)}
.srch input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px var(--priGlow)}
.srch input::placeholder{color:var(--lt);font-weight:400}
.srch-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--lt);pointer-events:none;transition:color .2s}
.srch input:focus ~ .srch-ic{color:var(--pri)}

.hdr-stats{display:flex;gap:20px;margin-left:auto;align-items:center}
.hdr-stat{text-align:center;position:relative}
.hdr-stat b{display:block;font:800 19px/1 var(--fH);color:var(--pri);letter-spacing:-.5px}
.hdr-stat small{font:500 8px/1 var(--f);color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin-top:3px;display:block}

/* LAYOUT */
.wrap{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.side{width:440px;min-width:440px;display:flex;flex-direction:column;background:var(--card);z-index:500;border-right:1px solid var(--brd)}

.fbar{padding:10px 14px;border-bottom:1px solid var(--brd);display:flex;gap:6px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}

.chip{height:34px;padding:0 16px;border-radius:17px;font:600 12px/34px var(--f);cursor:pointer;border:1.5px solid var(--brd);background:var(--card);color:var(--dim);transition:all .2s var(--ease);white-space:nowrap;flex-shrink:0;letter-spacing:-.1px}
.chip:hover{border-color:var(--priL);color:var(--priL)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(11,107,80,.25)}
.chip .emoji{margin-right:3px}

.sbar{padding:7px 14px;border-bottom:1px solid var(--brd);display:flex;gap:4px;align-items:center;background:var(--bgW);font:500 11px/1 var(--f);color:var(--dim)}
.sbar-label{margin-right:6px;font-weight:600;color:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.so{padding:5px 12px;border-radius:12px;font:600 11px/1 var(--f);cursor:pointer;border:none;background:none;color:var(--dim);transition:all .15s}
.so:hover{color:var(--pri)}
.so.on{background:var(--card);color:var(--pri);box-shadow:var(--sh);border:1px solid var(--brd)}

/* CARD LIST */
.cl{flex:1;overflow-y:auto;padding:6px 0;scroll-behavior:smooth}

.sec-l{padding:16px 16px 8px;display:flex;align-items:center;gap:10px}
.sec-l-txt{font:700 10px/1 var(--fH);letter-spacing:1.8px;text-transform:uppercase;color:var(--dim)}
.sec-l::after{content:'';flex:1;height:1px;background:var(--brd)}
.sec-l .badge-count{background:var(--greenBg);color:var(--pri);font:700 10px/1 var(--f);padding:3px 10px;border-radius:10px;letter-spacing:0}

/* CARDS */
.c{margin:4px 10px;border:1.5px solid var(--brd);border-radius:var(--r);cursor:pointer;transition:all .25s var(--ease);position:relative;overflow:hidden;background:var(--card)}
.c:hover{border-color:rgba(11,107,80,.25);box-shadow:var(--shM);transform:translateY(-1px)}
.c.featured{border-color:rgba(11,107,80,.2);background:linear-gradient(175deg,#FDFFFE 0%,#F5FAF8 100%)}
.c.featured::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--priL));z-index:2}
.c.active{border-color:var(--pri);box-shadow:0 0 0 3px var(--priGlow),var(--shM)}

.c-img-wrap{width:100%;height:140px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brdL),var(--bg))}
.c-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
.c:hover .c-img{transform:scale(1.03)}
.c-img-placeholder{width:100%;height:100%;display:grid;place-items:center;color:var(--lt)}
.c-img-placeholder svg{width:32px;height:32px;opacity:.4}

.c-body{padding:14px 16px 16px}
.c-name{font:700 14.5px/1.3 var(--fH);letter-spacing:-.3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-addr{font:400 11.5px/1.4 var(--f);color:var(--dim);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.c-meta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.c-stars{display:flex;gap:0}.c-stars svg{width:13px;height:13px}
.c-rating{font:700 13px/1 var(--fH);color:var(--txt)}
.c-reviews{font:400 11.5px/1 var(--f);color:var(--dim)}
.c-dist{font:500 11px/1 var(--f);color:var(--priL);background:var(--greenBg);padding:3px 8px;border-radius:6px}

/* BADGES */
.badge{font:700 9px/1 var(--f);padding:4px 9px;border-radius:5px;display:inline-flex;align-items:center;gap:3px;letter-spacing:.3px;text-transform:uppercase}
.badge-mv{background:var(--pri);color:#fff}
.badge-24{background:var(--orangeBg);color:var(--orange)}
.badge-open{background:var(--greenBg);color:var(--green)}
.badge-closed{background:var(--redBg);color:var(--red)}

.c-offer{display:flex;align-items:center;gap:6px;padding:8px 11px;background:var(--accentBg);border-radius:var(--rXS);margin-bottom:10px;font:600 11px/1.3 var(--f);color:#9A7415;border:1px solid rgba(232,164,39,.15)}

.c-actions{display:flex;gap:6px}
.c-btn-primary{flex:1;height:38px;border-radius:var(--rS);border:none;background:var(--pri);color:#fff;font:700 12.5px/38px var(--f);cursor:pointer;transition:all .15s var(--ease);text-align:center;letter-spacing:-.1px}
.c-btn-primary:hover{background:var(--priL);box-shadow:0 2px 8px rgba(11,107,80,.2)}
.c-btn-icon{width:38px;height:38px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:all .15s var(--ease);text-decoration:none;color:var(--sub)}
.c-btn-icon:hover{border-color:var(--pri);color:var(--pri);background:var(--greenBg)}

/* MAP */
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%}

/* MAP CONTROLS */
.map-ctrls{position:absolute;top:16px;right:16px;z-index:10;display:flex;flex-direction:column;gap:8px}
.map-btn{width:42px;height:42px;border-radius:var(--rS);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(230,232,238,.6);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shM);transition:all .2s var(--ease);color:var(--sub)}
.map-btn:hover{background:#fff;box-shadow:var(--shL);color:var(--pri)}
.map-btn.locating{animation:pulse-loc 1.2s ease-in-out infinite}
@keyframes pulse-loc{0%,100%{box-shadow:var(--shM)}50%{box-shadow:0 0 0 6px var(--priGlow),var(--shM)}}
.map-btn svg{width:18px;height:18px}

/* EMERGENCY BUTTON */
.emg-btn{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;height:48px;padding:0 24px;border-radius:24px;background:var(--red);color:#fff;border:none;font:700 14px/48px var(--f);cursor:pointer;box-shadow:0 4px 20px rgba(201,59,74,.3),0 0 0 0 rgba(201,59,74,0);display:flex;align-items:center;gap:8px;transition:all .25s var(--ease);letter-spacing:-.2px}
.emg-btn:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 6px 28px rgba(201,59,74,.35)}
.emg-btn::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;animation:emg-pulse 1.5s ease-in-out infinite}
@keyframes emg-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;gap:16px;padding:60px 20px}
.loading-text{font:500 13px/1 var(--f);color:var(--dim)}
.spinner{width:28px;height:28px;border:3px solid var(--brd);border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* SKELETON */
.skel{margin:4px 10px;border:1.5px solid var(--brd);border-radius:var(--r);overflow:hidden;background:var(--card)}
.skel-img{width:100%;height:140px;background:linear-gradient(90deg,var(--brdL) 25%,var(--bg) 50%,var(--brdL) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.skel-body{padding:14px 16px 16px}
.skel-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--brdL) 25%,var(--bg) 50%,var(--brdL) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:8px}
.skel-line.w70{width:70%}.skel-line.w50{width:50%}.skel-line.w90{width:90%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* OVERLAY + DETAIL PANEL */
.overlay{position:fixed;inset:0;background:rgba(26,29,43,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.overlay.on{opacity:1;pointer-events:auto}

.detail-panel{position:fixed;top:0;right:0;bottom:0;width:480px;background:var(--card);z-index:2001;transform:translateX(100%);transition:transform .4s var(--ease);overflow-y:auto;box-shadow:var(--shXL)}
.detail-panel.on{transform:translateX(0)}

.dp-close{position:absolute;top:14px;right:14px;z-index:10;width:38px;height:38px;border-radius:var(--rXS);background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);cursor:pointer;display:grid;place-items:center;color:var(--sub);box-shadow:var(--shM);transition:all .15s}
.dp-close:hover{background:#fff;color:var(--txt)}
.dp-close svg{width:16px;height:16px}

.dp-gallery{display:flex;gap:3px;overflow-x:auto;scroll-snap-type:x mandatory;-ms-overflow-style:none;scrollbar-width:none}
.dp-gallery::-webkit-scrollbar{display:none}
.dp-gallery img{height:200px;min-width:200px;object-fit:cover;flex-shrink:0;scroll-snap-align:start}
.dp-gallery img:first-child{min-width:260px}

.dp-header{padding:20px 24px 16px}
.dp-name{font:800 22px/1.2 var(--fH);letter-spacing:-.6px;margin-bottom:5px}
.dp-addr{font:400 13px/1.4 var(--f);color:var(--dim);margin-bottom:12px}
.dp-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.dp-section{border-top:1px solid var(--brd);padding:20px 24px}
.dp-section-title{font:700 14px/1 var(--fH);margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}

.dp-hours{background:var(--bgW);border-radius:var(--rS);padding:14px 16px;margin-bottom:16px}
.dp-hour-row{display:flex;justify-content:space-between;font:400 12.5px/1 var(--f);padding:5px 0;color:var(--sub)}
.dp-hour-row strong{font-weight:600;color:var(--txt)}
.dp-hour-row.today{color:var(--pri);font-weight:600}
.dp-hour-row.today strong{color:var(--pri)}

.dp-contact-item{font:500 13.5px/1.5 var(--f);color:var(--sub);margin-bottom:6px}
.dp-contact-item a{color:var(--pri);text-decoration:none;font-weight:600}
.dp-contact-item a:hover{text-decoration:underline}

.dp-buttons{display:flex;gap:8px;margin-bottom:16px}
.dp-btn-call{flex:1;height:48px;border-radius:var(--r);border:none;background:var(--pri);color:#fff;font:700 14px/48px var(--f);cursor:pointer;text-align:center;text-decoration:none;display:block;transition:all .15s;letter-spacing:-.2px}
.dp-btn-call:hover{background:var(--priL)}
.dp-btn-dir{flex:1;height:48px;border-radius:var(--r);border:1.5px solid var(--brd);background:var(--card);color:var(--sub);font:600 14px/46px var(--f);text-align:center;text-decoration:none;display:block;transition:all .15s}
.dp-btn-dir:hover{border-color:var(--pri);color:var(--pri)}

.review{padding:14px;background:var(--bgW);border-radius:var(--rS);margin-bottom:8px;border:1px solid var(--brdL)}
.review-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.review-name{font:600 12.5px/1 var(--f);color:var(--txt)}
.review-stars{color:var(--accent);font-size:11px;letter-spacing:-1px}
.review-text{font:400 12.5px/1.55 var(--f);color:var(--sub)}

/* NO RESULTS */
.empty-state{text-align:center;padding:60px 20px}
.empty-state svg{width:48px;height:48px;color:var(--lt);margin-bottom:12px}
.empty-state p{font:500 13.5px/1.4 var(--f);color:var(--dim)}

/* RESPONSIVE */
@media(max-width:960px){
  .wrap{flex-direction:column}
  .side{width:100%;min-width:100%;height:55vh;border-right:none;border-top:1px solid var(--brd);order:2}
  .map-wrap{height:45vh;order:1}
  .hdr-stats{display:none}
  .srch{max-width:none}
  .detail-panel{width:100%;border-radius:0}
  header{padding:0 14px;height:54px;gap:12px}
  .c-img-wrap{height:110px}
  .emg-btn{bottom:16px;height:44px;padding:0 20px;font-size:13px}
  .logo-t{font-size:17px}
}
@media(max-width:480px){
  .c-img-wrap{height:100px}
  .c-body{padding:12px 14px 14px}
  .c{margin:3px 8px}
  .fbar{padding:8px 10px}
}

/* ANIMATIONS */
.c{animation:cardIn .4s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <div class="logo-i">
      <svg viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
    </div>
    <div class="logo-t">Vet<span>Finder</span></div>
  </a>
  <div class="srch">
    <input id="searchInput" placeholder="Buscar clínica, zona o servicio..." oninput="renderList()">
    <svg class="srch-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </div>
  <div class="hdr-stats">
    <div class="hdr-stat"><b id="statTotal">0</b><small>Clínicas</small></div>
    <div class="hdr-stat"><b id="stat24">0</b><small>Urgencias</small></div>
  </div>
</header>

<div class="wrap">
  <div class="side">
    <div class="fbar" id="filterBar"></div>
    <div class="sbar" id="sortBar"></div>
    <div class="cl" id="cardList">
      <div class="skel"><div class="skel-img"></div><div class="skel-body"><div class="skel-line w70"></div><div class="skel-line w90"></div><div class="skel-line w50"></div></div></div>
      <div class="skel"><div class="skel-img"></div><div class="skel-body"><div class="skel-line w70"></div><div class="skel-line w90"></div><div class="skel-line w50"></div></div></div>
      <div class="skel"><div class="skel-img"></div><div class="skel-body"><div class="skel-line w70"></div><div class="skel-line w90"></div><div class="skel-line w50"></div></div></div>
    </div>
  </div>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-ctrls">
      <button class="map-btn" id="locateBtn" onclick="locateUser()" title="Mi ubicación">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="8"/></svg>
      </button>
    </div>
    <button class="emg-btn" onclick="showEmergency()">Urgencias 24h</button>
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeDetail()"></div>
<div class="detail-panel" id="detailPanel"></div>

<script>
// ═══════════════════════════════════════════
// MADVET CLINICS (featured)
// ═══════════════════════════════════════════
const MADVET = [
  {pid:"ChIJb8mnOJCFQQ0RsSs1rwnvFck",name:"Hospital Veterinario MadVet",addr:"C. Fresa 2, CC Equinoccio, Majadahonda",lat:40.4545,lng:-3.8758,rating:4.9,rc:261,ph:"+34 682 62 82 38",web:"https://madvet.es",offer:"1ª consulta -50%",mv:1,is24:false},
  {pid:"ChIJM7K4WZ_RQw0RIkJk6gnQ3Hg",name:"Centro Vet. MadVet Las 4 Huellas",addr:"Trav. Cuatro Calles 15, San Agustín del Guadalix",lat:40.6796,lng:-3.6174,rating:4.8,rc:307,ph:"+34 911 13 41 49",web:"https://madvet.es",offer:"",mv:1,is24:false},
  {pid:"ChIJJcHwJj6IQQ0Rm11Up0mqAHM",name:"Centro Vet. Parque Aluche",addr:"C. de Quero 57, Latina, Madrid",lat:40.3905,lng:-3.7605,rating:4.8,rc:259,ph:"+34 917 17 18 22",web:"https://madvet.es",offer:"Pack vacunación cachorro",mv:1,is24:false}
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let map, placesService, allClinics = [], activeId = null;
let currentFilter = 'all', currentSort = 'best';
let searchedKeys = new Set();
let userLat = null, userLng = null, userMarker = null;

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const starsSVG = (r) => {
  let s = '';
  for (let i = 1; i <= 5; i++) {
    const filled = i <= Math.round(r || 0);
    s += `<svg viewBox="0 0 24 24" fill="${filled ? '#E8A427' : 'none'}" stroke="${filled ? '#E8A427' : '#D5D8E3'}" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
  }
  return s;
};
const starsText = r => '★'.repeat(Math.round(r || 0)) + '☆'.repeat(5 - Math.round(r || 0));

function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(km) {
  if (km < 1) return Math.round(km * 1000) + ' m';
  return km < 10 ? km.toFixed(1) + ' km' : Math.round(km) + ' km';
}

function detect24h(place) {
  const nm = (place.name || '').toLowerCase();
  const kw = ['24h','24 h','24 hora','urgencia','emergency','emergencia'];
  if (kw.some(k => nm.includes(k))) return true;
  const oh = place.opening_hours;
  if (oh && oh.periods && oh.periods.length === 1) {
    const p = oh.periods[0];
    if (p.open && p.open.day === 0 && p.open.hours === 0 && p.open.minutes === 0 && !p.close) return true;
  }
  if (nm.includes('hospital') && (nm.includes('vet') || nm.includes('animal'))) return true;
  return false;
}

// MAP INIT
// ═══════════════════════════════════════════
function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 40.42, lng: -3.7 },
    zoom: 10,
    disableDefaultUI: true,
    zoomControl: true,
    zoomControlOptions: { position: google.maps.ControlPosition.RIGHT_CENTER },
    styles: [
      { featureType: "poi", stylers: [{ visibility: "off" }] },
      { featureType: "transit", stylers: [{ visibility: "off" }] },
      { featureType: "water", elementType: "geometry", stylers: [{ color: "#dbeaf4" }] },
      { featureType: "water", elementType: "labels", stylers: [{ visibility: "off" }] },
      { featureType: "landscape.natural", stylers: [{ color: "#f0f0ea" }] },
      { featureType: "landscape.man_made", stylers: [{ color: "#f4f4ee" }] },
      { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#e5e5dd" }] },
      { featureType: "road.arterial", elementType: "geometry", stylers: [{ color: "#eeeee8" }] },
      { featureType: "road.local", elementType: "geometry", stylers: [{ color: "#f8f8f4" }] },
      { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#a0a8b5" }] },
      { featureType: "road", elementType: "labels.text.stroke", stylers: [{ color: "#ffffff" }] },
      { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#7a8290" }] }
    ]
  });

  placesService = new google.maps.places.PlacesService(map);

  // Add MadVet clinics first
  MADVET.forEach(mv => {
    const marker = new google.maps.Marker({
      position: { lat: mv.lat, lng: mv.lng },
      map,
      icon: makeMarkerIcon('madvet'),
      label: { text: '★', color: '#fff', fontSize: '11px', fontWeight: '700' },
      zIndex: 1000,
      title: mv.name
    });
    marker.addListener('click', () => loadDetail(mv.pid));
    mv._marker = marker;
    allClinics.push({ ...mv, _marker: marker });
  });

  // Grid search across Madrid
  const zones = [
    {lat:40.45,lng:-3.87,r:8000},{lat:40.42,lng:-3.70,r:8000},{lat:40.39,lng:-3.76,r:8000},
    {lat:40.35,lng:-3.83,r:8000},{lat:40.33,lng:-3.70,r:8000},{lat:40.48,lng:-3.68,r:8000},
    {lat:40.55,lng:-3.65,r:8000},{lat:40.60,lng:-3.71,r:8000},{lat:40.68,lng:-3.62,r:8000},
    {lat:40.41,lng:-3.89,r:8000},{lat:40.50,lng:-3.90,r:8000},{lat:40.46,lng:-3.55,r:8000},
    {lat:40.48,lng:-3.37,r:8000},{lat:40.36,lng:-3.53,r:8000},{lat:40.33,lng:-3.86,r:8000},
    {lat:40.24,lng:-3.77,r:8000},{lat:40.40,lng:-3.60,r:8000},{lat:40.64,lng:-4.02,r:8000},
    {lat:40.66,lng:-3.77,r:8000}
  ];
  zones.forEach((z, i) => setTimeout(() => searchZone(z.lat, z.lng, z.r), i * 400));

  map.addListener('idle', () => {
    renderList();
    const c = map.getCenter();
    const key = Math.round(c.lat() * 100) + ',' + Math.round(c.lng() * 100);
    if (!searchedKeys.has(key)) {
      searchedKeys.add(key);
      searchZone(c.lat(), c.lng(), getSearchRadius());
    }
  });

  renderFilters();
  // Auto-locate
  locateUser(true);
}

function searchZone(lat, lng, radius) {
  const key = Math.round(lat * 50) + ',' + Math.round(lng * 50);
  if (searchedKeys.has(key)) return;
  searchedKeys.add(key);
  placesService.nearbySearch({
    location: { lat, lng }, radius, type: 'veterinary_care'
  }, (results, status, pagination) => {
    if (status === google.maps.places.PlacesServiceStatus.OK) {
      addResults(results);
      if (pagination && pagination.hasNextPage) setTimeout(() => pagination.nextPage(), 300);
    }
  });
}

function addResults(results) {
  let added = 0;
  results.forEach(p => {
    if (allClinics.find(x => x.pid === p.place_id)) return;
    const is24 = detect24h(p);
    const oh = p.opening_hours;
    const clinic = {
      pid: p.place_id,
      name: p.name,
      addr: p.vicinity || '',
      lat: p.geometry.location.lat(),
      lng: p.geometry.location.lng(),
      rating: p.rating || 0,
      rc: p.user_ratings_total || 0,
      is24,
      isOpen: oh ? oh.isOpen() : null,
      photo: p.photos && p.photos[0] ? p.photos[0].getUrl({ maxWidth: 420, maxHeight: 300 }) : null,
      mv: 0
    };
    const marker = new google.maps.Marker({
      position: { lat: clinic.lat, lng: clinic.lng },
      map,
      icon: makeMarkerIcon(is24 ? '24h' : 'default'),
      zIndex: is24 ? 500 : 100,
      title: p.name
    });
    marker.addListener('click', () => loadDetail(clinic.pid));
    clinic._marker = marker;
    allClinics.push(clinic);
    added++;
  });
  if (added > 0) renderList();
}

function getSearchRadius() {
  const b = map.getBounds();
  if (!b) return 12000;
  return Math.min(50000, Math.abs((b.getNorthEast().lat() - b.getSouthWest().lat()) * 111000 / 2));
}

// ═══════════════════════════════════════════
// GEOLOCATION
// ═══════════════════════════════════════════
function locateUser(silent) {
  if (!navigator.geolocation) return;
  const btn = document.getElementById('locateBtn');
  btn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    btn.classList.remove('locating');
    btn.style.color = 'var(--pri)';
    if (userMarker) userMarker.setMap(null);
    userMarker = new google.maps.Marker({
      position: { lat: userLat, lng: userLng },
      map,
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 7,
        fillColor: '#3B82F6',
        fillOpacity: 1,
        strokeColor: '#ffffff',
        strokeWeight: 3
      },
      zIndex: 2000,
      title: 'Tu ubicación'
    });
    if (!silent) {
      map.panTo({ lat: userLat, lng: userLng });
      map.setZoom(13);
    }
    renderList();
  }, () => {
    btn.classList.remove('locating');
  }, { enableHighAccuracy: true, timeout: 8000 });
}

// ═══════════════════════════════════════════
// FILTERS & SORT
// ═══════════════════════════════════════════
function renderFilters() {
  const filters = [
    ['all', 'Todas'],
    ['24h', '<span class="emoji">🕐</span> Urgencias 24h'],
    ['open', '<span class="emoji">✓</span> Abiertas ahora'],
    ['top', '<span class="emoji">★</span> Top rated']
  ];
  document.getElementById('filterBar').innerHTML = filters.map(([k, l]) =>
    `<button class="chip ${currentFilter === k ? 'on' : ''}" onclick="currentFilter='${k}';renderList();renderFilters()">${l}</button>`
  ).join('');

  const sorts = [['best','Relevancia'],['rating','Rating'],['reviews','Reseñas']];
  if (userLat) sorts.push(['dist','Distancia']);
  document.getElementById('sortBar').innerHTML =
    `<span class="sbar-label">Ordenar</span>` +
    sorts.map(([k, l]) =>
      `<button class="so ${currentSort === k ? 'on' : ''}" onclick="currentSort='${k}';renderList();renderFilters()">${l}</button>`
    ).join('');
}

// ═══════════════════════════════════════════
// RENDER CARD LIST
// ═══════════════════════════════════════════
function renderList() {
  const query = (document.getElementById('searchInput').value || '').toLowerCase();
  const bounds = map ? map.getBounds() : null;

  let list = allClinics.filter(p => {
    if (!p.mv && bounds && !bounds.contains({ lat: p.lat, lng: p.lng })) return false;
    if (query && !p.name.toLowerCase().includes(query) && !(p.addr || '').toLowerCase().includes(query)) return false;
    if (currentFilter === '24h' && !p.is24) return false;
    if (currentFilter === 'open' && p.isOpen !== true) return false;
    if (currentFilter === 'top' && (p.rating || 0) < 4.5) return false;
    return true;
  });

  // Compute distance
  if (userLat) {
    list.forEach(p => { p._dist = haversine(userLat, userLng, p.lat, p.lng); });
  }

  // Sort
  list.sort((a, b) => {
    if (a.mv && !b.mv) return -1;
    if (!a.mv && b.mv) return 1;
    if (currentSort === 'dist' && userLat) return (a._dist || 999) - (b._dist || 999);
    if (currentSort === 'reviews') return (b.rc || 0) - (a.rc || 0);
    if (currentSort === 'rating') return (b.rating || 0) - (a.rating || 0);
    return ((b.rating || 0) * Math.log10((b.rc || 1) + 1)) - ((a.rating || 0) * Math.log10((a.rc || 1) + 1));
  });

  // Stats
  document.getElementById('statTotal').textContent = list.length;
  document.getElementById('stat24').textContent = list.filter(p => p.is24).length;

  const featured = list.filter(p => p.mv);
  const rest = list.filter(p => !p.mv);
  let html = '';

  if (featured.length) {
    html += `<div class="sec-l"><span class="sec-l-txt">★ Recomendadas</span></div>`;
    featured.forEach((p, i) => { html += cardHTML(p, i * 50); });
  }
  if (rest.length) {
    html += `<div class="sec-l"><span class="sec-l-txt">En tu zona</span><span class="badge-count">${rest.length}</span></div>`;
    rest.forEach((p, i) => { html += cardHTML(p, (featured.length + i) * 30); });
  }
  if (!list.length) {
    html = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6"/></svg>
      <p>No se encontraron clínicas<br>con estos filtros</p>
    </div>`;
  }

  document.getElementById('cardList').innerHTML = html;

  // Marker visibility
  allClinics.forEach(p => { if (p._marker) p._marker.setVisible(list.includes(p)); });
}

function cardHTML(p, delay) {
  const distBadge = (userLat && p._dist) ? `<span class="c-dist">${formatDist(p._dist)}</span>` : '';
  const imgSection = p.photo
    ? `<div class="c-img-wrap"><img class="c-img" src="${p.photo}" alt="" loading="lazy"></div>`
    : '';

  return `<div class="c ${p.mv ? 'featured' : ''} ${activeId === p.pid ? 'active' : ''}" onclick="loadDetail('${p.pid}')" style="animation-delay:${Math.min(delay, 300)}ms">
    ${imgSection}
    <div class="c-body">
      <div class="c-name">${p.name}</div>
      <div class="c-addr">${p.addr}</div>
      <div class="c-meta">
        <div class="c-stars">${starsSVG(p.rating)}</div>
        <span class="c-rating">${p.rating || '—'}</span>
        <span class="c-reviews">(${(p.rc || 0).toLocaleString()})</span>
        ${p.mv ? '<span class="badge badge-mv">★ MadVet</span>' : ''}
        ${p.is24 ? '<span class="badge badge-24">24h</span>' : ''}
        ${p.isOpen === true && !p.is24 ? '<span class="badge badge-open">Abierto</span>' : ''}
        ${p.isOpen === false ? '<span class="badge badge-closed">Cerrado</span>' : ''}
        ${distBadge}
      </div>
      ${p.offer ? `<div class="c-offer">🎁 ${p.offer}</div>` : ''}
      <div class="c-actions">
        <button class="c-btn-primary" onclick="event.stopPropagation();loadDetail('${p.pid}')">Ver clínica</button>
        ${p.ph ? `<a class="c-btn-icon" href="tel:${p.ph}" onclick="event.stopPropagation()" title="Llamar">📞</a>` : ''}
        <a class="c-btn-icon" href="https://maps.google.com/?daddr=${p.lat},${p.lng}" target="_blank" onclick="event.stopPropagation()" title="Cómo llegar">🗺</a>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════════
function loadDetail(pid) {
  activeId = pid;
  renderList();
  const p = allClinics.find(x => x.pid === pid);
  if (p) {
    map.panTo({ lat: p.lat, lng: p.lng });
    if (map.getZoom() < 14) map.setZoom(14);
  }
  document.getElementById('overlay').classList.add('on');
  document.getElementById('detailPanel').classList.add('on');
  document.getElementById('detailPanel').innerHTML = `<div style="display:grid;place-items:center;height:220px"><div class="spinner"></div></div>`;

  placesService.getDetails({
    placeId: pid,
    fields: ['name','formatted_address','formatted_phone_number','website','opening_hours','reviews','photos','rating','user_ratings_total','url']
  }, (detail, status) => {
    if (status === google.maps.places.PlacesServiceStatus.OK) renderDetail(detail, p);
  });
}

function renderDetail(d, p) {
  const nm = d.name || p?.name || '';
  const addr = d.formatted_address || p?.addr || '';
  const ph = d.formatted_phone_number || p?.ph || '';
  const web = d.website || p?.web || '';
  const rat = d.rating || p?.rating || 0;
  const rc = d.user_ratings_total || p?.rc || 0;
  const gUrl = d.url || '';
  const photos = d.photos || [];
  const reviews = d.reviews || [];
  const hrs = d.opening_hours;

  let is24 = p?.is24 || false;
  if (hrs?.periods?.length === 1 && !hrs.periods[0].close) is24 = true;
  if (hrs?.weekday_text?.some(t => t.toLowerCase().includes('24'))) is24 = true;

  const today = new Date().getDay();
  const dayMap = [6, 0, 1, 2, 3, 4, 5]; // JS day → weekday_text index

  let html = `<button class="dp-close" onclick="closeDetail()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;

  if (photos.length) {
    html += `<div class="dp-gallery">`;
    photos.slice(0, 6).forEach(ph => {
      html += `<img src="${ph.getUrl({ maxWidth: 500, maxHeight: 350 })}" alt="" loading="lazy">`;
    });
    html += `</div>`;
  }

  html += `<div class="dp-header">
    <div class="dp-name">${nm}</div>
    <div class="dp-addr">${addr}</div>
    <div class="dp-badges">
      <div class="c-stars">${starsSVG(rat)}</div>
      <span class="c-rating" style="font-size:15px">${rat}</span>
      <span class="c-reviews">${rc.toLocaleString()} reseñas</span>
      ${p?.mv ? '<span class="badge badge-mv">★ MadVet</span>' : ''}
      ${is24 ? '<span class="badge badge-24">24h</span>' : ''}
      ${userLat && p?._dist ? `<span class="c-dist">${formatDist(p._dist)}</span>` : ''}
    </div>
  </div>`;

  html += `<div class="dp-section">`;

  // Hours
  if (hrs?.weekday_text) {
    html += `<div class="dp-section-title">🕐 Horario</div>
    <div class="dp-hours">`;
    hrs.weekday_text.forEach((row, i) => {
      const [day, ...rest] = row.split(': ');
      const isToday = dayMap[today] === i;
      html += `<div class="dp-hour-row ${isToday ? 'today' : ''}"><span>${isToday ? '▸ ' + day : day}</span><strong>${rest.join(': ')}</strong></div>`;
    });
    html += `</div>`;
  }

  // Contact
  if (ph) html += `<div class="dp-contact-item">📞 <a href="tel:${ph}">${ph}</a></div>`;
  if (web) html += `<div class="dp-contact-item" style="margin-bottom:16px">🌐 <a href="${web}" target="_blank">${web.replace(/https?:\/\/(www\.)?/, '').split('/')[0]}</a></div>`;
  if (p?.offer) html += `<div class="c-offer" style="margin-bottom:16px">🎁 ${p.offer}</div>`;

  // Action buttons
  html += `<div class="dp-buttons">
    ${ph ? `<a class="dp-btn-call" href="tel:${ph}">📞 Llamar</a>` : ''}
    <a class="dp-btn-dir" href="${gUrl || `https://maps.google.com/?q=${p?.lat},${p?.lng}`}" target="_blank">🗺️ Cómo llegar</a>
  </div>`;

  // Reviews
  if (reviews.length) {
    html += `<div class="dp-section-title">💬 Reseñas destacadas</div>`;
    reviews.slice(0, 5).forEach(r => {
      html += `<div class="review">
        <div class="review-top">
          <span class="review-name">${r.author_name}</span>
          <span class="review-stars">${starsText(r.rating)}</span>
        </div>
        <div class="review-text">${(r.text || '').substring(0, 250)}${(r.text || '').length > 250 ? '…' : ''}</div>
      </div>`;
    });
  }

  html += `</div>`;
  document.getElementById('detailPanel').innerHTML = html;

  // Update 24h if detected
  if (is24 && p && !p.is24) {
    p.is24 = true;
    if (p._marker) p._marker.setIcon(makeMarkerIcon('24h'));
    renderList();
  }
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('on');
  document.getElementById('detailPanel').classList.remove('on');
  activeId = null;
  renderList();
}

// ═══════════════════════════════════════════
// EMERGENCY PANEL
// ═══════════════════════════════════════════
function showEmergency() {
  let emergencies = allClinics.filter(p => p.is24 || p.mv);

  // Sort: MadVet first, then by distance if available, else by rating
  emergencies.sort((a, b) => {
    if (a.mv && !b.mv) return -1;
    if (!a.mv && b.mv) return 1;
    if (userLat) {
      const da = haversine(userLat, userLng, a.lat, a.lng);
      const db = haversine(userLat, userLng, b.lat, b.lng);
      return da - db;
    }
    return (b.rating || 0) - (a.rating || 0);
  });

  document.getElementById('overlay').classList.add('on');

  let html = `<button class="dp-close" onclick="closeDetail()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>

        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      </div>
      <div style="font:800 24px/1 var(--fH);letter-spacing:-.6px">Urgencias veterinarias</div>
      <div style="font:400 13.5px/1.4 var(--f);color:var(--dim);margin-top:8px">${emergencies.length} centros disponibles</div>
    </div>`;

  emergencies.forEach(c => {
    const dist = userLat ? formatDist(haversine(userLat, userLng, c.lat, c.lng)) : '';
    html += `<div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);margin-bottom:8px;border:1.5px solid ${c.mv ? 'rgba(11,107,80,.2)' : 'var(--brd)'};background:${c.mv ? 'var(--greenBg)' : 'var(--card)'};transition:all .15s" onmouseover="this.style.boxShadow='var(--shM)'" onmouseout="this.style.boxShadow='none'">
      <div style="flex:1;min-width:0">
        <div style="font:700 14px/1.2 var(--fH);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px">${c.name}</div>
        <div style="font:400 11.5px/1.3 var(--f);color:var(--dim);margin-top:3px">${c.addr}</div>
        <div style="margin-top:8px;display:flex;align-items:center;gap:8px">
          <span style="color:var(--accent);font-size:12px">${starsText(c.rating)}</span>
          <b style="font:700 12px/1 var(--fH)">${c.rating || '—'}</b>
          ${dist ? `<span class="c-dist">${dist}</span>` : ''}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
        ${c.ph
          ? `<a href="tel:${c.ph}" style="padding:10px 20px;border-radius:var(--rS);background:var(--red);color:#fff;font:700 12px/1 var(--f);text-decoration:none;text-align:center;transition:all .15s">Llamar</a>`
          : `<a onclick="loadDetail('${c.pid}');return false" href="#" style="padding:10px 20px;border-radius:var(--rS);background:var(--red);color:#fff;font:700 12px/1 var(--f);text-decoration:none;text-align:center;cursor:pointer">Ver</a>`
        }
        <a href="https://maps.google.com/?daddr=${c.lat},${c.lng}" target="_blank" style="padding:8px 20px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);font:600 11px/1 var(--f);text-decoration:none;color:var(--sub);text-align:center;transition:all .15s">Ruta</a>
      </div>
    </div>`;
  });

  html += `</div>`;
  document.getElementById('detailPanel').innerHTML = html;
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBSRTPwJozA8jJKk3a09r3N82ftCFex8gM&libraries=places&callback=initMap" async defer></script>
</body>
</html>
