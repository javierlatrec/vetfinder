<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VetFinder — Tu veterinario, siempre cerca</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--pri:#0A7558;--priD:#065C45;--priL:#E8F5EF;--priG:rgba(10,117,88,.07);
--bg:#FAFAF7;--card:#FFFFFF;--cardH:#FEFEFE;
--txt:#1B1F2A;--sub:#4A5066;--dim:#8B91A8;--xdim:#B8BDD0;
--brd:#EAEDF2;--brdL:#F2F3F5;
--gold:#E5A100;--goldL:#FFF8E6;--red:#D63B4B;--redL:#FEF0F1;--orange:#E67E22;--orangeL:#FEF5EC;
--sh:0 1px 4px rgba(27,31,42,.06);--shM:0 4px 20px rgba(27,31,42,.08);--shL:0 12px 40px rgba(27,31,42,.12);
--r:14px;--rS:10px;--rL:20px;
--f:'DM Sans',system-ui,sans-serif;--fH:'Outfit',system-ui,sans-serif;
--ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--txt);display:flex;flex-direction:column}
::selection{background:var(--priL);color:var(--pri)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}::-webkit-scrollbar-thumb:hover{background:var(--dim)}

/* ═══ HEADER ═══ */
.hdr{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--brd);z-index:1000;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
.brand-icon{width:38px;height:38px;background:linear-gradient(145deg,var(--pri),#12A17A);border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(10,117,88,.25)}
.brand-icon svg{width:20px;height:20px;fill:#fff}
.brand-txt{font-family:var(--fH);font-size:20px;font-weight:800;letter-spacing:-.5px;color:var(--txt)}
.brand-txt em{font-style:normal;color:var(--pri)}
.srch{flex:1;max-width:440px;position:relative}
.srch input{width:100%;padding:10px 16px 10px 42px;border:1.5px solid var(--brd);border-radius:var(--rS);background:var(--bg);font:500 13.5px/1 var(--f);color:var(--txt);transition:all .2s var(--ease);outline:none}
.srch input:focus{border-color:var(--pri);background:var(--card);box-shadow:0 0 0 3px var(--priG)}
.srch input::placeholder{color:var(--xdim)}
.srch-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--xdim);pointer-events:none}
.hdr-nav{display:flex;gap:4px;margin-left:auto}
.hdr-btn{padding:9px 16px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);font:600 12.5px/1 var(--f);color:var(--sub);cursor:pointer;transition:all .15s var(--ease);display:flex;align-items:center;gap:6px;white-space:nowrap}
.hdr-btn:hover{border-color:var(--pri);color:var(--pri)}
.hdr-btn.act{background:var(--pri);color:#fff;border-color:var(--pri)}
.hdr-btn.act:hover{background:var(--priD)}
.hdr-stats{display:flex;gap:20px;margin-left:16px}
.hdr-stat{text-align:center}
.hdr-stat b{display:block;font-family:var(--fH);font-size:18px;font-weight:800;color:var(--pri);line-height:1}
.hdr-stat small{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}

/* ═══ VIEWS ═══ */
.view{display:none;flex:1;overflow:hidden}.view.on{display:flex}

/* ═══ DISCOVER VIEW ═══ */
.disc{display:flex;flex:1;overflow:hidden}
.side{width:460px;min-width:460px;display:flex;flex-direction:column;border-right:1px solid var(--brd);background:var(--card)}
.filters-bar{padding:12px 18px;border-bottom:1px solid var(--brd);display:flex;gap:6px;flex-wrap:wrap;background:var(--card)}
.chip{padding:7px 15px;border-radius:20px;font:600 11.5px/1 var(--f);cursor:pointer;border:1.5px solid var(--brd);background:var(--card);color:var(--dim);transition:all .15s var(--ease);white-space:nowrap}
.chip:hover{border-color:var(--pri);color:var(--pri)}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.clinic-list{flex:1;overflow-y:auto;padding:8px 0}
.sec-label{padding:14px 18px 6px;font:700 10px/1 var(--fH);letter-spacing:2.5px;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--brd)}
.sec-label .cnt{background:var(--priL);color:var(--pri);font:700 10px/1 var(--f);padding:2px 8px;border-radius:10px;letter-spacing:0}

/* ─ CLINIC CARD ─ */
.cc{margin:6px 14px;padding:16px 18px;background:var(--card);border:1.5px solid var(--brd);border-radius:var(--r);cursor:pointer;transition:all .2s var(--ease);position:relative;overflow:hidden}
.cc:hover{border-color:var(--pri);box-shadow:var(--shM);transform:translateY(-1px)}
.cc.feat{background:linear-gradient(135deg,#FAFFF9 0%,#F0FBF5 100%);border-color:rgba(10,117,88,.2)}
.cc.feat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),#12A17A,#1ED4A0)}
.cc.active{border-color:var(--pri);box-shadow:0 0 0 3px var(--priG),var(--shM)}
.cc-row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.cc-name{font:700 14px/1.3 var(--fH);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px}
.cc-badges{display:flex;gap:4px;flex-shrink:0}
.badge{font:700 9.5px/1 var(--f);padding:4px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}
.badge-mv{background:linear-gradient(135deg,var(--pri),#0EAA7A);color:#fff}
.badge-ver{background:var(--priL);color:var(--pri)}
.badge-24{background:var(--orangeL);color:var(--orange)}
.cc-loc{font:500 11.5px/1 var(--f);color:var(--dim);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.cc-rating{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cc-stars{display:flex;gap:1px}
.cc-stars svg{width:14px;height:14px}
.cc-r{font:700 13px/1 var(--fH);color:var(--txt)}.cc-rc{font:500 11.5px/1 var(--f);color:var(--dim)}
.cc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.cc-tag{font:500 10.5px/1 var(--f);padding:4px 10px;border-radius:6px;background:var(--brdL);color:var(--sub)}
.cc.feat .cc-tag{background:var(--priL);color:var(--pri)}
.cc-offer{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--goldL);border-radius:8px;margin-bottom:8px;font:600 11px/1 var(--f);color:#8B6914}
.cc-btns{display:flex;gap:6px;margin-top:4px}
.cc-btn{padding:9px 0;border-radius:var(--rS);font:700 12px/1 var(--f);cursor:pointer;transition:all .15s var(--ease);text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px}
.cc-btn-pri{flex:1;background:var(--pri);color:#fff;border:none}.cc-btn-pri:hover{background:var(--priD);box-shadow:0 3px 14px rgba(10,117,88,.3)}
.cc-btn-sec{padding:9px 14px;border:1.5px solid var(--brd);background:var(--card);color:var(--sub)}.cc-btn-sec:hover{border-color:var(--pri);color:var(--pri)}

/* ═══ MAP ═══ */
.map-area{flex:1;position:relative}
#map{width:100%;height:100%}
.leaflet-tile-pane{filter:saturate(.35) brightness(.94) contrast(1.05)}
.mk{border-radius:50% 50% 50% 4px;display:flex;align-items:center;justify-content:center;transform:rotate(-45deg);transition:transform .2s var(--ease)}
.mk-f{width:42px;height:42px;background:linear-gradient(145deg,var(--pri),#12A17A);border:3.5px solid #fff;box-shadow:0 3px 14px rgba(10,117,88,.4);animation:mkPulse 3s infinite}
.mk-n{width:26px;height:26px;background:var(--card);border:2.5px solid var(--brd);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mk-n.is24{border-color:var(--orange)}
.mk i{transform:rotate(45deg);font-style:normal;font-size:12px;line-height:1}.mk-f i{font-size:16px;color:#fff;font-weight:700}
@keyframes mkPulse{0%,100%{box-shadow:0 3px 14px rgba(10,117,88,.4)}50%{box-shadow:0 3px 24px rgba(10,117,88,.6),0 0 0 8px rgba(10,117,88,.06)}}
.leaflet-popup-content-wrapper{background:var(--card)!important;border-radius:var(--r)!important;box-shadow:var(--shL)!important;border:1px solid var(--brd)!important;padding:0!important}
.leaflet-popup-tip{background:var(--card)!important}
.leaflet-popup-content{margin:14px 16px!important;font-family:var(--f)!important}
.pop-n{font:700 14px/1.3 var(--fH);margin-bottom:2px;letter-spacing:-.2px}
.pop-a{font:500 11.5px/1.2 var(--f);color:var(--dim)}
.pop-m{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:11.5px}
.pop-btn{display:block;width:100%;margin-top:10px;padding:9px;border-radius:var(--rS);border:none;background:var(--pri);color:#fff;font:700 12px/1 var(--f);cursor:pointer;text-align:center;transition:all .15s}
.pop-btn:hover{background:var(--priD)}
.map-overlay{position:absolute;bottom:20px;left:20px;z-index:800;display:flex;gap:8px}
.map-chip{padding:8px 14px;border-radius:var(--rS);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--brd);font:600 11px/1 var(--f);color:var(--sub);display:flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.map-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.emg-fab{position:absolute;bottom:20px;right:20px;z-index:800;padding:12px 22px;border-radius:var(--r);background:linear-gradient(135deg,var(--red),#B52D3A);color:#fff;border:none;font:700 13px/1 var(--f);cursor:pointer;box-shadow:0 4px 20px rgba(214,59,75,.4);display:flex;align-items:center;gap:8px;transition:all .2s var(--ease)}
.emg-fab:hover{transform:scale(1.04);box-shadow:0 6px 28px rgba(214,59,75,.5)}

/* ═══ DETAIL PANEL ═══ */
.dp-overlay{position:fixed;inset:0;background:rgba(27,31,42,.35);backdrop-filter:blur(2px);z-index:2000;display:none;justify-content:flex-end;animation:fadeIn .2s var(--ease)}
.dp-overlay.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.dp{width:480px;background:var(--card);height:100%;overflow-y:auto;box-shadow:var(--shL);animation:slideIn .3s var(--ease)}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.dp-hero{padding:24px 24px 18px;border-bottom:1px solid var(--brd);position:relative}
.dp-close{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:var(--rS);background:var(--brdL);border:none;cursor:pointer;font-size:18px;color:var(--dim);display:flex;align-items:center;justify-content:center;transition:all .15s}.dp-close:hover{background:var(--brd);color:var(--txt)}
.dp-name{font:800 20px/1.25 var(--fH);letter-spacing:-.5px;padding-right:44px;margin-bottom:4px}
.dp-addr{font:500 12.5px/1.3 var(--f);color:var(--dim);display:flex;align-items:center;gap:4px;margin-bottom:10px}
.dp-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dp-tabs{display:flex;border-bottom:1px solid var(--brd);background:var(--bg)}
.dp-tab{flex:1;padding:13px 0;font:600 12.5px/1 var(--f);color:var(--dim);border:none;background:none;cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:all .15s}.dp-tab.on{color:var(--pri);border-bottom-color:var(--pri);background:var(--card)}
.dp-body{padding:20px 24px}
.dp-sect{font:700 14px/1 var(--fH);letter-spacing:-.2px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dp-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:20px}
.dp-tg{font:500 11.5px/1 var(--f);padding:6px 14px;background:var(--priL);border-radius:8px;color:var(--pri)}
.dp-hrs{background:var(--bg);border-radius:var(--r);padding:14px 16px;margin-bottom:20px;font-size:12.5px}
.dp-hr-row{display:flex;justify-content:space-between;margin-bottom:5px}.dp-hr-row:last-child{margin:0}
.dp-hr-row span:first-child{color:var(--sub)}.dp-hr-row strong{color:var(--txt)}
.dp-acts{display:flex;gap:8px;margin-top:4px}
.dp-act{flex:1;padding:13px;border-radius:var(--r);font:700 13.5px/1 var(--f);cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s var(--ease)}
.dp-act-pri{background:var(--pri);color:#fff;border:none}.dp-act-pri:hover{background:var(--priD);box-shadow:0 4px 16px rgba(10,117,88,.3)}
.dp-act-sec{background:var(--card);color:var(--sub);border:1.5px solid var(--brd)}.dp-act-sec:hover{border-color:var(--pri);color:var(--pri)}
.dp-review{padding:14px;background:var(--bg);border-radius:var(--r);margin-bottom:8px}
.dp-rv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dp-rv-u{font:700 12.5px/1 var(--f)}.dp-rv-t{font:400 12.5px/1.55 var(--f);color:var(--sub)}
.dp-empty{text-align:center;padding:36px 20px;color:var(--dim);font-size:12.5px}

/* ═══ BOOKING MODAL ═══ */
.bk-overlay{position:fixed;inset:0;background:rgba(27,31,42,.4);backdrop-filter:blur(2px);z-index:3000;display:none;align-items:center;justify-content:center}
.bk-overlay.open{display:flex}
.bk{width:420px;background:var(--card);border-radius:var(--rL);box-shadow:var(--shL);overflow:hidden;animation:bkIn .3s var(--ease)}
@keyframes bkIn{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.bk-hdr{padding:20px 24px 16px;border-bottom:1px solid var(--brd);display:flex;justify-content:space-between;align-items:flex-start}
.bk-title{font:800 18px/1.2 var(--fH);letter-spacing:-.3px}
.bk-sub{font:500 12.5px/1 var(--f);color:var(--dim);margin-top:3px}
.bk-prog{display:flex;gap:4px;padding:0 24px;margin:16px 0}
.bk-dot{flex:1;height:4px;border-radius:2px;background:var(--brd);transition:background .3s var(--ease)}.bk-dot.on{background:var(--pri)}
.bk-body{padding:8px 24px 24px;max-height:400px;overflow-y:auto}
.bk-opt{padding:14px 16px;border:1.5px solid var(--brd);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:all .15s var(--ease);display:flex;align-items:center;gap:12px}
.bk-opt:hover{border-color:var(--pri)}.bk-opt.sel{border-color:var(--pri);background:var(--priL)}
.bk-opt-icon{font-size:22px;flex-shrink:0}
.bk-opt-txt{font:600 13px/1.3 var(--f)}.bk-opt-sub{font:400 11px/1 var(--f);color:var(--dim);margin-top:2px}
.bk-time{padding:10px 16px;border:1.5px solid var(--brd);border-radius:var(--rS);cursor:pointer;font:600 13px/1 var(--f);text-align:center;transition:all .15s var(--ease)}
.bk-time:hover{border-color:var(--pri)}.bk-time.sel{border-color:var(--pri);background:var(--priL);color:var(--pri)}
.bk-btn{width:100%;padding:14px;border-radius:var(--r);border:none;font:700 14px/1 var(--f);cursor:pointer;margin-top:12px;transition:all .15s var(--ease)}
.bk-btn-pri{background:var(--pri);color:#fff}.bk-btn-pri:hover{background:var(--priD)}.bk-btn-pri:disabled{opacity:.4;cursor:not-allowed}
.bk-btn-ghost{background:none;color:var(--dim);margin-top:4px;padding:8px}
.bk-done{text-align:center;padding:30px 24px}
.bk-done-ico{width:64px;height:64px;border-radius:50%;background:var(--priL);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}

/* ═══ PETS VIEW ═══ */
.pets-wrap{flex:1;overflow-y:auto;padding:24px;max-width:700px;margin:0 auto;width:100%}
.pet-card{background:var(--card);border:1.5px solid var(--brd);border-radius:var(--rL);padding:20px;margin-bottom:14px;cursor:pointer;transition:all .2s var(--ease);box-shadow:var(--sh)}
.pet-card:hover{border-color:var(--pri);box-shadow:var(--shM);transform:translateY(-2px)}
.pet-top{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.pet-avatar{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px}
.pet-info h3{font:800 20px/1 var(--fH);letter-spacing:-.3px}
.pet-info p{font:500 13px/1 var(--f);color:var(--dim);margin-top:4px}
.pet-health{display:flex;gap:10px}
.pet-h-item{flex:1;padding:12px 14px;border-radius:var(--r);background:var(--bg);display:flex;align-items:center;gap:10px}
.pet-h-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pet-h-label{font:700 11px/1 var(--f)}.pet-h-status{font:600 11px/1 var(--f)}
.pet-detail{background:var(--card);border:1.5px solid var(--brd);border-radius:var(--rL);padding:24px;margin-bottom:14px;box-shadow:var(--sh)}
.pd-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg);border-radius:var(--r);margin-bottom:6px}
.pd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pd-name{font:700 12.5px/1 var(--f);flex:1}.pd-date{font:500 11px/1 var(--f);color:var(--dim)}
.pd-badge{font:600 10px/1 var(--f);padding:4px 10px;border-radius:6px}
.visit-row{padding:14px;border-left:3px solid var(--pri);background:var(--bg);border-radius:0 var(--r) var(--r) 0;margin-bottom:8px;margin-left:8px}
.visit-row h4{font:700 13px/1 var(--f);margin-bottom:3px}.visit-row p{font:400 12px/1.5 var(--f);color:var(--sub)}.visit-row small{font:500 11px/1 var(--f);color:var(--dim)}

/* ═══ EMERGENCY ═══ */
.emg-panel{padding:20px 24px}
.emg-hdr{text-align:center;margin-bottom:20px}
.emg-ico{width:60px;height:60px;border-radius:50%;background:var(--redL);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px}
.emg-title{font:800 20px/1 var(--fH);letter-spacing:-.3px}
.emg-sub{font:500 12.5px/1 var(--f);color:var(--dim);margin-top:4px}
.emg-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);margin-bottom:8px;border:1.5px solid var(--brd);background:var(--card);transition:all .15s}
.emg-card.feat{background:var(--priL);border-color:rgba(10,117,88,.3)}
.emg-info{flex:1;min-width:0}.emg-info h4{font:700 13.5px/1.2 var(--fH);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emg-info p{font:500 11.5px/1 var(--f);color:var(--dim);margin-top:2px}
.emg-btns{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.emg-call{padding:9px 18px;border-radius:8px;background:linear-gradient(135deg,var(--red),#B52D3A);color:#fff;border:none;font:700 12px/1 var(--f);cursor:pointer;display:flex;align-items:center;gap:4px;text-decoration:none;text-align:center;justify-content:center}
.emg-route{padding:7px 18px;border-radius:8px;border:1px solid var(--brd);background:var(--card);font:500 11px/1 var(--f);cursor:pointer;text-decoration:none;color:var(--sub);text-align:center}

/* ═══ RESPONSIVE ═══ */
@media(max-width:960px){
.disc{flex-direction:column}.side{width:100%;min-width:100%;height:50vh;border-right:none;border-top:1px solid var(--brd);order:2}
.map-area{height:50vh;order:1}.hdr-stats{display:none}.srch{max-width:none}.dp{width:100%}.hdr-nav{gap:2px}.hdr-btn span{display:none}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="brand" onclick="switchView('discover')">
    <div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 3.87 7 13 7 13s7-9.13 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg></div>
    <div class="brand-txt">Vet<em>Finder</em></div>
  </div>

function initMap(){

function switchView(v){
  curView=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));
  document.querySelectorAll('.hdr-btn').forEach(b=>b.classList.remove('act'));
  if(v==='discover'){document.getElementById('vDiscover').classList.add('on');document.getElementById('navDisc').classList.add('act');}
  else if(v==='pets'){document.getElementById('vPets').classList.add('on');document.getElementById('navPets').classList.add('act');renderPets();}
  else if(v==='appts'){document.getElementById('vAppts').classList.add('on');document.getElementById('navAppts').classList.add('act');renderAppts();}
}

// ═══ RENDER LIST ═══
function render(){
  const q=document.getElementById('sInput').value.toLowerCase().trim();
  let list=D.filter(c=>{
    const qm=!q||c.n.toLowerCase().includes(q)||c.z.toLowerCase().includes(q)||c.sv.some(s=>s.toLowerCase().includes(q));
    const fm=filt==='all'||(filt==='24h'&&c.h24)||(filt==='urg'&&c.sv.some(s=>s.toLowerCase().includes('urgencia')))||(filt==='cir'&&c.sv.some(s=>s.toLowerCase().includes('cirugía')))||(filt==='exo'&&c.sv.some(s=>s.toLowerCase().includes('exótico')||s.toLowerCase().includes('conejos')))||(filt==='top'&&c.r>=4.7)||(filt==='ofe'&&c.of);
    return qm&&fm;
  }).sort((a,b)=>(b.f?10:0)-(a.f?10:0)||(b.r*Math.log10(b.rc+1))-(a.r*Math.log10(a.rc+1)));

  // Filters
  document.getElementById('fBar').innerHTML=[['all','Todas'],['24h','🕐 24h'],['urg','🚨 Urgencias'],['cir','🔪 Cirugía'],['exo','🦎 Exóticos'],['top','⭐ Top'],['ofe','🎁 Ofertas']].map(([k,l])=>`<button class="chip ${filt===k?'on':''}" onclick="filt='${k}';render()">${l}</button>`).join('');

  // Stats
  document.getElementById('hStats').innerHTML=`<div class="hdr-stat"><b>${list.length}</b><small>Clínicas</small></div><div class="hdr-stat"><b>${list.filter(c=>c.h24).length}</b><small>24h</small></div><div class="hdr-stat"><b>${list.filter(c=>c.r>=4.7).length}</b><small>Top</small></div>`;

  // Cards
  const fe=list.filter(c=>c.f),re=list.filter(c=>!c.f);
  let h='';
  if(fe.length){h+=`<div class="sec-label">★ Recomendadas</div>`;fe.forEach(c=>h+=cardH(c));}
  if(re.length){h+=`<div class="sec-label">En tu zona <span class="cnt">${re.length}</span></div>`;re.forEach(c=>h+=cardH(c));}
  if(!list.length)h=`<div style="text-align:center;padding:50px;color:var(--dim)">Sin resultados</div>`;
  document.getElementById('cList').innerHTML=h;

  // Markers
  D.forEach(c=>{const m=markers[c.id];list.find(x=>x.id===c.id)?(!map.hasLayer(m)&&m.addTo(map)):map.hasLayer(m)&&map.removeLayer(m);});
}

function cardH(c){
  return`<div class="cc ${c.f?'feat':''} ${activeId===c.id?'active':''}" id="c-${c.id}" onclick="selectC('${c.id}')">
<div class="cc-row1"><div class="cc-name">${c.n}</div><div class="cc-badges">${c.f?'<span class="badge badge-mv">★ MadVet</span>':''}${c.v&&!c.f?'<span class="badge badge-ver">✓ Verificada</span>':''}${c.h24?'<span class="badge badge-24">24h</span>':''}</div></div>
<div class="cc-loc">📍 ${c.z}${c.p?' · <b>'+c.p+'</b>':''}</div>
<div class="cc-rating"><div class="cc-stars">${star(c.r)}</div><span class="cc-r">${c.r}</span><span class="cc-rc">(${c.rc.toLocaleString()})</span></div>
<div class="cc-tags">${c.sv.slice(0,3).map(s=>`<span class="cc-tag">${s}</span>`).join('')}${c.sv.length>3?`<span class="cc-tag">+${c.sv.length-3}</span>`:''}</div>
${c.of?`<div class="cc-offer">🎁 ${c.of}</div>`:''}
<div class="cc-btns"><button class="cc-btn cc-btn-pri" onclick="event.stopPropagation();openDP('${c.id}')">Ver clínica</button><a class="cc-btn cc-btn-sec" href="tel:${c.ph}" onclick="event.stopPropagation()">📞 Llamar</a><a class="cc-btn cc-btn-sec" href="https://maps.google.com/?daddr=${c.lat},${c.lng}" target="_blank" onclick="event.stopPropagation()">🗺️</a></div></div>`;
}

function selectC(id){setActive(id);const c=D.find(x=>x.id===id);if(c){map.flyTo([c.lat,c.lng],14,{duration:.6});markers[id].openPopup();}}
function setActive(id){activeId=id;render();const el=document.getElementById('c-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}

// ═══ DETAIL PANEL ═══
function openDP(id){
  const c=D.find(x=>x.id===id);if(!c)return;
  document.getElementById('dpO').classList.add('open');
  const dp=document.getElementById('dpC');
  dp.innerHTML=`
<div class="dp-hero"><button class="dp-close" onclick="closeDP()">✕</button>
<div class="dp-name">${c.n}</div><div class="dp-addr">📍 ${c.a}</div>
<div class="dp-meta"><div class="cc-stars">${star(c.r,15)}</div><b style="font-size:14px">${c.r}</b><span style="color:var(--dim);font-size:12px">${c.rc.toLocaleString()} reseñas</span>
${c.v?'<span class="badge badge-ver">✓ Verificada</span>':''}${c.f?'<span class="badge badge-mv">★ MadVet</span>':''}</div></div>
<div class="dp-tabs"><button class="dp-tab on" onclick="dpTab(this,'dp-info')">Info</button><button class="dp-tab" onclick="dpTab(this,'dp-revs')">Reseñas</button></div>
<div class="dp-body">
<div id="dp-info">
<div class="dp-sect">🩺 Servicios</div><div class="dp-tags">${c.sv.map(s=>`<span class="dp-tg">${s}</span>`).join('')}</div>
<div class="dp-sect">🕐 Horario</div><div class="dp-hrs">${c.hr.map(([d,h])=>`<div class="dp-hr-row"><span>${d}</span><strong>${h}</strong></div>`).join('')}</div>
<div style="font-size:12.5px;color:var(--dim);margin-bottom:16px;display:flex;align-items:center;gap:5px">📞 ${c.ph}</div>
${c.of?`<div class="cc-offer" style="margin-bottom:16px">🎁 ${c.of}</div>`:''}
<div class="dp-acts">
<button class="dp-act dp-act-pri" onclick="openBK('${c.id}')">📅 Pedir cita</button>
<a class="dp-act dp-act-sec" href="tel:${c.ph}">📞 Llamar</a></div>
<a href="https://maps.google.com/?daddr=${c.lat},${c.lng}" target="_blank" style="display:block;text-align:center;margin-top:10px;padding:12px;border-radius:var(--r);border:1.5px solid var(--brd);font:600 13px/1 var(--f);color:var(--sub);text-decoration:none">🗺️ Cómo llegar</a>
${c.w?`<a href="${c.w}" target="_blank" style="display:block;text-align:center;margin-top:8px;font:600 12px/1 var(--f);color:var(--pri);text-decoration:none">Visitar web →</a>`:''}</div>
<div id="dp-revs" style="display:none">${c.rv.length?c.rv.map(r=>`<div class="dp-review"><div class="dp-rv-top"><span class="dp-rv-u">${r.u}</span><span style="color:var(--gold)">${'★'.repeat(r.s)}</span></div><div class="dp-rv-t">${r.t}</div></div>`).join(''):`<div class="dp-empty">${c.rc.toLocaleString()} reseñas en Google<br>Próximamente en la app</div>`}</div>
</div>`;
  selectC(id);
}
function closeDP(){document.getElementById('dpO').classList.remove('open');}
function dpTab(btn,tabId){btn.parentElement.querySelectorAll('.dp-tab').forEach(t=>t.classList.remove('on'));btn.classList.add('on');document.querySelectorAll('.dp-body>div').forEach(d=>d.style.display='none');document.getElementById(tabId).style.display='block';}

// ═══ BOOKING ═══
let bkClinic=null,bkStep=0,bkData={};
function openBK(id){bkClinic=D.find(x=>x.id===id);bkStep=0;bkData={};closeDP();renderBK();}
function closeBK(){document.getElementById('bkO').classList.remove('open');}
function renderBK(){
  const c=bkClinic;if(!c)return;
  document.getElementById('bkO').classList.add('open');
  const dates=['Lun 19 May','Mar 20 May','Mié 21 May','Jue 22 May','Vie 23 May','Lun 26 May'];
  const times=['09:00','09:30','10:00','10:30','11:00','11:30','12:00','16:00','16:30','17:00','17:30','18:00','18:30','19:00'];
  const svcs=['Consulta general','Revisión','Vacunación','Cirugía','Dental','Ecografía','Desparasitación'];
  let h=`<div class="bk-hdr"><div><div class="bk-title">Pedir cita</div><div class="bk-sub">${c.n}</div></div><button class="dp-close" onclick="closeBK()" style="position:static">✕</button></div>
  <div class="bk-prog">${[0,1,2,3].map(i=>`<div class="bk-dot ${i<=bkStep?'on':''}"></div>`).join('')}</div><div class="bk-body">`;
  if(bkStep===0){
    h+=`<div style="font:700 14px/1 var(--fH);margin-bottom:12px">¿Para quién es la cita?</div>`;
    PETS.forEach(p=>{h+=`<div class="bk-opt ${bkData.pet===p.id?'sel':''}" onclick="bkData.pet='${p.id}';bkStep=1;renderBK()"><span class="bk-opt-icon">${p.ava}</span><div><div class="bk-opt-txt">${p.name}</div><div class="bk-opt-sub">${p.breed}</div></div></div>`;});
  }else if(bkStep===1){
    h+=`<div style="font:700 14px/1 var(--fH);margin-bottom:12px">¿Qué necesitas?</div><div style="display:flex;flex-wrap:wrap;gap:6px">`;
    svcs.forEach(s=>{h+=`<button class="bk-time ${bkData.svc===s?'sel':''}" onclick="bkData.svc='${s}';bkStep=2;renderBK()">${s}</button>`;});
    h+=`</div><button class="bk-btn bk-btn-ghost" onclick="bkStep=0;renderBK()">← Atrás</button>`;
  }else if(bkStep===2){
    h+=`<div style="font:700 14px/1 var(--fH);margin-bottom:12px">Elige día</div><div style="display:flex;flex-wrap:wrap;gap:6px">`;
    dates.forEach(d=>{h+=`<button class="bk-time ${bkData.date===d?'sel':''}" onclick="bkData.date='${d}';bkStep=3;renderBK()">${d}</button>`;});
    h+=`</div><button class="bk-btn bk-btn-ghost" onclick="bkStep=1;renderBK()">← Atrás</button>`;
  }else if(bkStep===3){
    h+=`<div style="font:700 14px/1 var(--fH);margin-bottom:4px">Elige hora</div><div style="font:500 12px/1 var(--f);color:var(--dim);margin-bottom:12px">${bkData.date}</div><div style="display:flex;flex-wrap:wrap;gap:6px">`;
    times.forEach(t=>{h+=`<button class="bk-time ${bkData.time===t?'sel':''}" onclick="bkData.time='${t}';renderBK()">${t}</button>`;});
    h+=`</div><button class="bk-btn bk-btn-pri" ${bkData.time?'':'disabled'} onclick="bkStep=4;renderBK()">Confirmar cita</button><button class="bk-btn bk-btn-ghost" onclick="bkStep=2;renderBK()">← Atrás</button>`;
  }else if(bkStep===4){
    const pet=PETS.find(p=>p.id===bkData.pet);
    h+=`<div class="bk-done"><div class="bk-done-ico">✓</div><div style="font:800 20px/1 var(--fH);margin-bottom:6px">¡Cita solicitada!</div><div style="font:500 13px/1 var(--f);color:var(--dim)">${c.n}</div><div style="font:600 15px/1 var(--f);margin-top:8px">${bkData.date} · ${bkData.time}</div><div style="font:500 12px/1 var(--f);color:var(--dim);margin-top:4px">${pet?.ava} ${pet?.name} · ${bkData.svc}</div><div style="margin-top:20px;padding:12px;background:var(--goldL);border-radius:var(--r);font:500 12px/1 var(--f);color:#8B6914">📲 Recibirás confirmación en breve</div><button class="bk-btn bk-btn-pri" style="margin-top:16px" onclick="closeBK()">Listo</button></div>`;
  }
  h+=`</div>`;
  document.getElementById('bkC').innerHTML=h;
}

// ═══ EMERGENCY ═══
function showEmergency(){
  const h24=D.filter(c=>c.h24).sort((a,b)=>(b.f?1:0)-(a.f?1:0)||(b.r-a.r));
  document.getElementById('dpO').classList.add('open');
  document.getElementById('dpC').innerHTML=`<div class="emg-panel"><div class="emg-hdr"><div class="emg-ico">🚨</div><div class="emg-title">Urgencias 24h</div><div class="emg-sub">${h24.length} centros disponibles ahora</div></div>${h24.map(c=>`<div class="emg-card ${c.f?'feat':''}"><div class="emg-info"><h4>${c.n}</h4><p>${c.z} · <span style="color:var(--gold)">★</span> ${c.r} (${c.rc.toLocaleString()})</p></div><div class="emg-btns"><a class="emg-call" href="tel:${c.ph}">📞 Llamar</a><a class="emg-route" href="https://maps.google.com/?daddr=${c.lat},${c.lng}" target="_blank">🗺️ Ruta</a></div></div>`).join('')}</div>`;
}

// ═══ PETS VIEW ═══
function renderPets(){
  let h=`<div class="pets-wrap"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><div style="font:800 24px/1 var(--fH);letter-spacing:-.5px">Mis mascotas</div><button class="hdr-btn" style="border-radius:var(--rS)">+ Añadir</button></div>`;
  PETS.forEach(p=>{
    const wV=p.vax.reduce((a,v)=>v.s==='expired'?'expired':v.s==='soon'&&a!=='expired'?'soon':a,'ok');
    const wD=p.dw.reduce((a,v)=>v.s==='expired'?'expired':v.s==='soon'&&a!=='expired'?'soon':a,'ok');
    h+=`<div class="pet-card"><div class="pet-top"><div class="pet-avatar" style="background:${p.color}18;border:2px solid ${p.color}44">${p.ava}</div><div class="pet-info"><h3>${p.name}</h3><p>${p.breed} · ${p.age} · ${p.wt}</p></div></div><div class="pet-health"><div class="pet-h-item"><div class="pet-h-dot" style="background:${sC(wV)}"></div><div><div class="pet-h-label">Vacunas</div><div class="pet-h-status" style="color:${sC(wV)}">${sL(wV)}</div></div></div><div class="pet-h-item"><div class="pet-h-dot" style="background:${sC(wD)}"></div><div><div class="pet-h-label">Desparasitación</div><div class="pet-h-status" style="color:${sC(wD)}">${sL(wD)}</div></div></div></div></div>`;
    // Detail
    h+=`<div class="pet-detail"><div style="font:700 14px/1 var(--fH);margin-bottom:4px">📋 Ficha de ${p.name}</div><div style="font:500 12px/1 var(--f);color:var(--dim);margin-bottom:14px">Chip: ${p.chip}${p.allergy.length?' · ⚠️ Alergia: '+p.allergy.join(', '):''}</div>`;
    h+=`<div class="dp-sect">💉 Vacunas</div>`;
    p.vax.forEach(v=>{h+=`<div class="pd-row"><div class="pd-dot" style="background:${sC(v.s)}"></div><div class="pd-name">${v.n}</div><div class="pd-date">${v.d} → ${v.nx}</div><div class="pd-badge" style="background:${sC(v.s)}18;color:${sC(v.s)}">${sL(v.s)}</div></div>`;});
    h+=`<div class="dp-sect" style="margin-top:16px">💊 Desparasitación</div>`;
    p.dw.forEach(d=>{h+=`<div class="pd-row"><div class="pd-dot" style="background:${sC(d.s)}"></div><div class="pd-name">${d.n}</div><div class="pd-date">${d.d} → ${d.nx}</div><div class="pd-badge" style="background:${sC(d.s)}18;color:${sC(d.s)}">${sL(d.s)}</div></div>`;});
    h+=`<div class="dp-sect" style="margin-top:16px">📅 Historial de visitas</div>`;
    p.vis.forEach(v=>{h+=`<div class="visit-row"><h4>${v.r}</h4><small>${v.d} · ${v.cl}</small><p>${v.nt}</p></div>`;});
    h+=`</div>`;
  });
  h+=`</div>`;
  document.getElementById('vPets').innerHTML=h;
}

// ═══ APPOINTMENTS ═══
function renderAppts(){
  let h=`<div class="pets-wrap"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><div style="font:800 24px/1 var(--fH);letter-spacing:-.5px">Mis citas</div><button class="hdr-btn act" onclick="openBK('mv1')">+ Nueva cita</button></div>`;
  APPTS.forEach(a=>{
    const pet=PETS.find(p=>p.id===a.pet);const cl=D.find(c=>c.id===a.cl);
    h+=`<div class="pet-card" style="cursor:default"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px"><div><div style="font:700 16px/1.2 var(--fH)">${a.svc}</div><div style="font:500 12.5px/1 var(--f);color:var(--dim);margin-top:4px">${cl?.n}</div></div><span class="badge" style="background:${a.st==='confirmed'?'var(--priL)':'var(--goldL)'};color:${a.st==='confirmed'?'var(--pri)':'#8B6914'}">${a.st==='confirmed'?'✓ Confirmada':'⏳ Pendiente'}</span></div><div style="display:flex;gap:16px;font:500 13px/1 var(--f)"><span>📅 ${a.date}</span><span>🕐 ${a.time}</span><span>${pet?.ava} ${pet?.name}</span></div></div>`;
  });
  h+=`</div>`;
  document.getElementById('vAppts').innerHTML=h;
}

// ═══ INIT ═══
initMap();render();
</script>
</body>
</html>
