<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0A7558">
<title>VetFinder — Tu veterinario, siempre cerca</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g1:#0A7558;--g2:#0C9A72;--g3:#10B981;--gL:#E6F9F1;--gG:rgba(10,117,88,.06);--bg:#F6F6F2;--card:#FFF;--txt:#16192A;--sub:#454B63;--dim:#7E849E;--lt:#B3B8CC;--brd:#E4E6ED;--brdL:#F0F1F5;--gold:#D4950A;--goldBg:#FDF6E3;--red:#C73A4A;--redBg:#FDF0F1;--orange:#C96B1D;--orangeBg:#FDF3EA;--sh:0 1px 3px rgba(22,25,42,.05);--shM:0 4px 16px rgba(22,25,42,.07);--shL:0 10px 40px rgba(22,25,42,.1);--shXL:0 20px 60px rgba(22,25,42,.15);--r:16px;--rS:10px;--rXS:8px;--f:'DM Sans',system-ui,sans-serif;--fH:'Outfit',system-ui,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
html,body{height:100%;overflow:hidden}body{font-family:var(--f);background:var(--bg);color:var(--txt);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
header{display:flex;align-items:center;gap:14px;padding:0 24px;height:62px;background:var(--card);border-bottom:1px solid var(--brd);z-index:1000;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}.logo-i{width:34px;height:34px;background:linear-gradient(150deg,var(--g1),var(--g3));border-radius:10px;display:grid;place-items:center;box-shadow:0 2px 8px rgba(10,117,88,.2)}.logo-i svg{width:17px;height:17px;fill:#fff}.logo-t{font:800 18px/1 var(--fH);letter-spacing:-.6px}.logo-t b{color:var(--g1);font-weight:800}
.srch{flex:1;max-width:380px;position:relative}.srch input{width:100%;height:40px;padding:0 16px 0 38px;border:1.5px solid var(--brd);border-radius:var(--rS);background:var(--brdL);font:500 13px var(--f);color:var(--txt);outline:none;transition:all .2s}.srch input:focus{border-color:var(--g1);background:#fff;box-shadow:0 0 0 3px var(--gG)}.srch input::placeholder{color:var(--lt)}.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--lt);pointer-events:none}
.hdr-r{display:flex;gap:20px;margin-left:auto;align-items:center}.hdr-n{text-align:center}.hdr-n b{display:block;font:800 18px/1 var(--fH);color:var(--g1)}.hdr-n small{font:500 8.5px/1 var(--f);color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.wrap{display:flex;flex:1;overflow:hidden}
.side{width:440px;min-width:440px;display:flex;flex-direction:column;border-right:1px solid var(--brd);background:var(--card);z-index:500}
.fbar{padding:10px 14px;border-bottom:1px solid var(--brd);display:flex;gap:5px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}.fbar::-webkit-scrollbar{display:none}
.ch{height:32px;padding:0 14px;border-radius:16px;font:600 11.5px/32px var(--f);cursor:pointer;border:1.5px solid var(--brd);background:var(--card);color:var(--dim);transition:all .15s;white-space:nowrap;flex-shrink:0}.ch:hover{border-color:var(--g1);color:var(--g1)}.ch.on{background:var(--g1);color:#fff;border-color:var(--g1);box-shadow:0 2px 8px rgba(10,117,88,.2)}
.cl{flex:1;overflow-y:auto;padding:4px 0}
.sec-l{padding:14px 16px 8px;font:700 10px/1 var(--fH);letter-spacing:2px;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}.sec-l::after{content:'';flex:1;height:1px;background:var(--brd)}.sec-l .n{background:var(--gL);color:var(--g1);font:700 10px/1 var(--f);padding:3px 9px;border-radius:10px;letter-spacing:0}
.c{margin:5px 10px;border:1.5px solid var(--brd);border-radius:var(--r);cursor:pointer;transition:all .25s var(--ease);position:relative;overflow:hidden;background:var(--card)}.c:hover{border-color:var(--g2);box-shadow:var(--shM);transform:translateY(-2px)}.c.f{border-color:rgba(10,117,88,.18);background:linear-gradient(170deg,#FCFFFE,#F2FAF6)}.c.f::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g1),var(--g3));z-index:2}.c.act{border-color:var(--g1);box-shadow:0 0 0 3px var(--gG),var(--shM)}
.c-img{width:100%;height:140px;object-fit:cover;display:block;background:var(--brdL)}
.c-body{padding:14px 16px 16px}
.c-name{font:700 14.5px/1.25 var(--fH);letter-spacing:-.3px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-addr{font:400 11.5px/1.3 var(--f);color:var(--dim);margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.c-stars{display:flex;gap:0}.c-stars svg{width:14px;height:14px}
.c-rat{font:700 13.5px/1 var(--fH)}.c-rc{font:400 11.5px/1 var(--f);color:var(--dim)}
.bg{font:600 9px/1 var(--f);padding:4px 9px;border-radius:5px;display:inline-flex;align-items:center;gap:3px;letter-spacing:.2px}.bg-mv{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}.bg-24{background:var(--orangeBg);color:var(--orange)}.bg-op{background:var(--gL);color:var(--g1)}.bg-cl{background:var(--redBg);color:var(--red)}
.c-offer{display:flex;align-items:center;gap:5px;padding:6px 10px;background:var(--goldBg);border-radius:var(--rXS);margin-bottom:10px;font:600 11px/1.2 var(--f);color:var(--gold)}
.c-btns{display:flex;gap:6px}.c-bp{flex:1;height:38px;border-radius:var(--rS);border:none;background:var(--g1);color:#fff;font:700 12.5px/38px var(--f);cursor:pointer;transition:all .15s;text-align:center}.c-bp:hover{background:var(--g2)}.c-bs{width:38px;height:38px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:16px;transition:all .15s;text-decoration:none;color:var(--sub)}.c-bs:hover{border-color:var(--g1);color:var(--g1)}
.map-w{flex:1;position:relative}#map{width:100%;height:100%}
.emg{position:absolute;bottom:20px;right:20px;z-index:10;height:44px;padding:0 20px;border-radius:22px;background:linear-gradient(135deg,var(--red),#A22D3B);color:#fff;border:none;font:700 13px/44px var(--f);cursor:pointer;box-shadow:0 4px 18px rgba(199,58,74,.35);display:flex;align-items:center;gap:8px;transition:all .25s}.emg:hover{transform:translateY(-2px)}
.ld{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px;font:600 13.5px/1 var(--f);color:var(--dim)}.ld-s{width:28px;height:28px;border:3px solid var(--brd);border-top-color:var(--g1);border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ov{position:fixed;inset:0;background:rgba(22,25,42,.3);backdrop-filter:blur(3px);z-index:2000;opacity:0;pointer-events:none;transition:opacity .25s}.ov.on{opacity:1;pointer-events:auto}
.dp{position:fixed;top:0;right:0;bottom:0;width:480px;background:var(--card);z-index:2001;transform:translateX(100%);transition:transform .35s var(--ease);overflow-y:auto;box-shadow:var(--shXL)}.dp.on{transform:translateX(0)}
.dp-x{position:absolute;top:14px;right:14px;z-index:10;width:36px;height:36px;border-radius:var(--rXS);background:rgba(255,255,255,.85);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.5);cursor:pointer;display:grid;place-items:center;font:500 18px/1 var(--f);color:var(--sub);box-shadow:var(--sh)}.dp-x:hover{background:#fff}
.dp-gallery{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;-ms-overflow-style:none;scrollbar-width:none}.dp-gallery::-webkit-scrollbar{display:none}.dp-gallery img{width:220px;height:170px;object-fit:cover;flex-shrink:0;scroll-snap-align:start}.dp-gallery img:first-child{width:260px}
.dp-h{padding:18px 22px 14px}.dp-name{font:800 21px/1.2 var(--fH);letter-spacing:-.5px;margin-bottom:4px}.dp-addr{font:400 12.5px/1.3 var(--f);color:var(--dim);margin-bottom:10px}.dp-mr{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dp-d{border-top:1px solid var(--brd);padding:18px 22px 22px}.dp-st{font:700 13.5px/1 var(--fH);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.dp-hrs{background:var(--brdL);border-radius:var(--rS);padding:14px 16px;margin-bottom:16px}.dp-hr{display:flex;justify-content:space-between;font:400 12.5px/1 var(--f);padding:4px 0;color:var(--sub)}.dp-hr strong{font-weight:600;color:var(--txt)}
.dp-btns{display:flex;gap:8px;margin-bottom:16px}.dp-b1{flex:1;height:46px;border-radius:var(--r);border:none;background:var(--g1);color:#fff;font:700 14px/46px var(--f);cursor:pointer;text-align:center;text-decoration:none;display:block}.dp-b1:hover{background:var(--g2)}.dp-b2{flex:1;height:46px;border-radius:var(--r);border:1.5px solid var(--brd);background:var(--card);color:var(--sub);font:600 14px/44px var(--f);text-align:center;text-decoration:none;display:block}
.rv{padding:14px;background:var(--brdL);border-radius:var(--rS);margin-bottom:8px}.rv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}.rv-n{font:600 12.5px/1 var(--f)}.rv-s{color:var(--gold);font-size:11px;letter-spacing:-1px}.rv-t{font:400 12.5px/1.55 var(--f);color:var(--sub)}
@media(max-width:960px){.wrap{flex-direction:column}.side{width:100%;min-width:100%;height:55vh;border-right:none;border-top:1px solid var(--brd);order:2}.map-w{height:45vh;order:1}.hdr-r{display:none}.srch{max-width:none}.dp{width:100%}header{padding:0 16px;height:56px}.c-img{height:120px}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#"><div class="logo-i"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 3.87 7 13 7 13s7-9.13 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg></div><div class="logo-t">Vet<b>Finder</b></div></a>
  <div class="srch"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sI" placeholder="Buscar clínica, zona o servicio..." oninput="renderList()"></div>
  <div class="hdr-r"><div class="hdr-n"><b id="stT">0</b><small>Clínicas</small></div><div class="hdr-n"><b id="st24">0</b><small>24h</small></div></div>
</header>
<div class="wrap">
  <div class="side"><div class="fbar" id="fbar"></div><div class="cl" id="cl"><div class="ld"><div class="ld-s"></div>Cargando clínicas de Madrid...</div></div></div>
  <div class="map-w"><div id="map"></div><button class="emg" onclick="showEmg()">🚨 Urgencias 24h</button></div>
</div>
<div class="ov" id="ov" onclick="closeDP()"></div>
<div class="dp" id="dp"></div>

<script>
const MV=[
  {pid:"ChIJb8mnOJCFQQ0RsSs1rwnvFck",name:"Hospital Veterinario MadVet",addr:"C. Fresa 2, CC Equinoccio, Majadahonda",lat:40.4545,lng:-3.8758,rating:4.9,rc:261,ph:"+34 682 62 82 38",web:"https://madvet.es",offer:"1ª consulta -50%",mv:1,is24:false},
  {pid:"ChIJM7K4WZ_RQw0RIkJk6gnQ3Hg",name:"Centro Vet. MadVet Las 4 Huellas",addr:"Trav. Cuatro Calles 15, San Agustín del Guadalix",lat:40.6796,lng:-3.6174,rating:4.8,rc:307,ph:"+34 911 13 41 49",web:"https://madvet.es",offer:"",mv:1,is24:false},
  {pid:"ChIJJcHwJj6IQQ0Rm11Up0mqAHM",name:"Centro Vet. Parque Aluche",addr:"C. de Quero 57, Latina, Madrid",lat:40.3905,lng:-3.7605,rating:4.8,rc:259,ph:"+34 917 17 18 22",web:"https://madvet.es",offer:"Pack vacunación cachorro",mv:1,is24:false}
];

let gMap,gSvc,all=[],activeId=null,filt='all',searched=new Set();
const stH=r=>{let s='';for(let i=1;i<=5;i++)s+=`<svg viewBox="0 0 24 24" fill="${i<=Math.round(r||0)?'#D4950A':'none'}" stroke="${i<=Math.round(r||0)?'#D4950A':'#D1D5E0'}" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;return s;};
const stT=r=>'★'.repeat(Math.round(r||0))+'☆'.repeat(5-Math.round(r||0));

// ═══ DETECT 24H ═══
function detect24(place){
  const nm=(place.name||'').toLowerCase();
  const kw=['24h','24 h','24 hora','urgencia','emergency','emergencia'];
  if(kw.some(k=>nm.includes(k)))return true;
  // Also check if Google says periods = always open
  const oh=place.opening_hours;
  if(oh&&oh.periods&&oh.periods.length===1){
    const p=oh.periods[0];
    if(p.open&&p.open.day===0&&p.open.hours===0&&p.open.minutes===0&&!p.close)return true;
  }
  // Check if name contains "hospital" (many vet hospitals are 24h)
  if(nm.includes('hospital')&&(nm.includes('vet')||nm.includes('animal')))return true;
  return false;
}

function initMap(){
  gMap=new google.maps.Map(document.getElementById('map'),{
    center:{lat:40.42,lng:-3.7},zoom:10,disableDefaultUI:true,zoomControl:true,
    zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_CENTER},
    styles:[{featureType:"poi",stylers:[{visibility:"off"}]},{featureType:"transit",stylers:[{visibility:"off"}]},{featureType:"water",stylers:[{color:"#daeaf5"}]},{featureType:"landscape",stylers:[{color:"#f2f2ed"}]},{featureType:"road.highway",elementType:"geometry",stylers:[{color:"#e8e8e0"}]},{featureType:"road.arterial",elementType:"geometry",stylers:[{color:"#f0f0ea"}]},{featureType:"road.local",elementType:"geometry",stylers:[{color:"#fafaf7"}]},{featureType:"road",elementType:"labels.text.fill",stylers:[{color:"#9ca5b3"}]}]
  });
  gSvc=new google.maps.places.PlacesService(gMap);

  // Add MadVet markers
  MV.forEach(mv=>{
    const m=new google.maps.Marker({position:{lat:mv.lat,lng:mv.lng},map:gMap,icon:{path:google.maps.SymbolPath.CIRCLE,scale:16,fillColor:'#0A7558',fillOpacity:1,strokeColor:'#fff',strokeWeight:3.5},zIndex:1000,title:mv.name});
    m.addListener('click',()=>loadDP(mv.pid));
    mv._m=m;all.push({...mv,_m:m});
  });

  // GRID SEARCH: divide Madrid into zones for comprehensive coverage
  const zones=[
    {lat:40.45,lng:-3.87,r:8000},  // Majadahonda/Pozuelo
    {lat:40.42,lng:-3.70,r:8000},  // Centro Madrid
    {lat:40.39,lng:-3.76,r:8000},  // Aluche/Latina/Carabanchel
    {lat:40.35,lng:-3.83,r:8000},  // Alcorcón/Leganés
    {lat:40.33,lng:-3.70,r:8000},  // Getafe/Fuenlabrada
    {lat:40.48,lng:-3.68,r:8000},  // Chamartín/Hortaleza
    {lat:40.55,lng:-3.65,r:8000},  // Alcobendas/SS Reyes
    {lat:40.60,lng:-3.71,r:8000},  // Tres Cantos
    {lat:40.68,lng:-3.62,r:8000},  // San Agustín/Colmenar
    {lat:40.41,lng:-3.89,r:8000},  // Boadilla
    {lat:40.50,lng:-3.90,r:8000},  // Las Rozas/V. Pardillo
    {lat:40.46,lng:-3.55,r:8000},  // Coslada/Torrejón
    {lat:40.48,lng:-3.37,r:8000},  // Alcalá de Henares
    {lat:40.36,lng:-3.53,r:8000},  // Rivas/Arganda
    {lat:40.33,lng:-3.86,r:8000},  // Móstoles
    {lat:40.24,lng:-3.77,r:8000},  // Parla
    {lat:40.40,lng:-3.60,r:8000},  // Vicálvaro/Vallecas
    {lat:40.64,lng:-4.02,r:8000},  // Villalba
    {lat:40.66,lng:-3.77,r:8000},  // Colmenar Viejo
  ];

  // Search all zones with staggered timing
  zones.forEach((z,i)=>{
    setTimeout(()=>searchZone(z.lat,z.lng,z.r),i*400);
  });

  // Also search when user moves map AND update list
  gMap.addListener('idle',()=>{
    renderList(); // Update sidebar to show only visible clinics
    const c=gMap.getCenter();
    const key=Math.round(c.lat()*100)+','+Math.round(c.lng()*100);
    if(!searched.has(key)){
      searched.add(key);
      searchZone(c.lat(),c.lng(),getR());
    }
  });

  renderFilters();
}

function searchZone(lat,lng,radius){
  const key=Math.round(lat*50)+','+Math.round(lng*50);
  if(searched.has(key))return;
  searched.add(key);
  gSvc.nearbySearch({location:{lat,lng},radius:radius,type:'veterinary_care'},(res,st,pg)=>{
    if(st===google.maps.places.PlacesServiceStatus.OK){
      addResults(res);
      if(pg&&pg.hasNextPage)setTimeout(()=>pg.nextPage(),300);
    }
  });
}

function addResults(results){
  let added=0;
  results.forEach(p=>{
    if(all.find(x=>x.pid===p.place_id))return;
    const is24=detect24(p);
    const oh=p.opening_hours;
    const pl={pid:p.place_id,name:p.name,addr:p.vicinity||'',lat:p.geometry.location.lat(),lng:p.geometry.location.lng(),rating:p.rating||0,rc:p.user_ratings_total||0,is24:is24,isOpen:oh?oh.isOpen():null,photo:p.photos&&p.photos[0]?p.photos[0].getUrl({maxWidth:420,maxHeight:300}):null,mv:0};
    const m=new google.maps.Marker({position:{lat:pl.lat,lng:pl.lng},map:gMap,
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:is24?10:7,fillColor:is24?'#C96B1D':'#7E849E',fillOpacity:.9,strokeColor:'#fff',strokeWeight:is24?2.5:2},
      zIndex:is24?500:100,title:p.name});
    m.addListener('click',()=>loadDP(pl.pid));
    pl._m=m;all.push(pl);added++;
  });
  if(added>0)renderList();
}

function getR(){const b=gMap.getBounds();if(!b)return 12000;return Math.min(50000,Math.abs((b.getNorthEast().lat()-b.getSouthWest().lat())*111000/2));}

function renderList(){
  const q=(document.getElementById('sI').value||'').toLowerCase();
  const bounds=gMap?gMap.getBounds():null;
  let list=all.filter(p=>{
    // MadVet always visible regardless of bounds
    if(!p.mv&&bounds&&!bounds.contains({lat:p.lat,lng:p.lng}))return false;
    if(q&&!p.name.toLowerCase().includes(q)&&!(p.addr||'').toLowerCase().includes(q))return false;
    if(filt==='24h'&&!p.is24)return false;
    if(filt==='open'&&p.isOpen!==true)return false;
    if(filt==='top'&&(p.rating||0)<4.5)return false;
    return true;
  }).sort((a,b)=>(b.mv?10:0)-(a.mv?10:0)||((b.rating||0)*Math.log10((b.rc||1)+1))-((a.rating||0)*Math.log10((a.rc||1)+1)));

  document.getElementById('stT').textContent=list.length;
  document.getElementById('st24').textContent=list.filter(p=>p.is24).length;

  const mvL=list.filter(p=>p.mv),rest=list.filter(p=>!p.mv);
  let h='';
  if(mvL.length){h+=`<div class="sec-l">★ Recomendadas</div>`;mvL.forEach(p=>h+=cH(p));}
  if(rest.length){h+=`<div class="sec-l">En tu zona <span class="n">${rest.length}</span></div>`;rest.forEach(p=>h+=cH(p));}
  if(!list.length)h=`<div style="text-align:center;padding:60px 20px;color:var(--dim)">Sin resultados</div>`;
  document.getElementById('cl').innerHTML=h;
  all.forEach(p=>{if(p._m)p._m.setVisible(list.includes(p));});
}

function cH(p){
  return`<div class="c ${p.mv?'f':''} ${activeId===p.pid?'act':''}" onclick="loadDP('${p.pid}')">
${p.photo?`<img class="c-img" src="${p.photo}" alt="" loading="lazy">`:''}
<div class="c-body"><div class="c-name">${p.name}</div><div class="c-addr">${p.addr}</div>
<div class="c-row"><div class="c-stars">${stH(p.rating)}</div><span class="c-rat">${p.rating||'—'}</span><span class="c-rc">(${(p.rc||0).toLocaleString()})</span>
${p.mv?'<span class="bg bg-mv">★ MadVet</span>':''}${p.is24?'<span class="bg bg-24">🕐 24h</span>':''}${p.isOpen===true&&!p.is24?'<span class="bg bg-op">Abierto</span>':''}${p.isOpen===false?'<span class="bg bg-cl">Cerrado</span>':''}</div>
${p.offer?`<div class="c-offer">🎁 ${p.offer}</div>`:''}
<div class="c-btns"><button class="c-bp" onclick="event.stopPropagation();loadDP('${p.pid}')">Ver clínica</button>${p.ph?`<a class="c-bs" href="tel:${p.ph}" onclick="event.stopPropagation()">📞</a>`:''}<a class="c-bs" href="https://maps.google.com/?daddr=${p.lat},${p.lng}" target="_blank" onclick="event.stopPropagation()">🗺</a></div></div></div>`;
}

function renderFilters(){
  document.getElementById('fbar').innerHTML=[['all','Todas'],['24h','🕐 24h / Urgencias'],['open','✅ Abiertas ahora'],['top','⭐ Top rated']].map(([k,l])=>`<button class="ch ${filt===k?'on':''}" onclick="filt='${k}';renderList();renderFilters()">${l}</button>`).join('');
}

function loadDP(pid){
  activeId=pid;renderList();
  const p=all.find(x=>x.pid===pid);
  if(p){gMap.panTo({lat:p.lat,lng:p.lng});if(gMap.getZoom()<14)gMap.setZoom(14);}
  document.getElementById('ov').classList.add('on');document.getElementById('dp').classList.add('on');
  document.getElementById('dp').innerHTML=`<div style="display:grid;place-items:center;height:200px"><div class="ld-s"></div></div>`;
  gSvc.getDetails({placeId:pid,fields:['name','formatted_address','formatted_phone_number','website','opening_hours','reviews','photos','rating','user_ratings_total','url']},(d,s)=>{
    if(s===google.maps.places.PlacesServiceStatus.OK)renderDP(d,p);
  });
}

function renderDP(d,p){
  const nm=d.name||p?.name||'',addr=d.formatted_address||p?.addr||'',ph=d.formatted_phone_number||p?.ph||'',web=d.website||p?.web||'',rat=d.rating||p?.rating||0,rc=d.user_ratings_total||p?.rc||0,gUrl=d.url||'',photos=d.photos||[],reviews=d.reviews||[],hrs=d.opening_hours;
  // Re-check 24h from detail data
  let is24=p?.is24||false;
  if(hrs&&hrs.periods&&hrs.periods.length===1&&!hrs.periods[0].close)is24=true;
  if(hrs&&hrs.weekday_text&&hrs.weekday_text.some(t=>t.toLowerCase().includes('24')))is24=true;

  let h=`<button class="dp-x" onclick="closeDP()">✕</button>`;
  if(photos.length){h+=`<div class="dp-gallery">`;photos.slice(0,6).forEach(ph=>{h+=`<img src="${ph.getUrl({maxWidth:500,maxHeight:350})}" alt="" loading="lazy">`;});h+=`</div>`;}
  h+=`<div class="dp-h"><div class="dp-name">${nm}</div><div class="dp-addr">${addr}</div>`;
  h+=`<div class="dp-mr"><div class="c-stars">${stH(rat)}</div><span class="c-rat" style="font-size:15px">${rat}</span><span class="c-rc">${rc.toLocaleString()} reseñas</span>`;
  if(p?.mv)h+=`<span class="bg bg-mv">★ MadVet</span>`;
  if(is24)h+=`<span class="bg bg-24">🕐 24h</span>`;
  h+=`</div></div><div class="dp-d">`;
  if(hrs?.weekday_text){h+=`<div class="dp-st">🕐 Horario</div><div class="dp-hrs">`;hrs.weekday_text.forEach(row=>{const[day,...rest]=row.split(': ');h+=`<div class="dp-hr"><span>${day}</span><strong>${rest.join(': ')}</strong></div>`;});h+=`</div>`;}
  if(ph)h+=`<div style="font:500 13.5px/1.5 var(--f);color:var(--sub);margin-bottom:6px">📞 <a href="tel:${ph}" style="color:var(--g1);text-decoration:none;font-weight:600">${ph}</a></div>`;
  if(web)h+=`<div style="margin-bottom:14px"><a href="${web}" target="_blank" style="font:600 12.5px/1 var(--f);color:var(--g1);text-decoration:none">🌐 ${web.replace(/https?:\/\/(www\.)?/,'').split('/')[0]} →</a></div>`;
  if(p?.offer)h+=`<div class="c-offer" style="margin-bottom:14px">🎁 ${p.offer}</div>`;
  h+=`<div class="dp-btns">${ph?`<a class="dp-b1" href="tel:${ph}">📞 Llamar</a>`:''}<a class="dp-b2" href="${gUrl||`https://maps.google.com/?q=${p?.lat},${p?.lng}`}" target="_blank">🗺️ Cómo llegar</a></div>`;
  if(reviews.length){h+=`<div class="dp-st">💬 Reseñas</div>`;reviews.slice(0,5).forEach(r=>{h+=`<div class="rv"><div class="rv-top"><span class="rv-n">${r.author_name}</span><span class="rv-s">${stT(r.rating)}</span></div><div class="rv-t">${(r.text||'').substring(0,220)}${(r.text||'').length>220?'...':''}</div></div>`;});}
  h+=`</div>`;document.getElementById('dp').innerHTML=h;

  // Update is24 in data if detected from details
  if(is24&&p&&!p.is24){p.is24=true;if(p._m)p._m.setIcon({path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:'#C96B1D',fillOpacity:.9,strokeColor:'#fff',strokeWeight:2.5});renderList();}
}

function closeDP(){document.getElementById('ov').classList.remove('on');document.getElementById('dp').classList.remove('on');activeId=null;renderList();}

function showEmg(){
  const h24=all.filter(p=>p.is24||p.mv).sort((a,b)=>(b.mv?1:0)-(a.mv?1:0)||((b.rating||0)-(a.rating||0)));
  document.getElementById('ov').classList.add('on');document.getElementById('dp').classList.add('on');
  let h=`<button class="dp-x" onclick="closeDP()">✕</button><div style="padding:24px 22px"><div style="text-align:center;margin-bottom:24px"><div style="width:56px;height:56px;border-radius:50%;background:var(--redBg);display:grid;place-items:center;margin:0 auto 12px;font-size:24px">🚨</div><div style="font:800 22px/1 var(--fH)">Urgencias 24h</div><div style="font:400 13px/1 var(--f);color:var(--dim);margin-top:6px">${h24.length} centros disponibles</div></div>`;
  h24.forEach(c=>{h+=`<div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);margin-bottom:8px;border:1.5px solid ${c.mv?'rgba(10,117,88,.25)':'var(--brd)'};background:${c.mv?'var(--gL)':'var(--card)'}"><div style="flex:1;min-width:0"><div style="font:700 14px/1.2 var(--fH);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</div><div style="font:400 11.5px/1.3 var(--f);color:var(--dim);margin-top:3px">${c.addr}</div><div style="margin-top:6px"><span style="color:var(--gold);font-size:12px">${stT(c.rating)}</span> <b style="font:700 12px/1 var(--fH)">${c.rating||'—'}</b></div></div><div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">${c.ph?`<a href="tel:${c.ph}" style="padding:10px 18px;border-radius:var(--rS);background:linear-gradient(135deg,var(--red),#A22D3B);color:#fff;font:700 12px/1 var(--f);text-decoration:none;text-align:center">📞 Llamar</a>`:`<a onclick="loadDP('${c.pid}');return false" href="#" style="padding:10px 18px;border-radius:var(--rS);background:linear-gradient(135deg,var(--red),#A22D3B);color:#fff;font:700 12px/1 var(--f);text-decoration:none;text-align:center;cursor:pointer">📞 Ver</a>`}<a href="https://maps.google.com/?daddr=${c.lat},${c.lng}" target="_blank" style="padding:8px 18px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);font:500 11px/1 var(--f);text-decoration:none;color:var(--sub);text-align:center">🗺️ Ruta</a></div></div>`;});
  h+=`</div>`;document.getElementById('dp').innerHTML=h;
}
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBSRTPwJozA8jJKk3a09r3N82ftCFex8gM&libraries=places&callback=initMap" async defer></script>
</body>
</html>
