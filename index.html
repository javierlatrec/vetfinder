<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0B6B50">
<meta name="description" content="Encuentra clínicas veterinarias cerca de ti en Madrid. Urgencias 24h, valoraciones y más.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VetFinder">
<title>VetFinder — Tu veterinario, siempre cerca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700;800;900&family=General+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --pri:#0B6B50;--priL:#0E8C68;--priD:#085640;--priGlow:rgba(11,107,80,.12);
  --accent:#E8A427;--accentBg:#FEF7E8;
  --bg:#F4F3EF;--bgW:#FAFAF8;--card:#FFFFFF;
  --txt:#1A1D2B;--sub:#4A4F65;--dim:#8B90A6;--lt:#B8BCD0;--xlt:#D5D8E3;
  --brd:#E6E8EE;--brdL:#F0F1F5;
  --red:#C93B4A;--redBg:#FEF0F1;
  --orange:#C96B1D;--orangeBg:#FEF3EA;
  --green:#0B6B50;--greenBg:#EEF8F4;
  --wa:#25D366;--waBg:#E8FCF0;
  --sh:0 1px 2px rgba(26,29,43,.04);
  --shM:0 4px 12px rgba(26,29,43,.06),0 1px 3px rgba(26,29,43,.04);
  --shL:0 8px 32px rgba(26,29,43,.08),0 2px 8px rgba(26,29,43,.04);
  --shXL:0 20px 60px rgba(26,29,43,.12),0 4px 16px rgba(26,29,43,.06);
  --r:14px;--rS:10px;--rXS:7px;
  --f:'General Sans','Satoshi',system-ui,-apple-system,sans-serif;
  --fH:'Satoshi','General Sans',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.56,.64,1)
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg);color:var(--txt);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--xlt);border-radius:2px}

header{display:flex;align-items:center;gap:16px;padding:0 20px;height:60px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid rgba(230,232,238,.6);z-index:1000;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0;text-decoration:none}
.logo-i{width:36px;height:36px;background:var(--pri);border-radius:10px;display:grid;place-items:center;position:relative;overflow:hidden}
.logo-i::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15) 0%,transparent 50%)}
.logo-i svg{width:18px;height:18px;fill:#fff;position:relative;z-index:1}
.logo-t{font:800 19px/1 var(--fH);letter-spacing:-.7px}.logo-t span{color:var(--pri)}
.srch{flex:1;max-width:400px;position:relative}
.srch input{width:100%;height:42px;padding:0 16px 0 40px;border:1.5px solid var(--brd);border-radius:var(--rS);background:var(--bgW);font:500 13.5px var(--f);color:var(--txt);outline:none;transition:all .2s var(--ease)}
.srch input:focus{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px var(--priGlow)}
.srch input::placeholder{color:var(--lt);font-weight:400}
.srch-ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--lt);pointer-events:none;transition:color .2s}
.srch input:focus ~ .srch-ic{color:var(--pri)}
.hdr-stats{display:flex;gap:20px;margin-left:auto;align-items:center}
.hdr-stat b{display:block;font:800 19px/1 var(--fH);color:var(--pri);letter-spacing:-.5px}
.hdr-stat small{font:500 8px/1 var(--f);color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;margin-top:3px;display:block;text-align:center}

.wrap{display:flex;flex:1;overflow:hidden}
.side{width:440px;min-width:440px;display:flex;flex-direction:column;background:var(--card);z-index:500;border-right:1px solid var(--brd)}

.fbar{padding:10px 14px 6px;border-bottom:none;display:flex;gap:6px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;flex-shrink:0;position:relative;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}.fbar::-webkit-scrollbar{display:none}
.svc-bar{padding:0 14px 10px;border-bottom:1px solid var(--brd);display:flex;gap:5px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none;flex-shrink:0;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}.svc-bar::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 16px;border-radius:17px;font:600 12px/34px var(--f);cursor:pointer;border:1.5px solid var(--brd);background:var(--card);color:var(--dim);transition:all .2s var(--ease);white-space:nowrap;flex-shrink:0}
.chip:hover{border-color:var(--priL);color:var(--priL)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(11,107,80,.25)}
.chip-s{height:28px;padding:0 12px;border-radius:14px;font:500 11px/28px var(--f);cursor:pointer;border:1px solid var(--brd);background:var(--card);color:var(--dim);transition:all .15s;white-space:nowrap;flex-shrink:0}
.chip-s:hover{border-color:var(--priL);color:var(--priL)}
.chip-s.on{background:var(--greenBg);color:var(--pri);border-color:rgba(11,107,80,.2)}
.chip-fav{border-color:var(--red);color:var(--red)}.chip-fav.on{background:var(--redBg);color:var(--red);border-color:var(--red)}

.sbar{padding:7px 14px;border-bottom:1px solid var(--brd);display:flex;gap:4px;align-items:center;background:var(--bgW);flex-shrink:0}
.sbar-label{margin-right:6px;font:600 10px/1 var(--f);color:var(--sub);text-transform:uppercase;letter-spacing:.8px}
.so{padding:5px 12px;border-radius:12px;font:600 11px/1 var(--f);cursor:pointer;border:none;background:none;color:var(--dim);transition:all .15s}
.so:hover{color:var(--pri)}.so.on{background:var(--card);color:var(--pri);box-shadow:var(--sh);border:1px solid var(--brd)}

.cl{flex:1;overflow-y:auto;padding:6px 0;scroll-behavior:smooth}

.sec-l{padding:16px 16px 8px;display:flex;align-items:center;gap:10px}
.sec-l-txt{font:700 10px/1 var(--fH);letter-spacing:1.8px;text-transform:uppercase;color:var(--dim)}
.sec-l::after{content:'';flex:1;height:1px;background:var(--brd)}
.sec-l .cnt{background:var(--greenBg);color:var(--pri);font:700 10px/1 var(--f);padding:3px 10px;border-radius:10px}

/* CARDS */
.c{margin:4px 10px;border:1.5px solid var(--brd);border-radius:var(--r);cursor:pointer;transition:all .25s var(--ease);position:relative;overflow:hidden;background:var(--card)}
.c:hover{border-color:rgba(11,107,80,.25);box-shadow:var(--shM);transform:translateY(-1px)}
.c.ft{border-color:rgba(11,107,80,.2);background:linear-gradient(175deg,#FDFFFE 0%,#F5FAF8 100%)}
.c.ft::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),var(--priL));z-index:2}
.c.act{border-color:var(--pri);box-shadow:0 0 0 3px var(--priGlow),var(--shM)}
.c-img-w{width:100%;height:140px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brdL),var(--bg))}
.c-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
.c:hover .c-img{transform:scale(1.03)}
/* Placeholder for cards without photo */
.c-img-ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#0E8C68 0%,#0B6B50 100%);position:relative;overflow:hidden}
.c-img-ph::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.18),transparent 50%)}
.c-img-ph-letter{font:800 48px/1 var(--fH);color:rgba(255,255,255,.95);letter-spacing:-2px;position:relative;z-index:1}
.c.ft .c-img-ph{background:linear-gradient(135deg,#0E8C68 0%,#085640 100%)}
/* MadVet featured cards get larger photos for visual prominence */
.c.ft .c-img-w{height:180px}
/* Fav heart on image */
.c-fav{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);border:none;cursor:pointer;display:grid;place-items:center;font-size:16px;z-index:3;transition:all .2s;box-shadow:var(--sh)}
.c-fav:hover{transform:scale(1.1)}.c-fav.liked{background:var(--red);color:#fff}
/* Share on image */
.c-share{position:absolute;top:8px;right:54px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);border:none;cursor:pointer;display:grid;place-items:center;font-size:14px;z-index:3;transition:all .2s;box-shadow:var(--sh)}
.c-share:hover{transform:scale(1.1)}

.c-body{padding:14px 16px 16px}
.c-name{font:700 14.5px/1.3 var(--fH);letter-spacing:-.3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-addr{font:400 11.5px/1.4 var(--f);color:var(--dim);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Service tags */
.c-svcs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.svc-tag{font:500 9.5px/1 var(--f);padding:3px 8px;border-radius:4px;background:var(--brdL);color:var(--sub);white-space:nowrap}

.c-meta{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.c-stars{display:flex;gap:0}.c-stars svg{width:13px;height:13px}
.c-rat{font:700 13px/1 var(--fH)}.c-rc{font:400 11.5px/1 var(--f);color:var(--dim)}
.c-dist{font:500 11px/1 var(--f);color:var(--priL);background:var(--greenBg);padding:3px 8px;border-radius:6px}
.bg{font:700 9px/1 var(--f);padding:4px 9px;border-radius:5px;display:inline-flex;align-items:center;gap:3px;letter-spacing:.3px;text-transform:uppercase}
.bg-mv{background:var(--pri);color:#fff}.bg-24{background:var(--orangeBg);color:var(--orange)}
.bg-op,.bg-open-now{background:#D4F4E2;color:#085640;box-shadow:inset 0 0 0 1px rgba(11,107,80,.18)}
.bg-cl{background:#FFE0E4;color:#A02838;box-shadow:inset 0 0 0 1px rgba(201,59,74,.2)}
.bg-soon{background:#FFE9D4;color:#9A4F0F;box-shadow:inset 0 0 0 1px rgba(201,107,29,.2)}

.c-offer{display:flex;align-items:center;gap:6px;padding:8px 11px;background:var(--accentBg);border-radius:var(--rXS);margin-bottom:10px;font:600 11px/1.3 var(--f);color:#9A7415;border:1px solid rgba(232,164,39,.12)}

.c-btns{display:flex;gap:6px}
.c-bp{flex:1;height:42px;border-radius:var(--rS);border:none;background:var(--pri);color:#fff;font:700 13px/42px var(--f);cursor:pointer;transition:all .15s;text-align:center}
.c-bp:hover{background:var(--priL)}
.c-bwa{width:42px;height:42px;border-radius:var(--rS);border:none;background:var(--wa);cursor:pointer;display:grid;place-items:center;transition:all .15s;text-decoration:none;flex-shrink:0}
.c-bwa:hover{opacity:.85}
.c-bwa svg{width:20px;height:20px;fill:#fff}
.c-bs{width:42px;height:42px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);cursor:pointer;display:grid;place-items:center;font-size:15px;transition:all .15s;text-decoration:none;color:var(--sub);flex-shrink:0}
.c-bs:hover{border-color:var(--pri);color:var(--pri);background:var(--greenBg)}

/* CTA BANNER */
.cta{margin:8px 10px;border-radius:var(--r);padding:20px;background:linear-gradient(135deg,var(--pri),#0D8A65);color:#fff;position:relative;overflow:hidden}
.cta::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.08)}
.cta-title{font:800 16px/1.2 var(--fH);margin-bottom:6px;letter-spacing:-.3px}
.cta-text{font:400 12px/1.4 var(--f);opacity:.85;margin-bottom:14px}
.cta-btns{display:flex;gap:8px}
.cta-btn{height:36px;padding:0 20px;border-radius:18px;border:none;font:700 12px/36px var(--f);cursor:pointer;text-decoration:none;display:inline-block;transition:all .15s}
.cta-btn-w{background:#fff;color:var(--pri)}.cta-btn-w:hover{box-shadow:var(--shM)}
.cta-btn-o{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3)}.cta-btn-o:hover{background:rgba(255,255,255,.25)}

/* MAP */
.map-w{flex:1;position:relative}
#map{width:100%;height:100%}
.map-ctrls{position:absolute;top:16px;right:16px;z-index:10;display:flex;flex-direction:column;gap:8px}
.map-btn{width:42px;height:42px;border-radius:var(--rS);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid rgba(230,232,238,.6);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shM);transition:all .2s;color:var(--sub)}
.map-btn:hover{background:#fff;box-shadow:var(--shL);color:var(--pri)}
.map-btn.locating{animation:pulse-loc 1.2s ease-in-out infinite}
.map-btn svg{width:18px;height:18px}
@keyframes pulse-loc{0%,100%{box-shadow:var(--shM)}50%{box-shadow:0 0 0 6px var(--priGlow),var(--shM)}}

.emg-btn{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;height:48px;padding:0 24px;border-radius:24px;background:var(--red);color:#fff;border:none;font:700 14px/48px var(--f);cursor:pointer;box-shadow:0 4px 20px rgba(201,59,74,.3);display:flex;align-items:center;gap:8px;transition:all .25s var(--ease);letter-spacing:-.2px}
.emg-btn:hover{transform:translateX(-50%) translateY(-2px)}
.emg-dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

.spinner{width:28px;height:28px;border:3px solid var(--brd);border-top-color:var(--pri);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Pulse halo for MadVet pins — radiating concentric rings */
.pulse-halo{position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;pointer-events:none;z-index:0}
.pulse-halo::before,.pulse-halo::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(11,107,80,.35) 0%,rgba(11,107,80,0) 65%);animation:pulseRing 2.4s cubic-bezier(0.4,0,0.6,1) infinite}
.pulse-halo::after{animation-delay:1.2s}
@keyframes pulseRing{
  0%{transform:scale(.4);opacity:.9}
  100%{transform:scale(1.6);opacity:0}
}

/* Hero block on top of sidebar list */
.hero{padding:20px 18px 14px;border-bottom:1px solid var(--brd)}
.hero-eyebrow{font:600 10px/1 var(--f);text-transform:uppercase;letter-spacing:1.4px;color:var(--priL);margin-bottom:6px;display:flex;align-items:center;gap:7px}
.hero-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--priL);box-shadow:0 0 0 0 var(--priL);animation:livePulse 2s ease-in-out infinite}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(14,140,104,.6)}50%{box-shadow:0 0 0 6px rgba(14,140,104,0)}}
.hero-title{font:800 22px/1.2 var(--fH);letter-spacing:-.6px;color:var(--txt);margin-bottom:4px}
.hero-sub{font:500 13px/1.4 var(--f);color:var(--sub)}
.hero-sub b{color:var(--pri);font-weight:700}
@media(max-width:480px){.hero{padding:14px 14px 10px}.hero-title{font-size:19px}}
.skel{margin:4px 10px;border:1.5px solid var(--brd);border-radius:var(--r);overflow:hidden;background:var(--card)}
.skel-img{width:100%;height:130px;background:linear-gradient(90deg,var(--brdL) 25%,var(--bg) 50%,var(--brdL) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
.skel-body{padding:14px 16px 16px}
.skel-line{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--brdL) 25%,var(--bg) 50%,var(--brdL) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;margin-bottom:8px}
.skel-line.w70{width:70%}.skel-line.w50{width:50%}.skel-line.w90{width:90%}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* OVERLAY + DETAIL */
.ov{position:fixed;inset:0;background:rgba(26,29,43,.25);backdrop-filter:blur(4px);z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.dp{position:fixed;top:0;right:0;bottom:0;width:480px;background:var(--card);z-index:2001;transform:translateX(100%);transition:transform .4s var(--ease);overflow-y:auto;box-shadow:var(--shXL)}
.dp.on{transform:translateX(0)}
.dp-x{position:absolute;top:14px;right:14px;z-index:10;width:38px;height:38px;border-radius:var(--rXS);background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.5);cursor:pointer;display:grid;place-items:center;color:var(--sub);box-shadow:var(--shM);transition:all .15s}
.dp-x:hover{background:#fff;color:var(--txt)}
.dp-x svg{width:16px;height:16px}
.dp-gallery{display:flex;gap:3px;overflow-x:auto;scroll-snap-type:x mandatory;-ms-overflow-style:none;scrollbar-width:none}.dp-gallery::-webkit-scrollbar{display:none}
.dp-gallery img{height:200px;min-width:200px;object-fit:cover;flex-shrink:0;scroll-snap-align:start}.dp-gallery img:first-child{min-width:260px}
.dp-h{padding:20px 24px 16px}
.dp-name{font:800 22px/1.2 var(--fH);letter-spacing:-.6px;margin-bottom:5px}
.dp-addr{font:400 13px/1.4 var(--f);color:var(--dim);margin-bottom:12px}
.dp-badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dp-sec{border-top:1px solid var(--brd);padding:20px 24px}
.dp-st{font:700 14px/1 var(--fH);margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.dp-hrs{background:var(--bgW);border-radius:var(--rS);padding:14px 16px;margin-bottom:16px}
.dp-hr{display:flex;justify-content:space-between;font:400 12.5px/1 var(--f);padding:5px 0;color:var(--sub)}
.dp-hr strong{font-weight:600;color:var(--txt)}
.dp-hr.today{color:var(--pri);font-weight:600}.dp-hr.today strong{color:var(--pri)}
.dp-btns{display:flex;gap:8px;margin-bottom:16px}
.dp-b1{flex:1;height:48px;border-radius:var(--r);border:none;background:var(--pri);color:#fff;font:700 14px/48px var(--f);cursor:pointer;text-align:center;text-decoration:none;display:block;transition:all .15s}
.dp-b1:hover{background:var(--priL)}
.dp-bwa{flex:1;height:48px;border-radius:var(--r);border:none;background:var(--wa);color:#fff;font:700 14px/48px var(--f);text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.dp-bwa:hover{opacity:.9}
.dp-bwa svg{width:20px;height:20px;fill:#fff}
.dp-b2{flex:1;height:48px;border-radius:var(--r);border:1.5px solid var(--brd);background:var(--card);color:var(--sub);font:600 14px/46px var(--f);text-align:center;text-decoration:none;display:block;transition:all .15s}
.dp-b2:hover{border-color:var(--pri);color:var(--pri)}
.rv{padding:14px;background:var(--bgW);border-radius:var(--rS);margin-bottom:8px;border:1px solid var(--brdL)}
.rv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rv-n{font:600 12.5px/1 var(--f)}.rv-s{color:var(--accent);font-size:11px;letter-spacing:-1px}
.rv-t{font:400 12.5px/1.55 var(--f);color:var(--sub)}
.empty{text-align:center;padding:60px 20px;color:var(--dim);font:500 13.5px/1.4 var(--f)}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);z-index:3000;padding:10px 20px;border-radius:var(--rS);background:var(--txt);color:#fff;font:600 13px/1 var(--f);box-shadow:var(--shL);opacity:0;transition:all .3s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* MOBILE */
@media(max-width:960px){
  .hdr-stats{display:none}
  .srch{max-width:none}
  header{padding:0 14px;height:54px;gap:12px}
  .logo-t{font-size:17px}
  .wrap{flex-direction:column;position:relative}
  .map-w{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1}

// ═══ HOURS CACHE (TTL 7 days, periods only — recompute live status) ═══
const HOURS_TTL=7*24*3600*1000;
let hoursCache={};
try{hoursCache=JSON.parse(localStorage.getItem('vf_hours_v1')||'{}')}catch(e){}
let hoursCacheDirty=false;
function saveHoursCache(){if(!hoursCacheDirty)return;hoursCacheDirty=false;try{localStorage.setItem('vf_hours_v1',JSON.stringify(hoursCache))}catch(e){}}
setInterval(saveHoursCache,3000);
function applyCachedHours(p){
  const c=hoursCache[p.pid];
  if(!c||Date.now()-c.ts>HOURS_TTL)return false;
  const st=getOpenStatus({periods:c.periods});
  if(st){p.openStatus=st;p.isOpen=st.open;return true}
  return false;
}
function lazyFetchHours(p){
  if(p._hoursPending||p.openStatus)return;
  if(applyCachedHours(p))return;
  p._hoursPending=true;
  gSvc.getDetails({placeId:p.pid,fields:['opening_hours']},(d,s)=>{
    if(s!==google.maps.places.PlacesServiceStatus.OK||!d||!d.opening_hours){p._hoursPending=false;return}
    if(d.opening_hours.periods&&d.opening_hours.periods.length){
      hoursCache[p.pid]={periods:d.opening_hours.periods,ts:Date.now()};
      hoursCacheDirty=true;
    }
    const st=getOpenStatus(d.opening_hours);
    if(st){p.openStatus=st;p.isOpen=st.open;renderList()}
    p._hoursPending=false;
  });
}

// ═══ HELPERS ═══
const stH=r=>{let s='';for(let i=1;i<=5;i++){const f=i<=Math.round(r||0);s+=`<svg viewBox="0 0 24 24" fill="${f?'#E8A427':'none'}" stroke="${f?'#E8A427':'#D5D8E3'}" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`}return s};
const stT=r=>'★'.repeat(Math.round(r||0))+'☆'.repeat(5-Math.round(r||0));
function hav(lat1,lng1,lat2,lng2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function fmtD(km){return km<1?Math.round(km*1000)+' m':km<10?km.toFixed(1)+' km':Math.round(km)+' km'}
// Compute dynamic open status from Places periods. Returns {open:bool, label:string, urgent:bool} or null.
function getOpenStatus(oh){
  if(!oh||!oh.periods||!oh.periods.length)return null;
  const now=new Date(),day=now.getDay(),hr=now.getHours(),mn=now.getMinutes(),nowMin=hr*60+mn;
  // 24h: single period with no close
  if(oh.periods.length===1&&oh.periods[0].open&&!oh.periods[0].close)return{open:true,label:'Abierto 24h',urgent:false};
  // Find today's periods
  const todays=oh.periods.filter(p=>p.open&&p.open.day===day);
  for(const p of todays){
    const oMin=p.open.hours*60+(p.open.minutes||0);
    let cMin=p.close?p.close.hours*60+(p.close.minutes||0):24*60;
    if(p.close&&p.close.day!==p.open.day)cMin+=24*60;
    if(nowMin>=oMin&&nowMin<cMin){
      const left=cMin-nowMin;
      if(left<=60)return{open:true,label:`Cierra en ${left}min`,urgent:true};
      const ch=Math.floor(cMin/60)%24,cm=cMin%60;
      return{open:true,label:`Cierra ${String(ch).padStart(2,'0')}:${String(cm).padStart(2,'0')}`,urgent:false};
    }
  }
  // Closed — find next opening
  for(let d=0;d<7;d++){
    const checkDay=(day+d)%7;
    const next=oh.periods.find(p=>p.open&&p.open.day===checkDay&&(d>0||p.open.hours*60+(p.open.minutes||0)>nowMin));
    if(next){
      const oh2=next.open.hours,om2=next.open.minutes||0;
      if(d===0)return{open:false,label:`Abre ${String(oh2).padStart(2,'0')}:${String(om2).padStart(2,'0')}`,urgent:false};
      if(d===1)return{open:false,label:`Abre mañana ${String(oh2).padStart(2,'0')}:${String(om2).padStart(2,'0')}`,urgent:false};
      return{open:false,label:'Cerrado',urgent:false};
    }
  }
  return{open:false,label:'Cerrado',urgent:false};
}
function detect24(place){
  const nm=(place.name||'').toLowerCase();
  if(['24h','24 h','24 hora','urgencia','emergency','emergencia'].some(k=>nm.includes(k)))return true;
  const oh=place.opening_hours;
  if(oh&&oh.periods&&oh.periods.length===1){const p=oh.periods[0];if(p.open&&p.open.day===0&&p.open.hours===0&&p.open.minutes===0&&!p.close)return true}
  if(nm.includes('hospital')&&(nm.includes('vet')||nm.includes('animal')))return true;
  return false;
}

}

    ]
  });
  gSvc=new google.maps.places.PlacesService(gMap);

  // Custom OverlayView for animated pulse halos on MadVet pins
  class PulseHalo extends google.maps.OverlayView{
    constructor(pos){super();this.pos=pos;this.div=null;}
    onAdd(){this.div=document.createElement('div');this.div.className='pulse-halo';this.getPanes().overlayMouseTarget.appendChild(this.div);this.div.style.pointerEvents='none';}
    draw(){if(!this.div)return;const proj=this.getProjection();if(!proj)return;const p=proj.fromLatLngToDivPixel(new google.maps.LatLng(this.pos.lat,this.pos.lng));this.div.style.position='absolute';this.div.style.left=p.x+'px';this.div.style.top=p.y+'px';}

  }

    {lat:40.48,lng:-3.37,r:8000},{lat:40.36,lng:-3.53,r:8000},{lat:40.33,lng:-3.86,r:8000},
    {lat:40.24,lng:-3.77,r:8000},{lat:40.40,lng:-3.60,r:8000},{lat:40.64,lng:-4.02,r:8000},
    {lat:40.66,lng:-3.77,r:8000}
  ];
  zones.forEach((z,i)=>setTimeout(()=>searchZone(z.lat,z.lng,z.r),i*400));

    renderList();
    const c=gMap.getCenter(),key=Math.round(c.lat()*50)+','+Math.round(c.lng()*50);
    if(!searched.has(key)){searched.add(key);searchZone(c.lat(),c.lng(),getR())}
  });
  renderFilters();locateUser(true);initSheet();initPWA();
  // Pre-fetch hours & photos for MadVet clinics (single request per clinic, low cost, big visual win)
  setTimeout(()=>{
    MV.forEach((mv,i)=>setTimeout(()=>{
      gSvc.getDetails({placeId:mv.pid,fields:['opening_hours','photos']},(d,s)=>{
        if(s!==google.maps.places.PlacesServiceStatus.OK)return;
        const target=all.find(x=>x.pid===mv.pid);if(!target)return;
        let changed=false;
        if(d.opening_hours){
          const st=getOpenStatus(d.opening_hours);
          if(st){target.openStatus=st;target.isOpen=st.open;changed=true}
        }
        if(d.photos&&d.photos[0]&&!target.photo){
          target.photo=d.photos[0].getUrl({maxWidth:600,maxHeight:400});
          changed=true;
        }
        if(changed)renderList();

    },i*200));
  },1500);
}
function searchZone(lat,lng,radius){
  const key=Math.round(lat*50)+','+Math.round(lng*50);
  if(searched.has(key))return;searched.add(key);
  gSvc.nearbySearch({location:{lat,lng},radius,type:'veterinary_care'},(res,st,pg)=>{
    if(st===google.maps.places.PlacesServiceStatus.OK){addResults(res);if(pg&&pg.hasNextPage)setTimeout(()=>pg.nextPage(),300)}
  });
}
function addResults(results){
  let n=0;
  results.forEach(p=>{
    if(all.find(x=>x.pid===p.place_id))return;
    const is24=detect24(p),oh=p.opening_hours;
    let isOpen=null;
    try{if(oh&&typeof oh.isOpen==='function')isOpen=oh.isOpen()}catch(e){}
    const cl={pid:p.place_id,name:p.name,addr:p.vicinity||'',lat:p.geometry.location.lat(),lng:p.geometry.location.lng(),rating:p.rating||0,rc:p.user_ratings_total||0,is24,isOpen,openStatus:null,photo:p.photos&&p.photos[0]?p.photos[0].getUrl({maxWidth:420,maxHeight:300}):null,mv:0,svcs:[]};
    // Try cache first — avoids a network roundtrip
    applyCachedHours(cl);
    const m=new google.maps.Marker({position:{lat:cl.lat,lng:cl.lng},map:gMap,icon:mkIcon(is24?'24h':'def'),zIndex:is24?500:100,title:p.name});
    m.addListener('click',()=>loadDP(cl.pid));cl._m=m;all.push(cl);n++;
  });
  if(n>0)renderList();
}
function getR(){const b=gMap.getBounds();if(!b)return 12000;return Math.min(50000,Math.abs((b.getNorthEast().lat()-b.getSouthWest().lat())*111000/2))}

  const btn=document.getElementById('locBtn');btn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(pos=>{
    uLat=pos.coords.latitude;uLng=pos.coords.longitude;
    btn.classList.remove('locating');btn.style.color='var(--pri)';
    if(uMarker)uMarker.setMap(null);
    uMarker=new google.maps.Marker({position:{lat:uLat,lng:uLng},map:gMap,icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:'#3B82F6',fillOpacity:1,strokeColor:'#fff',strokeWeight:3},zIndex:2000,title:'Tu ubicación'});
    if(!silent){gMap.panTo({lat:uLat,lng:uLng});gMap.setZoom(13)}
    renderList();renderFilters();
  },()=>{btn.classList.remove('locating')},{enableHighAccuracy:true,timeout:8000});
}

// ═══ BOTTOM SHEET ═══
let sheetSnap='half';
function initSheet(){
  if(window.innerWidth>960)return;
  const sheet=document.getElementById('sheet');
  const handle=document.getElementById('sheetHandle');
  const summary=document.getElementById('sheetSummary');
  const cl=document.getElementById('cl');
  let startY,dragStartH,dragging=false;
  function getSnaps(){const wh=document.querySelector('.wrap').offsetHeight;return{peek:Math.round(wh*0.28),half:Math.round(wh*0.55),full:Math.round(wh*0.95)}}
  function setSnap(s){
    sheetSnap=s;const snaps=getSnaps();
    sheet.style.transition='height .35s '+getComputedStyle(document.documentElement).getPropertyValue('--ease');
    sheet.style.height=snaps[s]+'px';sheet.classList.toggle('is-full',s==='full');
    const hint=document.getElementById('sheetHint');
    if(hint)hint.textContent=s==='peek'?'Desliza ↑':s==='half'?'Ver más ↑':'Desliza ↓';
    setTimeout(()=>{if(gMap)google.maps.event.trigger(gMap,'resize')},380);
  }
  setSnap('half');
  function onStart(e){dragging=true;startY=e.touches?e.touches[0].clientY:e.clientY;dragStartH=sheet.offsetHeight;sheet.style.transition='none';sheet.classList.add('has-interacted')}
  function onMove(e){if(!dragging)return;e.preventDefault();const y=e.touches?e.touches[0].clientY:e.clientY;const snaps=getSnaps();sheet.style.height=Math.max(snaps.peek*0.6,Math.min(snaps.full,dragStartH+(startY-y)))+'px'}
  function onEnd(){if(!dragging)return;dragging=false;snapToClosest()}
  [handle,summary].forEach(el=>{el.addEventListener('touchstart',onStart,{passive:true});el.addEventListener('touchmove',onMove,{passive:false});el.addEventListener('touchend',onEnd)});
  let listPulling=false;
  cl.addEventListener('touchstart',e=>{startY=e.touches[0].clientY;dragStartH=sheet.offsetHeight;listPulling=false},{passive:true});
  cl.addEventListener('touchmove',e=>{const y=e.touches[0].clientY;const dy=y-startY;if(cl.scrollTop<=0&&dy>0){if(!listPulling){listPulling=true;sheet.style.transition='none'}e.preventDefault();const snaps=getSnaps();sheet.style.height=Math.max(snaps.peek*0.6,Math.min(snaps.full,dragStartH-dy))+'px'}else{listPulling=false}},{passive:false});
  cl.addEventListener('touchend',()=>{if(listPulling){listPulling=false;snapToClosest()}});
  function snapToClosest(){const snaps=getSnaps();const h=sheet.offsetHeight;let best='half',minD=Infinity;Object.entries(snaps).forEach(([k,v])=>{const d=Math.abs(h-v);if(d<minD){minD=d;best=k}});if(dragStartH){const delta=h-dragStartH;if(delta>40&&best!=='full'){best=h>snaps.half+30?'full':'half'}if(delta<-40&&best!=='peek'){best=h<snaps.half-30?'peek':'half'}}setSnap(best)}
  document.getElementById('map').addEventListener('click',()=>{if(sheetSnap!=='peek')setSnap('peek')});
  window.addEventListener('resize',()=>{if(window.innerWidth>960){sheet.style.height='';sheet.style.transition='';sheet.classList.remove('is-full')}else setSnap(sheetSnap)});
}

// ═══ FILTERS ═══
function renderFilters(){
  const fc=favs.size?`<button class="chip chip-fav ${filt==='favs'?'on':''}" onclick="filt='favs';renderList();renderFilters()">❤ Favoritos (${favs.size})</button>`:'';
  document.getElementById('fbar').innerHTML=[
    ['all','Todas'],['24h','🕐 24h'],['open','✓ Abiertas'],['top','★ Top']
  ].map(([k,l])=>`<button class="chip ${filt===k?'on':''}" onclick="filt='${k}';renderList();renderFilters()">${l}</button>`).join('')+fc;

  // Service filter bar
  document.getElementById('svcBar').innerHTML=ALL_SVCS.map(s=>
    `<button class="chip-s ${svcFilt===s?'on':''}" onclick="svcFilt=svcFilt==='${s}'?null:'${s}';renderList();renderFilters()">${s}</button>`
  ).join('');

  const sorts=[['best','Relevancia'],['rating','Rating'],['reviews','Reseñas']];
  if(uLat)sorts.push(['dist','Distancia']);
  document.getElementById('sbar').innerHTML=`<span class="sbar-label">Ordenar</span>`+sorts.map(([k,l])=>`<button class="so ${sort===k?'on':''}" onclick="sort='${k}';renderList();renderFilters()">${l}</button>`).join('');
}

// ═══ RENDER LIST ═══
function renderList(){
  const q=(document.getElementById('sI').value||'').toLowerCase();
  const bounds=gMap?gMap.getBounds():null;
  let list=all.filter(p=>{
    if(!p.mv&&bounds&&!bounds.contains({lat:p.lat,lng:p.lng}))return false;
    if(q&&!p.name.toLowerCase().includes(q)&&!(p.addr||'').toLowerCase().includes(q))return false;
    if(filt==='24h'&&!p.is24)return false;
    if(filt==='open'&&p.isOpen!==true)return false;
    if(filt==='top'&&(p.rating||0)<4.5)return false;
    if(filt==='favs'&&!favs.has(p.pid))return false;
    if(svcFilt&&p.svcs&&p.svcs.length&&!p.svcs.includes(svcFilt))return false;
    if(svcFilt&&(!p.svcs||!p.svcs.length))return true; // keep non-MadVet (unknown services)
    return true;
  });
  if(uLat)list.forEach(p=>{p._d=hav(uLat,uLng,p.lat,p.lng)});
  list.sort((a,b)=>{
    if(a.mv&&!b.mv)return -1;if(!a.mv&&b.mv)return 1;
    if(sort==='dist'&&uLat)return(a._d||999)-(b._d||999);
    if(sort==='reviews')return(b.rc||0)-(a.rc||0);
    if(sort==='rating')return(b.rating||0)-(a.rating||0);
    return((b.rating||0)*Math.log10((b.rc||1)+1))-((a.rating||0)*Math.log10((a.rc||1)+1));
  });
  document.getElementById('stT').textContent=list.length;
  document.getElementById('st24').textContent=list.filter(p=>p.is24).length;
  const stm=document.getElementById('stTm');if(stm)stm.textContent=list.length;

  const mvL=list.filter(p=>p.mv),rest=list.filter(p=>!p.mv);
  const openCount=list.filter(p=>p.isOpen===true||p.is24).length;
  const c24=list.filter(p=>p.is24).length;
  const nearMe=!!uLat;
  // Hero block — context-aware copy ("ahora mismo", live counts)
  let h=`<div class="hero">
    <div class="hero-eyebrow">Ahora mismo${nearMe?' · cerca de ti':' · en Madrid'}</div>
    <div class="hero-title">${openCount>0?openCount+' veterinario'+(openCount===1?'':'s')+' '+(openCount===1?'abierto':'abiertos'):list.length+' veterinario'+(list.length===1?'':'s')+' en tu zona'}</div>
    <div class="hero-sub"><b>${list.length}</b> en total${c24>0?` · <b>${c24}</b> con urgencias 24h`:''}${nearMe?'':' · Activa tu ubicación para ordenar por cercanía'}</div>
  </div>`;
  if(mvL.length){h+=`<div class="sec-l"><span class="sec-l-txt">★ Recomendadas</span></div>`;mvL.forEach((p,i)=>h+=cH(p,i*40))}
  if(rest.length){
    h+=`<div class="sec-l"><span class="sec-l-txt">En tu zona</span><span class="cnt">${rest.length}</span></div>`;
    rest.forEach((p,i)=>{
      h+=cH(p,(mvL.length+i)*25);
      // Insert CTA banner every 5 cards
      if((i+1)%5===0 && i<rest.length-1){
        const b=CTA_BANNERS[(Math.floor(i/5))%CTA_BANNERS.length];
        h+=ctaHTML(b);
      }
    });
  }
  if(!list.length)h=`<div class="empty">No se encontraron clínicas<br>con estos filtros</div>`;
  document.getElementById('cl').innerHTML=h;
  all.forEach(p=>{if(p._m)p._m.setVisible(list.includes(p))});

  // Lazy fetch hours for top visible (or hydrate from cache) — keeps open/closed badge fresh
  list.slice(0,15).forEach((p,i)=>{
    if(p.openStatus)return;
    if(applyCachedHours(p)){/* applied from cache, no fetch */}
    else if(!p._hoursPending)setTimeout(()=>lazyFetchHours(p),i*120);
  });
}

function cH(p,delay){
  const dist=(uLat&&p._d)?`<span class="c-dist">${fmtD(p._d)}</span>`:'';
  const isFav=favs.has(p.pid);
  const initial=(p.name||'?').replace(/^(Centro Vet\.|Hospital|Cl[íi]nica)\s+/i,'').trim().charAt(0).toUpperCase();
  const imgOverlay=`<button class="c-fav ${isFav?'liked':''}" onclick="toggleFav('${p.pid}',event)" aria-label="Favorito">${isFav?'❤':'🤍'}</button><button class="c-share" onclick="shareCl(all.find(x=>x.pid==='${p.pid}'),event)" aria-label="Compartir">↗</button>`;
  const imgBlock=p.photo
    ?`<div class="c-img-w"><img class="c-img" src="${p.photo}" alt="" loading="lazy">${imgOverlay}</div>`
    :`<div class="c-img-w"><div class="c-img-ph"><span class="c-img-ph-letter">${initial}</span></div>${imgOverlay}</div>`;
  const svcsHTML=p.svcs&&p.svcs.length?`<div class="c-svcs">${p.svcs.map(s=>`<span class="svc-tag">${s}</span>`).join('')}</div>`:'';
  // Dynamic schedule badge — prefers computed status over deprecated isOpen()
  let schedBadge='';
  if(p.is24){schedBadge='<span class="bg bg-24">24h</span>';}
  else if(p.openStatus){
    const cls=p.openStatus.urgent?'bg-soon':(p.openStatus.open?'bg-open-now':'bg-cl');
    schedBadge=`<span class="bg ${cls}">${p.openStatus.label}</span>`;
  } else if(p.isOpen===true){schedBadge='<span class="bg bg-op">Abierto</span>';}
  else if(p.isOpen===false){schedBadge='<span class="bg bg-cl">Cerrado</span>';}

  return`<div class="c ${p.mv?'ft':''} ${activeId===p.pid?'act':''}" onclick="loadDP('${p.pid}')" style="animation-delay:${Math.min(delay,300)}ms">
${imgBlock}
<div class="c-body"><div class="c-name">${p.name}</div><div class="c-addr">${p.addr}</div>
${svcsHTML}
<div class="c-meta"><div class="c-stars">${stH(p.rating)}</div><span class="c-rat">${p.rating||'—'}</span><span class="c-rc">(${(p.rc||0).toLocaleString()})</span>
${p.mv?'<span class="bg bg-mv">★ MadVet</span>':''}${schedBadge}${dist}</div>
${p.offer?`<div class="c-offer">🎁 ${p.offer}</div>`:''}
<div class="c-btns"><button class="c-bp" onclick="event.stopPropagation();loadDP('${p.pid}')">Ver clínica</button>${p.wa?`<a class="c-bwa" href="https://wa.me/${p.wa}" target="_blank" onclick="event.stopPropagation()" title="WhatsApp" aria-label="WhatsApp">${WA_SVG}</a>`:''}${p.ph?`<a class="c-bs" href="tel:${p.ph}" onclick="event.stopPropagation()" aria-label="Llamar">📞</a>`:''}<a class="c-bs" href="https://maps.google.com/?daddr=${p.lat},${p.lng}" target="_blank" onclick="event.stopPropagation()" aria-label="Cómo llegar">🗺</a></div></div></div>`
}

function ctaHTML(b){
  return`<div class="cta"><div class="cta-title">${b.title}</div><div class="cta-text">${b.text}</div><div class="cta-btns"><a class="cta-btn cta-btn-w" href="${b.url}" target="_blank">${b.btn}</a><a class="cta-btn cta-btn-o" href="https://wa.me/${b.wa}" target="_blank">${b.btn2}</a></div></div>`;
}

// ═══ DETAIL PANEL ═══
function loadDP(pid){
  activeId=pid;renderList();
  const p=all.find(x=>x.pid===pid);
  if(p){gMap.panTo({lat:p.lat,lng:p.lng});if(gMap.getZoom()<14)gMap.setZoom(14)}
  document.getElementById('ov').classList.add('on');document.getElementById('dp').classList.add('on');
  document.getElementById('dp').innerHTML=`<div style="display:grid;place-items:center;height:220px"><div class="spinner"></div></div>`;
  gSvc.getDetails({placeId:pid,fields:['name','formatted_address','formatted_phone_number','website','opening_hours','reviews','photos','rating','user_ratings_total','url']},(d,s)=>{
    if(s===google.maps.places.PlacesServiceStatus.OK)renderDP(d,p);
  });
}
function renderDP(d,p){
  const nm=d.name||p?.name||'',addr=d.formatted_address||p?.addr||'',ph=d.formatted_phone_number||p?.ph||'',web=d.website||p?.web||'',rat=d.rating||p?.rating||0,rc=d.user_ratings_total||p?.rc||0,gUrl=d.url||'',photos=d.photos||[],reviews=d.reviews||[],hrs=d.opening_hours;
  const wa=p?.wa||'';
  let is24=p?.is24||false;
  if(hrs?.periods?.length===1&&!hrs.periods[0].close)is24=true;
  if(hrs?.weekday_text?.some(t=>t.toLowerCase().includes('24')))is24=true;
  const today=new Date().getDay(),dayMap=[6,0,1,2,3,4,5];

  let h=`<button class="dp-x" onclick="closeDP()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>`;
  if(photos.length){h+=`<div class="dp-gallery">`;photos.slice(0,6).forEach(ph=>{h+=`<img src="${ph.getUrl({maxWidth:500,maxHeight:350})}" alt="" loading="lazy">`});h+=`</div>`}
  h+=`<div class="dp-h"><div class="dp-name">${nm}</div><div class="dp-addr">${addr}</div>
  <div class="dp-badges"><div class="c-stars">${stH(rat)}</div><span class="c-rat" style="font-size:15px">${rat}</span><span class="c-rc">${rc.toLocaleString()} reseñas</span>
  ${p?.mv?'<span class="bg bg-mv">★ MadVet</span>':''}${is24?'<span class="bg bg-24">24h</span>':''}${uLat&&p?._d?`<span class="c-dist">${fmtD(p._d)}</span>`:''}</div></div>`;
  if(p?.svcs?.length){h+=`<div style="padding:0 24px 12px;display:flex;gap:4px;flex-wrap:wrap">${p.svcs.map(s=>`<span class="svc-tag">${s}</span>`).join('')}</div>`}
  h+=`<div class="dp-sec">`;
  if(hrs?.weekday_text){
    h+=`<div class="dp-st">🕐 Horario</div><div class="dp-hrs">`;
    hrs.weekday_text.forEach((row,i)=>{const[day,...rest]=row.split(': ');const isT=dayMap[today]===i;h+=`<div class="dp-hr ${isT?'today':''}"><span>${isT?'▸ '+day:day}</span><strong>${rest.join(': ')}</strong></div>`});h+=`</div>`;
  }
  if(ph)h+=`<div style="font:500 13.5px/1.5 var(--f);color:var(--sub);margin-bottom:6px">📞 <a href="tel:${ph}" style="color:var(--pri);text-decoration:none;font-weight:600">${ph}</a></div>`;
  if(web)h+=`<div style="margin-bottom:14px"><a href="${web}" target="_blank" style="font:600 12.5px/1 var(--f);color:var(--pri);text-decoration:none">🌐 ${web.replace(/https?:\/\/(www\.)?/,'').split('/')[0]} →</a></div>`;
  if(p?.offer)h+=`<div class="c-offer" style="margin-bottom:14px">🎁 ${p.offer}</div>`;
  h+=`<div class="dp-btns">`;
  if(wa)h+=`<a class="dp-bwa" href="https://wa.me/${wa}" target="_blank">${WA_SVG} WhatsApp</a>`;
  if(ph)h+=`<a class="dp-b1" href="tel:${ph}">📞 Llamar</a>`;
  h+=`<a class="dp-b2" href="${gUrl||`https://maps.google.com/?q=${p?.lat},${p?.lng}`}" target="_blank">🗺️ Ruta</a></div>`;
  if(reviews.length){h+=`<div class="dp-st">💬 Reseñas</div>`;reviews.slice(0,5).forEach(r=>{h+=`<div class="rv"><div class="rv-top"><span class="rv-n">${r.author_name}</span><span class="rv-s">${stT(r.rating)}</span></div><div class="rv-t">${(r.text||'').substring(0,250)}${(r.text||'').length>250?'…':''}</div></div>`})}
  h+=`</div>`;document.getElementById('dp').innerHTML=h;
  if(is24&&p&&!p.is24){p.is24=true;if(p._m)p._m.setIcon(mkIcon('24h'));renderList()}
  // Compute dynamic open status and propagate to list card
  if(p&&hrs){const st=getOpenStatus(hrs);if(st){p.openStatus=st;p.isOpen=st.open;renderList()}}
}
function closeDP(){document.getElementById('ov').classList.remove('on');document.getElementById('dp').classList.remove('on');activeId=null;renderList()}

// ═══ EMERGENCY — ONLY REAL 24H ═══
function showEmg(){
  if(navigator.vibrate)navigator.vibrate([10,30,10]);
  let h24=all.filter(p=>p.is24);
  if(uLat)h24.sort((a,b)=>hav(uLat,uLng,a.lat,a.lng)-hav(uLat,uLng,b.lat,b.lng));
  else h24.sort((a,b)=>(b.rating||0)-(a.rating||0));
  document.getElementById('ov').classList.add('on');document.getElementById('dp').classList.add('on');
  let h=`<button class="dp-x" onclick="closeDP()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <div style="padding:28px 24px"><div style="text-align:center;margin-bottom:28px">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--redBg);display:grid;place-items:center;margin:0 auto 14px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg></div>
    <div style="font:800 24px/1 var(--fH);letter-spacing:-.6px">Urgencias 24h</div>
    <div style="font:400 13.5px/1.4 var(--f);color:var(--dim);margin-top:8px">${h24.length} centros con atención continua</div></div>`;
  if(!h24.length)h+=`<div style="text-align:center;padding:24px;color:var(--dim);font:500 13px/1.5 var(--f);background:var(--bgW);border-radius:var(--r)">No se encontraron centros 24h en la zona visible del mapa.</div>`;
  h24.forEach(c=>{
    const dist=uLat?fmtD(hav(uLat,uLng,c.lat,c.lng)):'';
    h+=`<div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r);margin-bottom:8px;border:1.5px solid var(--brd);background:var(--card)">
    <div style="flex:1;min-width:0"><div style="font:700 14px/1.2 var(--fH);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</div>
    <div style="font:400 11.5px/1.3 var(--f);color:var(--dim);margin-top:3px">${c.addr}</div>
    <div style="margin-top:8px;display:flex;align-items:center;gap:8px"><span style="color:var(--accent);font-size:12px">${stT(c.rating)}</span><b style="font:700 12px/1 var(--fH)">${c.rating||'—'}</b>${dist?`<span class="c-dist">${dist}</span>`:''}</div></div>
    <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
    ${c.ph?`<a href="tel:${c.ph}" style="padding:10px 20px;border-radius:var(--rS);background:var(--red);color:#fff;font:700 12px/1 var(--f);text-decoration:none;text-align:center">Llamar</a>`:`<a onclick="loadDP('${c.pid}');return false" href="#" style="padding:10px 20px;border-radius:var(--rS);background:var(--red);color:#fff;font:700 12px/1 var(--f);text-decoration:none;text-align:center;cursor:pointer">Ver</a>`}
    <a href="https://maps.google.com/?daddr=${c.lat},${c.lng}" target="_blank" style="padding:8px 20px;border-radius:var(--rS);border:1.5px solid var(--brd);background:var(--card);font:600 11px/1 var(--f);text-decoration:none;color:var(--sub);text-align:center">Ruta</a></div></div>`;
  });
  h+=`</div>`;document.getElementById('dp').innerHTML=h;
}

// ═══ PWA ═══
function initPWA(){
  // Inline manifest
  const manifest={name:"VetFinder",short_name:"VetFinder",description:"Encuentra tu veterinario en Madrid",start_url:"./",display:"standalone",background_color:"#F4F3EF",theme_color:"#0B6B50",icons:[{src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="40" fill="#0B6B50"/><path d="M64.5 71.5a27 27 0 000 38.2L96 141.5l31.5-31.8a27 27 0 00-38.2-38.2L96 78.8l-6.7-7.3a27 27 0 00-24.8 0z" fill="#fff"/></svg>'),sizes:"192x192",type:"image/svg+xml"},{src:"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="100" fill="#0B6B50"/><path d="M172 190a72 72 0 000 102l84 84 84-84a72 72 0 00-102-102L256 208l-18-18a72 72 0 00-66 0z" fill="#fff"/></svg>'),sizes:"512x512",type:"image/svg+xml"}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(blob);document.head.appendChild(link);

  // Service worker for offline caching
  if('serviceWorker' in navigator){
    const swCode=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok&&e.request.url.startsWith('http')){const c=res.clone();caches.open('vf-v3').then(cache=>cache.put(e.request,c))}return res}).catch(()=>new Response('Offline',{status:503}))))})`;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
  }
}
